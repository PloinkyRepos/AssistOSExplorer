name: Deploy Explorer QA

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'AssistOSExplorer branch to deploy'
        required: false
        default: 'ploinky-box'
        type: string
      workspace_name:
        description: 'QA workspace directory name on the proxies/Soul Gateway host'
        required: false
        default: 'explorerQaWorkspace'
        type: string
      router_port:
        description: 'Router port on the remote host'
        required: false
        default: '8097'
        type: string
      public_url:
        description: 'Public QA Explorer URL. Leave empty until DNS/tunnel routing exists.'
        required: false
        default: ''
        type: string
      profile:
        description: 'Ploinky profile to use. Defaults to vars.EXPLORER_QA_PLOINKY_PROFILE, then prod.'
        required: false
        default: ''
        type: string
      proxies_branch:
        description: 'proxies repo branch. Falls back to vars.EXPLORER_QA_PROXIES_BRANCH, then main.'
        required: false
        default: ''
        type: string
      basic_branch:
        description: 'basic repo branch. Falls back to vars.EXPLORER_QA_BASIC_BRANCH, then ploinky-box.'
        required: false
        default: 'ploinky-box'
        type: string
      webmeet_infra_branch:
        description: 'webmeetInfra repo branch. Falls back to vars.EXPLORER_QA_WEBMEET_INFRA_BRANCH, then ploinky-box.'
        required: false
        default: 'ploinky-box'
        type: string
      ploinky_branch:
        description: 'Ploinky runtime branch. Falls back to vars.EXPLORER_QA_PLOINKY_BRANCH, then ploinky-box.'
        required: false
        default: ''
        type: string
      achilles_branch:
        description: 'achillesAgentLib branch. Falls back to vars.EXPLORER_QA_ACHILLES_BRANCH, then master.'
        required: false
        default: ''
        type: string
      ploinky_node_image_tag:
        description: 'Ploinky Node image tag override. Falls back to vars.EXPLORER_QA_PLOINKY_NODE_IMAGE_TAG, then 24-bookworm-tools.'
        required: false
        default: ''
        type: string

concurrency:
  group: deploy-explorer-qa
  cancel-in-progress: false

env:
  SSH_USER: ${{ vars.EXPLORER_QA_SSH_USER || 'admin' }}
  SSH_HOST: ${{ vars.EXPLORER_QA_SSH_HOST || '45.136.70.141' }}
  WORKSPACE: ${{ inputs.workspace_name || vars.EXPLORER_QA_WORKSPACE || 'explorerQaWorkspace' }}
  ROUTER_PORT: ${{ inputs.router_port || vars.EXPLORER_QA_ROUTER_PORT || '8097' }}
  PUBLIC_URL: ${{ inputs.public_url || vars.EXPLORER_QA_PUBLIC_URL || '' }}
  EXPLORER_BRANCH: ${{ inputs.branch || 'ploinky-box' }}
  PLOINKY_PROFILE: ${{ inputs.profile || vars.EXPLORER_QA_PLOINKY_PROFILE || 'prod' }}
  BASIC_BRANCH: ${{ inputs.basic_branch || vars.EXPLORER_QA_BASIC_BRANCH || 'ploinky-box' }}
  WEBMEET_INFRA_BRANCH: ${{ inputs.webmeet_infra_branch || vars.EXPLORER_QA_WEBMEET_INFRA_BRANCH || 'ploinky-box' }}
  WEB_PUBLISHING_BASE_DOMAIN: ${{ vars.EXPLORER_QA_WEB_PUBLISHING_BASE_DOMAIN }}
  # Production services co-located on this host. Used only by the safety guards below.
  SOUL_GATEWAY_WORKSPACE: 'soulGateway'
  SOUL_GATEWAY_ROUTER_PORT: '8080'

jobs:
  deploy:
    name: Deploy or Update Explorer
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Validate GitHub configuration
        env:
          SSH_KEY: ${{ secrets.EXPLORER_QA_SSH_KEY }}
          PLOINKY_MASTER_KEY: ${{ secrets.EXPLORER_QA_PLOINKY_MASTER_KEY }}
          WEB_PUBLISHING_MODE: ${{ vars.EXPLORER_QA_WEB_PUBLISHING_MODE || 'nginx-cloudflare' }}
          WEB_PUBLISHING_BASE_DOMAIN: ${{ vars.EXPLORER_QA_WEB_PUBLISHING_BASE_DOMAIN }}
          WEB_PUBLISHING_TLS_EDGE: ${{ vars.EXPLORER_QA_WEB_PUBLISHING_TLS_EDGE }}
          WEB_PUBLISHING_LIVEKIT_MEDIA_IP: ${{ vars.EXPLORER_QA_WEB_PUBLISHING_LIVEKIT_MEDIA_IP }}
          WEB_PUBLISHING_TURN_EXTERNAL_IP: ${{ vars.EXPLORER_QA_WEB_PUBLISHING_TURN_EXTERNAL_IP }}
          WEB_PUBLISHING_CLOUDFLARED_TUNNEL_TOKEN: ${{ secrets.EXPLORER_QA_WEB_PUBLISHING_CLOUDFLARED_TUNNEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_KEY:-}" ]; then
            echo "::error::Missing required repository secret EXPLORER_QA_SSH_KEY"
            exit 1
          fi
          if [ -z "${PLOINKY_MASTER_KEY:-}" ]; then
            echo "::error::Missing required repository secret EXPLORER_QA_PLOINKY_MASTER_KEY"
            exit 1
          fi
          if ! printf '%s' "$PLOINKY_MASTER_KEY" | grep -Eq '^[A-Fa-f0-9]{64}$'; then
            echo "::error::EXPLORER_QA_PLOINKY_MASTER_KEY must be exactly 64 hex characters"
            exit 1
          fi
          case "$(printf '%s' "${WEB_PUBLISHING_MODE:-nginx-cloudflare}" | tr '[:upper:]' '[:lower:]')" in
            nginx|cloudflare-token|token|nginx-cloudflare) ;;
            cloudflare-api)
              echo "::error::EXPLORER_QA_WEB_PUBLISHING_MODE=cloudflare-api is not supported by this managed deploy workflow because it does not apply external Cloudflare tunnel or DNS mutations. Pre-provision the tunnel and DNS-only turn.${WEB_PUBLISHING_BASE_DOMAIN:-<base-domain>} A record, configure the scoped tunnel token, and use cloudflare-token or nginx-cloudflare."
              exit 1
              ;;
            *)
              echo "::error::EXPLORER_QA_WEB_PUBLISHING_MODE must be nginx, cloudflare-token, token, or nginx-cloudflare"
              exit 1
              ;;
          esac
          if [ -z "${WEB_PUBLISHING_BASE_DOMAIN:-}" ]; then
            echo "::error::Missing required repository variable EXPLORER_QA_WEB_PUBLISHING_BASE_DOMAIN"
            exit 1
          fi
          case "${WEB_PUBLISHING_BASE_DOMAIN}" in
            .*|*.|*/*|*:*|*' '*)
              echo "::error::EXPLORER_QA_WEB_PUBLISHING_BASE_DOMAIN must be a bare DNS domain"
              exit 1
              ;;
          esac
          case "${WEB_PUBLISHING_TLS_EDGE:-}" in
            cloudflare|external) ;;
            none)
              echo "::error::EXPLORER_QA_WEB_PUBLISHING_TLS_EDGE=none is not valid for this public deployment workflow"
              exit 1
              ;;
            *)
              echo "::error::EXPLORER_QA_WEB_PUBLISHING_TLS_EDGE must be cloudflare or external"
              exit 1
              ;;
          esac
          if [ -z "${WEB_PUBLISHING_LIVEKIT_MEDIA_IP:-}" ]; then
            echo "::error::Missing required repository variable EXPLORER_QA_WEB_PUBLISHING_LIVEKIT_MEDIA_IP"
            exit 1
          fi
          if [ -z "${WEB_PUBLISHING_TURN_EXTERNAL_IP:-}" ]; then
            echo "::error::Missing required repository variable EXPLORER_QA_WEB_PUBLISHING_TURN_EXTERNAL_IP"
            exit 1
          fi
          if ! node <<'NODE'
          const { isIP } = require('node:net');

          const domain = process.env.WEB_PUBLISHING_BASE_DOMAIN || '';
          const validLabel = /^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$/;
          const validDomain = (
            domain === domain.trim()
            && domain === domain.toLowerCase()
            && domain.length <= 253
            && domain.split('.').every((label) => validLabel.test(label))
          );

          function validPublicIpv4(value) {
            if (value !== value.trim() || isIP(value) !== 4) return false;
            const [first, second] = value.split('.').map(Number);
            return !(
              first === 0
              || first === 127
              || first >= 224
              || (first === 169 && second === 254)
            );
          }

          if (
            !validDomain
            || !validPublicIpv4(process.env.WEB_PUBLISHING_LIVEKIT_MEDIA_IP || '')
            || !validPublicIpv4(process.env.WEB_PUBLISHING_TURN_EXTERNAL_IP || '')
          ) {
            process.exitCode = 1;
          }
          NODE
          then
            echo "::error::Web Publishing topology must use a canonical lowercase DNS base domain and bare unicast, non-loopback IPv4 media/TURN addresses"
            exit 1
          fi

          case "$(printf '%s' "${WEB_PUBLISHING_MODE:-nginx-cloudflare}" | tr '[:upper:]' '[:lower:]')" in
            cloudflare-token|token|nginx-cloudflare)
              if [ -z "${WEB_PUBLISHING_CLOUDFLARED_TUNNEL_TOKEN:-}" ]; then
                echo "::error::Missing required secret EXPLORER_QA_WEB_PUBLISHING_CLOUDFLARED_TUNNEL_TOKEN for token-mode Web Publishing"
                exit 1
              fi
              ;;
          esac
          case "$(printf '%s' "${WEB_PUBLISHING_MODE:-nginx-cloudflare}" | tr '[:upper:]' '[:lower:]'):${WEB_PUBLISHING_TLS_EDGE}" in
            nginx:external|cloudflare-token:cloudflare|token:cloudflare|nginx-cloudflare:cloudflare) ;;
            nginx:*)
              echo "::error::EXPLORER_QA_WEB_PUBLISHING_MODE=nginx requires EXPLORER_QA_WEB_PUBLISHING_TLS_EDGE=external"
              exit 1
              ;;
            *)
              echo "::error::Token-mode Web Publishing requires EXPLORER_QA_WEB_PUBLISHING_TLS_EDGE=cloudflare"
              exit 1
              ;;
          esac
          if [ -z "${SSH_HOST:-}" ] || [ -z "${SSH_USER:-}" ]; then
            echo "::error::EXPLORER_QA_SSH_USER and EXPLORER_QA_SSH_HOST must be configured"
            exit 1
          fi
          if [ "${WORKSPACE:-}" = "${SOUL_GATEWAY_WORKSPACE}" ]; then
            echo "::error::Refusing to deploy Explorer QA into the production Soul Gateway workspace"
            exit 1
          fi
          if [ "${ROUTER_PORT:-}" = "${SOUL_GATEWAY_ROUTER_PORT}" ]; then
            echo "::error::Refusing to deploy Explorer QA on the production Soul Gateway router port ${ROUTER_PORT}"
            exit 1
          fi
          case "${ROUTER_PORT:-}" in
            8042|8043|8085|8317|8318)
              echo "::error::Refusing to deploy Explorer QA on a known production proxies-host port ${ROUTER_PORT}"
              exit 1
              ;;
          esac

      - name: Prepare SSH key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EXPLORER_QA_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ env.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy workspace
        env:
          PLOINKY_MASTER_KEY: ${{ secrets.EXPLORER_QA_PLOINKY_MASTER_KEY }}
          WEB_PUBLISHING_MODE: ${{ vars.EXPLORER_QA_WEB_PUBLISHING_MODE || 'nginx-cloudflare' }}
          WEB_PUBLISHING_BASE_DOMAIN: ${{ vars.EXPLORER_QA_WEB_PUBLISHING_BASE_DOMAIN }}
          WEB_PUBLISHING_PUBLIC_URL: ${{ vars.EXPLORER_QA_WEB_PUBLISHING_PUBLIC_URL || inputs.public_url || vars.EXPLORER_QA_PUBLIC_URL || '' }}
          WEB_PUBLISHING_TLS_EDGE: ${{ vars.EXPLORER_QA_WEB_PUBLISHING_TLS_EDGE }}
          WEB_PUBLISHING_LIVEKIT_MEDIA_IP: ${{ vars.EXPLORER_QA_WEB_PUBLISHING_LIVEKIT_MEDIA_IP }}
          WEB_PUBLISHING_TURN_EXTERNAL_IP: ${{ vars.EXPLORER_QA_WEB_PUBLISHING_TURN_EXTERNAL_IP }}
          WEB_PUBLISHING_CLOUDFLARED_TUNNEL_TOKEN: ${{ secrets.EXPLORER_QA_WEB_PUBLISHING_CLOUDFLARED_TUNNEL_TOKEN }}
          WEB_PUBLISHING_CLOUDFLARE_API_TOKEN: ${{ secrets.EXPLORER_QA_WEB_PUBLISHING_CLOUDFLARE_API_TOKEN }}
          WEB_PUBLISHING_CLOUDFLARE_ACCOUNT_ID: ${{ vars.EXPLORER_QA_WEB_PUBLISHING_CLOUDFLARE_ACCOUNT_ID }}
          WEB_PUBLISHING_CLOUDFLARE_ZONE_ID: ${{ vars.EXPLORER_QA_WEB_PUBLISHING_CLOUDFLARE_ZONE_ID }}
          WEB_PUBLISHING_CLOUDFLARE_TUNNEL_ID: ${{ vars.EXPLORER_QA_WEB_PUBLISHING_CLOUDFLARE_TUNNEL_ID }}
          WEB_PUBLISHING_CLOUDFLARE_TUNNEL_NAME: ${{ vars.EXPLORER_QA_WEB_PUBLISHING_CLOUDFLARE_TUNNEL_NAME }}
          PLOINKY_NODE_IMAGE_TAG: ${{ inputs.ploinky_node_image_tag || vars.EXPLORER_QA_PLOINKY_NODE_IMAGE_TAG || '24-bookworm-tools' }}
          WEBMEET_LIVEKIT_LOG_LEVEL: ${{ vars.EXPLORER_QA_WEBMEET_LIVEKIT_LOG_LEVEL }}
          WEBMEET_LIVEKIT_FORCE_TCP: ${{ vars.EXPLORER_QA_WEBMEET_LIVEKIT_FORCE_TCP }}
          WEBMEET_LIVEKIT_REDIS_ADDRESS: ${{ vars.EXPLORER_QA_WEBMEET_LIVEKIT_REDIS_ADDRESS }}
          WEBMEET_EGRESS_REDIS_ADDRESS: ${{ vars.EXPLORER_QA_WEBMEET_EGRESS_REDIS_ADDRESS }}
          WEBMEET_LIVEKIT_INTERNAL_WS_URL: ${{ vars.EXPLORER_QA_WEBMEET_LIVEKIT_INTERNAL_WS_URL }}
          WEBMEET_ICE_TRANSPORT_POLICY: ${{ vars.EXPLORER_QA_WEBMEET_ICE_TRANSPORT_POLICY }}
          PROXIES_BRANCH: ${{ inputs.proxies_branch || vars.EXPLORER_QA_PROXIES_BRANCH || 'main' }}
          PLOINKY_BRANCH: ${{ inputs.ploinky_branch || vars.EXPLORER_QA_PLOINKY_BRANCH || 'ploinky-box' }}
          ACHILLES_BRANCH: ${{ inputs.achilles_branch || vars.EXPLORER_QA_ACHILLES_BRANCH || 'master' }}
        run: |
          set -euo pipefail

          write_env() {
            local name="$1"
            local value="${!name:-}"
            if [ "$name" != "PLOINKY_MASTER_KEY" ] && [ -z "$value" ]; then
              return 0
            fi
            printf '%s=' "$name"
            printf '%q\n' "$value"
          }

          {
            write_env PLOINKY_MASTER_KEY
            write_env WEB_PUBLISHING_MODE
            write_env WEB_PUBLISHING_BASE_DOMAIN
            write_env WEB_PUBLISHING_PUBLIC_URL
            write_env WEB_PUBLISHING_TLS_EDGE
            write_env WEB_PUBLISHING_LIVEKIT_MEDIA_IP
            write_env WEB_PUBLISHING_TURN_EXTERNAL_IP
            write_env WEB_PUBLISHING_CLOUDFLARED_TUNNEL_TOKEN
            write_env WEB_PUBLISHING_CLOUDFLARE_API_TOKEN
            write_env WEB_PUBLISHING_CLOUDFLARE_ACCOUNT_ID
            write_env WEB_PUBLISHING_CLOUDFLARE_ZONE_ID
            write_env WEB_PUBLISHING_CLOUDFLARE_TUNNEL_ID
            write_env WEB_PUBLISHING_CLOUDFLARE_TUNNEL_NAME
            write_env PLOINKY_NODE_IMAGE_TAG
            write_env WEBMEET_LIVEKIT_LOG_LEVEL
            write_env WEBMEET_LIVEKIT_FORCE_TCP
            write_env WEBMEET_LIVEKIT_REDIS_ADDRESS
            write_env WEBMEET_EGRESS_REDIS_ADDRESS
            write_env WEBMEET_LIVEKIT_INTERNAL_WS_URL
            write_env WEBMEET_ICE_TRANSPORT_POLICY
          } > /tmp/explorer_qa_env
          chmod 600 /tmp/explorer_qa_env

          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no /tmp/explorer_qa_env "${SSH_USER}@${SSH_HOST}:/tmp/explorer_qa_env"

          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            -i ~/.ssh/deploy_key "${SSH_USER}@${SSH_HOST}" \
            "WORKSPACE='$WORKSPACE' EXPLORER_BRANCH='$EXPLORER_BRANCH' PROXIES_BRANCH='$PROXIES_BRANCH' BASIC_BRANCH='$BASIC_BRANCH' WEBMEET_INFRA_BRANCH='$WEBMEET_INFRA_BRANCH' PLOINKY_BRANCH='$PLOINKY_BRANCH' ACHILLES_BRANCH='$ACHILLES_BRANCH' ROUTER_PORT='$ROUTER_PORT' PUBLIC_URL='$PUBLIC_URL' PLOINKY_PROFILE='$PLOINKY_PROFILE' SOUL_GATEWAY_WORKSPACE='$SOUL_GATEWAY_WORKSPACE' SOUL_GATEWAY_ROUTER_PORT='$SOUL_GATEWAY_ROUTER_PORT' bash -s" << 'REMOTE'
          set -euo pipefail
          # Ensure the plaintext env file is removed even if a later step exits non-zero.
          trap 'rm -f /tmp/explorer_qa_env' EXIT

          # --- Safety: never act on the co-located production Soul Gateway. ---
          if [ "$WORKSPACE" = "${SOUL_GATEWAY_WORKSPACE:-soulGateway}" ]; then
            echo "[deploy-qa] ERROR: refusing to operate on the production Soul Gateway workspace."
            exit 1
          fi
          if [ "$ROUTER_PORT" = "${SOUL_GATEWAY_ROUTER_PORT:-8080}" ]; then
            echo "[deploy-qa] ERROR: refusing to bind QA Explorer to the production Soul Gateway router port."
            exit 1
          fi

          # --- Pre-flight: record whether production Soul Gateway is healthy now. ---
          SOUL_HEALTH_URL="http://127.0.0.1:${SOUL_GATEWAY_ROUTER_PORT:-8080}/public-services/soul-gateway-health/"
          SOUL_UP_BEFORE=0
          if curl -sf "$SOUL_HEALTH_URL" >/dev/null 2>&1; then
            SOUL_UP_BEFORE=1
            echo "[deploy-qa] Pre-flight: production Soul Gateway is UP on :${SOUL_GATEWAY_ROUTER_PORT:-8080}."
          else
            echo "[deploy-qa] Pre-flight: production Soul Gateway not reachable before deploy (will not be made worse)."
          fi

          resolve_ploinky() {
            if [ -x "$HOME/ploinky/bin/ploinky" ]; then
              printf '%s\n' "$HOME/ploinky/bin/ploinky"
              return 0
            fi
            if [ -x "$HOME/.local/bin/ploinky" ]; then
              printf '%s\n' "$HOME/.local/bin/ploinky"
              return 0
            fi
            if command -v ploinky >/dev/null 2>&1; then
              command -v ploinky
              return 0
            fi
            return 1
          }

          PLOINKY="$(resolve_ploinky)" || {
            echo "[deploy] ERROR: ploinky is not installed on the remote host."
            echo "[deploy] Run the Provision Skills Explorer Host workflow first."
            exit 1
          }

          for tool in git node npm podman curl openssl; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "[deploy] ERROR: missing required tool '$tool'."
              echo "[deploy] Run the Provision Skills Explorer Host workflow first."
              exit 1
            fi
          done

          WORK_DIR="$HOME/$WORKSPACE"
          mkdir -p "$WORK_DIR/logs"
          cd "$WORK_DIR"
          # Pin the workspace root so every ploinky command uses THIS workspace's .ploinky.
          # The new ploinky resolves the workspace by walking up from cwd for an existing
          # .ploinky; after a destroy wipes this workspace's .ploinky, that search would
          # otherwise escape to a stale ~/.ploinky (whose .secrets we can't decrypt). The
          # PLOINKY_WORKSPACE_ROOT env var short-circuits that search (config.js resolveWorkspaceRoot).
          export PLOINKY_WORKSPACE_ROOT="$WORK_DIR"

          set -a
          . /tmp/explorer_qa_env
          set +a
          rm -f /tmp/explorer_qa_env

          WEB_PUBLISHING_MODE="${WEB_PUBLISHING_MODE:-nginx-cloudflare}"
          WEB_PUBLISHING_PUBLIC_URL="${WEB_PUBLISHING_PUBLIC_URL:-$PUBLIC_URL}"
          PLOINKY_NODE_IMAGE_TAG="${PLOINKY_NODE_IMAGE_TAG:-24-bookworm-tools}"

          fail_turn_preflight() {
            echo "[deploy-qa] ERROR: $1" >&2
            exit 1
          }

          validate_turn_tls_file() {
            local label="$1"
            local file_path="$2"
            if [ -L "$file_path" ]; then
              fail_turn_preflight "$label must not be a symlink: $file_path"
            fi
            if [ ! -e "$file_path" ]; then
              fail_turn_preflight "$label is missing. Provision it before deployment at: $file_path"
            fi
            if [ ! -f "$file_path" ]; then
              fail_turn_preflight "$label must be a regular file: $file_path"
            fi
            if [ ! -r "$file_path" ]; then
              fail_turn_preflight "$label is not readable by the deployment user: $file_path"
            fi
          }

          preflight_turn_endpoint() {
            local turn_host tls_dir cert_path key_path cert_public_key private_public_key dns_addresses dns_display dns_status
            turn_host="turn.${WEB_PUBLISHING_BASE_DOMAIN}"
            tls_dir="$WORK_DIR/.ploinky/data/webmeetTls/turn"
            cert_path="$tls_dir/fullchain.pem"
            key_path="$tls_dir/privkey.pem"

            validate_turn_tls_file "TURN TLS certificate" "$cert_path"
            validate_turn_tls_file "TURN TLS private key" "$key_path"

            if ! openssl x509 -in "$cert_path" -noout >/dev/null 2>&1; then
              fail_turn_preflight "TURN TLS certificate is not a valid PEM certificate: $cert_path"
            fi
            if ! openssl x509 -in "$cert_path" -noout -checkend 0 >/dev/null 2>&1; then
              fail_turn_preflight "TURN TLS certificate is expired: $cert_path"
            fi
            if ! openssl x509 -in "$cert_path" -noout -checkhost "$turn_host" >/dev/null 2>&1; then
              fail_turn_preflight "TURN TLS certificate does not cover $turn_host: $cert_path"
            fi
            if ! openssl pkey -in "$key_path" -noout -check >/dev/null 2>&1; then
              fail_turn_preflight "TURN TLS private key is invalid: $key_path"
            fi
            if ! cert_public_key="$(openssl x509 -in "$cert_path" -pubkey -noout \
              | openssl pkey -pubin -outform DER 2>/dev/null \
              | openssl dgst -sha256 2>/dev/null)"; then
              fail_turn_preflight "could not derive the TURN certificate public key"
            fi
            if ! private_public_key="$(openssl pkey -in "$key_path" -pubout -outform DER 2>/dev/null \
              | openssl dgst -sha256 2>/dev/null)"; then
              fail_turn_preflight "could not derive the TURN private-key public key"
            fi
            if [ -z "$cert_public_key" ] || [ "$cert_public_key" != "$private_public_key" ]; then
              fail_turn_preflight "TURN TLS certificate and private key do not match"
            fi
            echo "[deploy-qa] TURN TLS preflight passed for $turn_host using $tls_dir."

            dns_status=0
            dns_addresses="$(node - "$turn_host" <<'NODE'
          const dns = require('node:dns').promises;
          const host = process.argv[2];

          async function validateTurnDns() {
            let ipv4Addresses;
            try {
              ipv4Addresses = [...new Set(await dns.resolve4(host))].sort();
            } catch {
              process.exitCode = 1;
              return;
            }
            if (ipv4Addresses.length === 0) {
              process.exitCode = 1;
              return;
            }

            let ipv6Addresses = [];
            try {
              ipv6Addresses = [...new Set(await dns.resolve6(host))].sort();
            } catch (error) {
              if (!['ENODATA', 'ENOTFOUND'].includes(error?.code)) {
                process.stderr.write(`Unexpected AAAA lookup error for ${host}: ${error?.code || 'unknown'}\n`);
                process.exitCode = 3;
                return;
              }
            }
            if (ipv6Addresses.length > 0) {
              process.stderr.write(`AAAA records are not permitted for IPv4-only TURN host ${host}: ${ipv6Addresses.join(',')}\n`);
              process.exitCode = 2;
              return;
            }

            process.stdout.write(ipv4Addresses.join('\n'));
          }

          validateTurnDns().catch((error) => {
            process.stderr.write(`Unexpected DNS preflight failure for ${host}: ${error?.code || 'unknown'}\n`);
            process.exitCode = 3;
          });
          NODE
            )" || dns_status=$?
            case "$dns_status" in
              0) ;;
              1)
                fail_turn_preflight "public Web Publishing requires a pre-created DNS-only A record for $turn_host pointing to $WEB_PUBLISHING_TURN_EXTERNAL_IP; no A record resolved"
                ;;
              2)
                fail_turn_preflight "public TURN is IPv4-only; remove every AAAA record for $turn_host before deployment"
                ;;
              3)
                fail_turn_preflight "could not confirm that $turn_host has no AAAA record because its IPv6 DNS lookup failed unexpectedly"
                ;;
              *)
                fail_turn_preflight "TURN DNS validation failed unexpectedly for $turn_host"
                ;;
            esac
            if [ "$dns_addresses" != "$WEB_PUBLISHING_TURN_EXTERNAL_IP" ]; then
              dns_display="$(printf '%s\n' "$dns_addresses" | paste -sd, -)"
              fail_turn_preflight "public Web Publishing requires every A record for $turn_host to equal $WEB_PUBLISHING_TURN_EXTERNAL_IP; resolved: ${dns_display:-none}"
            fi
            echo "[deploy-qa] TURN DNS preflight passed: $turn_host resolves only to IPv4 $WEB_PUBLISHING_TURN_EXTERNAL_IP and has no AAAA record."
            echo "[deploy-qa] DNS resolution cannot prove Cloudflare proxy status; the $turn_host record must be configured DNS-only."
          }

          # Run before any shutdown, repository update, image pull, or agent start.
          preflight_turn_endpoint

          # (Finding 1) 'ploinky shutdown' kills whatever listens on the port in
          # THIS workspace's routing.json, defaulting to :8080 when that file is
          # absent. Only shut down when this QA workspace provably owns ROUTER_PORT.
          read_routing_port() {
            node -e 'try{const p=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).port;process.stdout.write(p?String(p):"")}catch(e){process.stdout.write("")}' "$1" 2>/dev/null || true
          }
          SAFE_TO_SHUTDOWN=0
          if [ -f "$WORK_DIR/.ploinky/routing.json" ]; then
            QA_ROUTING_PORT="$(read_routing_port "$WORK_DIR/.ploinky/routing.json")"
            if [ "$QA_ROUTING_PORT" = "$ROUTER_PORT" ]; then
              SAFE_TO_SHUTDOWN=1
            elif [ -n "$QA_ROUTING_PORT" ]; then
              echo "[deploy-qa] ERROR: existing QA routing.json port ($QA_ROUTING_PORT) != ROUTER_PORT ($ROUTER_PORT)."
              echo "[deploy-qa] 'ploinky shutdown' would target a port this run does not own. Aborting."
              exit 1
            fi
          fi
          if [ "$SAFE_TO_SHUTDOWN" = "1" ]; then
            echo "[deploy-qa] QA workspace owns :$ROUTER_PORT; shutting it down before redeploy..."
            env PLOINKY_MASTER_KEY="$PLOINKY_MASTER_KEY" "$PLOINKY" shutdown || \
              env PLOINKY_MASTER_KEY="$PLOINKY_MASTER_KEY" "$PLOINKY" stop || true
          else
            echo "[deploy-qa] Cold/unconfirmed QA workspace; SKIPPING 'ploinky shutdown' (it would default to :${SOUL_GATEWAY_ROUTER_PORT:-8080} and could kill the production Soul Gateway router)."
          fi

          # (Finding 1) Refuse to start if ROUTER_PORT is held by a router this run does not own.
          # SAFE_TO_SHUTDOWN=1 means we just shut our own router down (port is freeing); any
          # other case (cold/absent/foreign) with a live listener on ROUTER_PORT is not ours.
          if [ "$SAFE_TO_SHUTDOWN" != "1" ] && ss -ltn 2>/dev/null | awk '{print $4}' | grep -Eq "[:.]${ROUTER_PORT}$"; then
            echo "[deploy-qa] ERROR: port ${ROUTER_PORT} is already in use and is not owned by this QA workspace."
            exit 1
          fi

          echo "[deploy-qa] Updating shared Ploinky runtime to the requested branch (QA host is dedicated to Explorer)..."
          resolve_realpath() {
            if command -v realpath >/dev/null 2>&1; then realpath "$1"; else readlink -f "$1"; fi
          }
          checkout_runtime_branch() {
            local repo_dir="$1"
            local branch="$2"
            local label="$3"
            git -C "$repo_dir" check-ref-format --branch "$branch" >/dev/null
            git -C "$repo_dir" fetch --prune origin
            if git -C "$repo_dir" show-ref --verify --quiet "refs/heads/$branch"; then
              git -C "$repo_dir" checkout "$branch"
            else
              git -C "$repo_dir" checkout -b "$branch" "origin/$branch"
            fi
            git -C "$repo_dir" reset --hard "origin/$branch"
            echo "[deploy-qa] $label at $(git -C "$repo_dir" rev-parse --short HEAD) ($branch)"
          }
          PLOINKY_BRANCH="${PLOINKY_BRANCH:-ploinky-box}"
          PLOINKY_BIN="$(resolve_realpath "$PLOINKY")"
          PLOINKY_DIR="$(cd "$(dirname "$PLOINKY_BIN")/.." && pwd -P)"
          if [ ! -d "$PLOINKY_DIR/.git" ] && [ -d "$HOME/ploinky/.git" ]; then
            PLOINKY_DIR="$HOME/ploinky"
            PLOINKY="$PLOINKY_DIR/bin/ploinky"
          fi
          if [ -d "$PLOINKY_DIR/.git" ]; then
            checkout_runtime_branch "$PLOINKY_DIR" "$PLOINKY_BRANCH" "Ploinky runtime"
          else
            echo "[deploy-qa] ERROR: cannot checkout Ploinky branch '$PLOINKY_BRANCH'; '$PLOINKY_DIR' is not a git checkout."
            exit 1
          fi
          ACHILLES_BRANCH="${ACHILLES_BRANCH:-master}"
          ACHILLES_DIR="$PLOINKY_DIR/node_modules/achillesAgentLib"
          if [ -d "$ACHILLES_DIR/.git" ]; then
            checkout_runtime_branch "$ACHILLES_DIR" "$ACHILLES_BRANCH" "achillesAgentLib"
          elif [ "$ACHILLES_BRANCH" != "master" ]; then
            echo "[deploy-qa] ERROR: cannot checkout achillesAgentLib branch '$ACHILLES_BRANCH'; '$ACHILLES_DIR' is not a git checkout."
            exit 1
          fi

          echo "[deploy] Installing Ploinky repos..."
          # Ploinky retired 'add repo <name> <url> <branch>' / 'enable repo <name>' in favor of
          # 'install <url|repoName> [name] [--branch X]'. Repos are activated by install; the
          # explorer manifest's "enable" list brings up the agent stack at start time.
          "$PLOINKY" install https://github.com/AssistOS-AI/AssistOSExplorer.git AchillesIDE --branch "${EXPLORER_BRANCH:-ploinky-box}" || true
          "$PLOINKY" install https://github.com/AssistOS-AI/basic.git basic --branch "${BASIC_BRANCH:-ploinky-box}" || true
          "$PLOINKY" install https://github.com/AssistOS-AI/webmeetInfra.git webmeetInfra --branch "${WEBMEET_INFRA_BRANCH:-ploinky-box}" || true
          "$PLOINKY" install https://github.com/AssistOS-AI/proxies.git proxies --branch "${PROXIES_BRANCH:-main}" || true

          echo "[deploy-qa] Updating Ploinky, Achilles dependencies, and installed repos..."
          if ! env PLOINKY_MASTER_KEY="$PLOINKY_MASTER_KEY" "$PLOINKY" update; then
            echo "[deploy-qa] Initial update failed; retrying once in case Ploinky self-updated during this run..."
            env PLOINKY_MASTER_KEY="$PLOINKY_MASTER_KEY" "$PLOINKY" update
          fi

          for repo_spec in "AchillesIDE:${EXPLORER_BRANCH:-ploinky-box}" "basic:${BASIC_BRANCH:-ploinky-box}" "webmeetInfra:${WEBMEET_INFRA_BRANCH:-ploinky-box}" "proxies:${PROXIES_BRANCH:-main}"; do
            repo_name="${repo_spec%%:*}"
            repo_branch="${repo_spec#*:}"
            repo_dir="$WORK_DIR/.ploinky/repos/$repo_name"
            if [ -d "$repo_dir/.git" ]; then
              git -C "$repo_dir" fetch origin
              git -C "$repo_dir" checkout "$repo_branch"
              git -C "$repo_dir" reset --hard "origin/$repo_branch"
              git -C "$repo_dir" clean -fd
              echo "[deploy] $repo_name at $(git -C "$repo_dir" rev-parse --short HEAD)"
            fi
          done

          cleanup_retired_webmeet_infra() {
            local retired_agents=(
              stack
              webmeetCoturn
              webmeetRedis
              webmeetLivekitServer
              webmeetLivekitEgress
              webmeetLivekitNginx
              webmeetLivekitCertbot
            )

            echo "[deploy] Removing retired split WebMeet infra agent registrations..."
            for agent in "${retired_agents[@]}"; do
              env PLOINKY_MASTER_KEY="$PLOINKY_MASTER_KEY" "$PLOINKY" disable agent "webmeetInfra/$agent" || true
              env PLOINKY_MASTER_KEY="$PLOINKY_MASTER_KEY" "$PLOINKY" disable agent "$agent" || true
            done

            node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const retired = new Set([
            'stack',
            'webmeetCoturn',
            'webmeetRedis',
            'webmeetLivekitServer',
            'webmeetLivekitEgress',
            'webmeetLivekitNginx',
            'webmeetLivekitCertbot',
          ]);
          const root = process.cwd();

          function splitRef(value) {
            const text = String(value || '');
            const parts = text.split('/');
            return {
              repo: parts.length > 1 ? parts[0] : '',
              agent: parts[parts.length - 1] || text,
            };
          }

          function readJson(filePath) {
            try {
              return JSON.parse(fs.readFileSync(filePath, 'utf8'));
            } catch (_) {
              return null;
            }
          }

          function writeJson(filePath, value) {
            fs.writeFileSync(filePath, `${JSON.stringify(value, null, 2)}\n`);
          }

          const agentsPath = path.join(root, '.ploinky', 'agents.json');
          const agents = readJson(agentsPath);
          let agentsChanged = false;
          if (agents && typeof agents === 'object') {
            for (const [key, record] of Object.entries(agents)) {
              if (key === '_config' || !record || typeof record !== 'object') continue;
              const keyRef = splitRef(key);
              const repo = String(record.repoName || keyRef.repo);
              const agent = String(record.agentName || keyRef.agent);
              if (repo === 'webmeetInfra' && retired.has(agent)) {
                delete agents[key];
                agentsChanged = true;
              }
            }
            if (agentsChanged) {
              writeJson(agentsPath, agents);
            }
          }

          const routingPath = path.join(root, '.ploinky', 'routing.json');
          const routing = readJson(routingPath);
          let routingChanged = false;
          if (routing && routing.routes && typeof routing.routes === 'object') {
            for (const [key, route] of Object.entries(routing.routes)) {
              const keyRef = splitRef(key);
              const routeRef = splitRef(route && route.agent);
              const agent = String(routeRef.agent || keyRef.agent);
              const repo = String(route && route.repo || routeRef.repo || keyRef.repo);
              if (retired.has(agent) && (!repo || repo === 'webmeetInfra')) {
                delete routing.routes[key];
                routingChanged = true;
              }
            }
            if (routingChanged) {
              writeJson(routingPath, routing);
            }
          }

          console.log(`[deploy] Retired registry cleanup: agents=${agentsChanged ? 'updated' : 'unchanged'} routes=${routingChanged ? 'updated' : 'unchanged'}`);
          NODE

            local retired_pattern="^ploinky_webmeetInfra_(stack|webmeetCoturn|webmeetRedis|webmeetLivekitServer|webmeetLivekitEgress|webmeetLivekitNginx|webmeetLivekitCertbot)_${WORKSPACE}_"
            podman ps -a --format '{{.Names}}' | grep -E "$retired_pattern" | while read -r container_name; do
              [ -n "$container_name" ] || continue
              echo "[deploy] Removing retired container $container_name"
              podman rm -f "$container_name" || true
            done || true
          }

          cleanup_retired_webmeet_infra

          "$PLOINKY" profile "${PLOINKY_PROFILE:-prod}"
          "$PLOINKY" sandbox disable

          set_var() {
            local name="$1"
            local value="$2"
            if [ -n "$value" ]; then
              env PLOINKY_MASTER_KEY="$PLOINKY_MASTER_KEY" "$PLOINKY" var "$name" "$value"
              echo "[deploy] Set $name"
            fi
          }

          clear_provider_owned_topology() {
            echo "[deploy] Clearing stale public topology vars owned by Web Publishing..."
            PLOINKY_RUNTIME_DIR="$PLOINKY_DIR" env PLOINKY_MASTER_KEY="$PLOINKY_MASTER_KEY" PLOINKY_WORKSPACE_ROOT="$WORK_DIR" node --input-type=module <<'NODE'
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';

          const runtimeDir = process.env.PLOINKY_RUNTIME_DIR;
          const modulePath = path.join(runtimeDir, 'cli', 'services', 'encryptedSecretsFile.js');
          const { deleteSecretValue, readSecretsFile } = await import(pathToFileURL(modulePath).href);

          const providerOwnedNames = [
            'ONLYOFFICE_PUBLIC_URL',
            'ONLYOFFICE_INTERNAL_URL',
            'ONLYOFFICE_CALLBACK_BASE_URL',
            'WEBMEET_PUBLIC_LIVEKIT_URL',
            'WEBMEET_LIVEKIT_URL',
            'WEBMEET_LIVEKIT_MEDIA_IP',
            'WEBMEET_LIVEKIT_NODE_IP',
            'WEBMEET_TLS_HOSTNAME',
            'WEBMEET_TURN_HOST',
            'WEBMEET_TURN_EXTERNAL_IP',
            'WEBMEET_TURN_REALM',
            'WEBMEET_TURN_ALLOWED_PEER_IPS',
            'WEBMEET_CERT_EMAIL',
            'WEBMEET_LIVEKIT_UPSTREAM',
            'WEBMEET_EGRESS_URL',
            'WEBMEET_INFRA_IMAGE_TAG',
            'WEBMEET_INFRA_HEALTH_PORT',
            'WEBMEET_LIVEKIT_USE_EXTERNAL_IP',
            'WEBMEET_TLS_HTTP_PORT',
            'WEBMEET_TLS_HTTPS_PORT',
            'WEBMEET_CERTBOT_AUTO_ISSUE',
            'WEBMEET_CERTBOT_RENEW_INTERVAL_SECONDS',
            'WEBMEET_LOCAL_PUBLIC_HOST',
            'WEBMEET_STUN_URLS',
            'WEBMEET_TURN_URLS',
            'WEBMEET_TURN_PORT',
            'WEBMEET_TURN_USER',
            'WEBMEET_TURN_PASSWORD',
            'WEBMEET_TURN_MIN_PORT',
            'WEBMEET_TURN_MAX_PORT',
          ];

          const before = readSecretsFile();
          let cleared = 0;
          for (const name of providerOwnedNames) {
            if (Object.prototype.hasOwnProperty.call(before, name)) {
              deleteSecretValue(name);
              cleared += 1;
            }
          }
          console.log(`[deploy] Cleared ${cleared} stale provider-owned public topology var(s).`);
          NODE
          }

          clear_provider_owned_topology

          set_var PLOINKY_CODE_WRITABLE "1"
          set_var ASSISTOS_FS_ROOT "$WORK_DIR"
          set_var WORKSPACE_ROOT "$WORK_DIR"
          set_var PLOINKY_WORKSPACE_ROOT "$WORK_DIR"

          set_var WEB_PUBLISHING_MODE "${WEB_PUBLISHING_MODE:-nginx-cloudflare}"
          set_var WEB_PUBLISHING_BASE_DOMAIN "${WEB_PUBLISHING_BASE_DOMAIN:-}"
          set_var WEB_PUBLISHING_PUBLIC_URL "${WEB_PUBLISHING_PUBLIC_URL:-}"
          set_var WEB_PUBLISHING_TLS_EDGE "${WEB_PUBLISHING_TLS_EDGE:-}"
          set_var WEB_PUBLISHING_LIVEKIT_MEDIA_IP "${WEB_PUBLISHING_LIVEKIT_MEDIA_IP:-}"
          set_var WEB_PUBLISHING_TURN_EXTERNAL_IP "${WEB_PUBLISHING_TURN_EXTERNAL_IP:-}"
          set_var WEB_PUBLISHING_CLOUDFLARED_TUNNEL_TOKEN "${WEB_PUBLISHING_CLOUDFLARED_TUNNEL_TOKEN:-}"
          set_var WEB_PUBLISHING_CLOUDFLARE_API_TOKEN "${WEB_PUBLISHING_CLOUDFLARE_API_TOKEN:-}"
          set_var WEB_PUBLISHING_CLOUDFLARE_ACCOUNT_ID "${WEB_PUBLISHING_CLOUDFLARE_ACCOUNT_ID:-}"
          set_var WEB_PUBLISHING_CLOUDFLARE_ZONE_ID "${WEB_PUBLISHING_CLOUDFLARE_ZONE_ID:-}"
          set_var WEB_PUBLISHING_CLOUDFLARE_TUNNEL_ID "${WEB_PUBLISHING_CLOUDFLARE_TUNNEL_ID:-}"
          set_var WEB_PUBLISHING_CLOUDFLARE_TUNNEL_NAME "${WEB_PUBLISHING_CLOUDFLARE_TUNNEL_NAME:-}"

          set_var WEBMEET_LIVEKIT_LOG_LEVEL "${WEBMEET_LIVEKIT_LOG_LEVEL:-}"
          set_var WEBMEET_LIVEKIT_FORCE_TCP "${WEBMEET_LIVEKIT_FORCE_TCP:-}"
          set_var WEBMEET_LIVEKIT_REDIS_ADDRESS "${WEBMEET_LIVEKIT_REDIS_ADDRESS:-}"
          set_var WEBMEET_EGRESS_REDIS_ADDRESS "${WEBMEET_EGRESS_REDIS_ADDRESS:-}"
          set_var WEBMEET_LIVEKIT_INTERNAL_WS_URL "${WEBMEET_LIVEKIT_INTERNAL_WS_URL:-}"
          set_var WEBMEET_ICE_TRANSPORT_POLICY "${WEBMEET_ICE_TRANSPORT_POLICY:-all}"

          echo "[deploy] Pulling Ploinky Node image docker.io/assistos/ploinky-node:${PLOINKY_NODE_IMAGE_TAG}..."
          podman pull "docker.io/assistos/ploinky-node:${PLOINKY_NODE_IMAGE_TAG}"

          echo "[deploy] Pulling Web Publishing image docker.io/assistos/web-publishing-agent:node24-nginx-cloudflared..."
          podman pull "docker.io/assistos/web-publishing-agent:node24-nginx-cloudflared"

          echo "[deploy] Pulling liveKitServerAgent image docker.io/assistos/livekit-server-agent:webmeet-infra..."
          podman pull "docker.io/assistos/livekit-server-agent:webmeet-infra"

          echo "[deploy] Starting Explorer..."
          nohup env PLOINKY_MASTER_KEY="$PLOINKY_MASTER_KEY" "$PLOINKY" start AchillesIDE/explorer "$ROUTER_PORT" \
            --profile "${PLOINKY_PROFILE:-prod}" \
            --branch "${EXPLORER_BRANCH:-ploinky-box}" \
            --repo-branch "basic=${BASIC_BRANCH:-ploinky-box}" \
            --repo-branch "container-image-builds=main" \
            --repo-branch "proxies=${PROXIES_BRANCH:-main}" \
            --repo-branch "webmeetInfra=${WEBMEET_INFRA_BRANCH:-ploinky-box}" \
            --reset-repos \
            > "$WORK_DIR/logs/explorer-qa-start.log" 2>&1 &
          start_pid=$!

          echo "[deploy-qa] Waiting for Ploinky startup and blocking dependencies..."
          start_status=0
          wait "$start_pid" || start_status=$?
          if [ "$start_status" -ne 0 ]; then
            echo "[deploy-qa] ERROR: Ploinky start failed with status $start_status"
            tail -120 "$WORK_DIR/logs/explorer-qa-start.log" || true
            exit "$start_status"
          fi
          echo "[deploy-qa] Ploinky startup completed; blocking dependency readiness passed."

          echo "[deploy-qa] Waiting for local router listener..."
          sleep 10
          for i in $(seq 1 390); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${ROUTER_PORT}/dashboard" || true)"
            if [ "$code" = "200" ] || [ "$code" = "302" ]; then
              echo "[deploy] Local router responding with HTTP $code"
              break
            fi
            if [ "$i" = "390" ]; then
              echo "[deploy] ERROR: local router did not respond in time"
              tail -120 "$WORK_DIR/logs/explorer-qa-start.log" || true
              exit 1
            fi
            sleep 2
          done
          echo "[deploy-qa] Local router listener is ready."

          read_workspace_var() {
            env PLOINKY_MASTER_KEY="$PLOINKY_MASTER_KEY" "$PLOINKY" echo "\$$1" 2>/dev/null | tail -n 1 || true
          }

          ONLYOFFICE_PUBLIC_URL="$(read_workspace_var ONLYOFFICE_PUBLIC_URL)"
          WEBMEET_PUBLIC_LIVEKIT_URL="$(read_workspace_var WEBMEET_PUBLIC_LIVEKIT_URL)"

          expected_livekit_url="wss://meet.${WEB_PUBLISHING_BASE_DOMAIN}"
          if [ "${WEBMEET_PUBLIC_LIVEKIT_URL:-}" != "$expected_livekit_url" ]; then
            echo "[deploy-qa] ERROR: Web Publishing must publish canonical WEBMEET_PUBLIC_LIVEKIT_URL=$expected_livekit_url."
            exit 1
          fi

          {
            [ -n "$ONLYOFFICE_PUBLIC_URL" ] && printf 'ONLYOFFICE_PUBLIC_URL=%s\n' "$ONLYOFFICE_PUBLIC_URL"
            [ -n "$WEBMEET_PUBLIC_LIVEKIT_URL" ] && printf 'WEBMEET_PUBLIC_LIVEKIT_URL=%s\n' "$WEBMEET_PUBLIC_LIVEKIT_URL"
          } > "$WORK_DIR/logs/explorer-qa-public.env"
          chmod 600 "$WORK_DIR/logs/explorer-qa-public.env"

          echo "[deploy] Containers:"
          podman ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" | head -100
          echo "[deploy-qa] QA workspace status:"
          env PLOINKY_MASTER_KEY="$PLOINKY_MASTER_KEY" "$PLOINKY" status || true

          # (Finding 1 backstop) production Soul Gateway must be no worse than before.
          if [ "$SOUL_UP_BEFORE" = "1" ]; then
            echo "[deploy-qa] Post-flight: re-verifying production Soul Gateway on :${SOUL_GATEWAY_ROUTER_PORT:-8080}..."
            SOUL_OK=0
            for i in $(seq 1 30); do
              if curl -sf "$SOUL_HEALTH_URL" >/dev/null 2>&1; then SOUL_OK=1; break; fi
              sleep 2
            done
            if [ "$SOUL_OK" != "1" ]; then
              echo "[deploy-qa] ERROR: production Soul Gateway was UP before this deploy but is now unreachable on :${SOUL_GATEWAY_ROUTER_PORT:-8080}."
              echo "[deploy-qa] The QA deploy may have disrupted production. Investigate immediately."
              exit 1
            fi
            echo "[deploy-qa] Post-flight: production Soul Gateway still healthy."
          fi
          REMOTE

      - name: Verify public endpoints
        run: |
          set -euo pipefail
          if [ -n "${PUBLIC_URL:-}" ]; then
            echo "[deploy-qa] Verifying ${PUBLIC_URL}/dashboard from GitHub runner..."
            for i in $(seq 1 60); do
              code="$(curl -L -s -o /tmp/explorer-qa-response.txt -w '%{http_code}' "${PUBLIC_URL%/}/dashboard" || true)"
              if [ "$code" = "200" ] || [ "$code" = "302" ]; then
                echo "[deploy-qa] Public URL responding with HTTP $code"
                break
              fi
              if [ "$i" = "60" ]; then
                echo "[deploy-qa] ERROR: public URL did not become reachable"
                echo "[deploy-qa] Last HTTP code: ${code:-none}"
                sed -n '1,40p' /tmp/explorer-qa-response.txt 2>/dev/null || true
                exit 1
              fi
              sleep 5
            done
          else
            echo "[deploy-qa] PUBLIC_URL is not configured; skipping only the dashboard probe."
          fi

          public_env="$(ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "${SSH_USER}@${SSH_HOST}" "WORKSPACE='$WORKSPACE' bash -s" << 'REMOTE_PUBLIC_ENV'
          set -euo pipefail
          cat "$HOME/$WORKSPACE/logs/explorer-qa-public.env" 2>/dev/null || true
          REMOTE_PUBLIC_ENV
          )"
          public_var() {
            printf '%s\n' "$public_env" | awk -F= -v key="$1" '$1 == key { sub(/^[^=]*=/, ""); print; exit }'
          }
          ONLYOFFICE_PUBLIC_URL="$(public_var ONLYOFFICE_PUBLIC_URL)"
          WEBMEET_PUBLIC_LIVEKIT_URL="$(public_var WEBMEET_PUBLIC_LIVEKIT_URL)"

          expected_livekit_url="wss://meet.${WEB_PUBLISHING_BASE_DOMAIN}"
          if [ "${WEBMEET_PUBLIC_LIVEKIT_URL:-}" != "$expected_livekit_url" ]; then
            echo "[deploy-qa] ERROR: Web Publishing must publish canonical WEBMEET_PUBLIC_LIVEKIT_URL=$expected_livekit_url."
            exit 1
          fi
          livekit_probe_url="https://meet.${WEB_PUBLISHING_BASE_DOMAIN}"
          echo "[deploy-qa] Verifying the exact public LiveKit /rtc signaling route from GitHub runner..."
          for i in $(seq 1 60); do
            code="$(curl -s --http1.1 --connect-timeout 5 --max-time 15 -o /dev/null -w '%{http_code}' \
              -H 'Connection: Upgrade' \
              -H 'Upgrade: websocket' \
              "${livekit_probe_url%/}/rtc" || true)"
            if [ "$code" = "401" ]; then
              echo "[deploy-qa] Public LiveKit /rtc route reached LiveKit and returned the expected unauthenticated HTTP $code"
              break
            fi
            if [ "$i" = "60" ]; then
              echo "[deploy-qa] ERROR: public LiveKit /rtc route did not return the expected unauthenticated response"
              echo "[deploy-qa] Last HTTP code: ${code:-none}"
              exit 1
            fi
            sleep 5
          done

          if [ -z "${ONLYOFFICE_PUBLIC_URL:-}" ]; then
            echo "[deploy-qa] ERROR: Web Publishing did not publish ONLYOFFICE_PUBLIC_URL for browser editors."
            exit 1
          fi
          echo "[deploy-qa] Verifying OnlyOffice public api.js from GitHub runner..."
          for i in $(seq 1 60); do
            code="$(curl -L -s -o /tmp/onlyoffice-qa-api.js -w '%{http_code}' "${ONLYOFFICE_PUBLIC_URL%/}/web-apps/apps/api/documents/api.js" || true)"
            if [ "$code" = "200" ]; then
              echo "[deploy-qa] OnlyOffice public api.js responding with HTTP $code"
              break
            fi
            if [ "$i" = "60" ]; then
              echo "[deploy-qa] ERROR: OnlyOffice public api.js did not become reachable"
              exit 1
            fi
            sleep 5
          done

      - name: Create summary
        if: always()
        run: |
          {
            echo "## Explorer QA Deploy"
            echo ""
            echo "- Host: \`${SSH_USER}@${SSH_HOST}\`"
            echo "- Workspace: \`${WORKSPACE}\`"
            echo "- Router port: \`${ROUTER_PORT}\`"
            echo "- Local dashboard: \`http://127.0.0.1:${ROUTER_PORT}/dashboard\`"
            echo "- Public URL: \`${PUBLIC_URL:-not configured}\`"
            echo "- Branch: \`${EXPLORER_BRANCH}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key /tmp/explorer_qa_env
