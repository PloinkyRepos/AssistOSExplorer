name: Deploy Explorer QA Box

on:
  workflow_dispatch:

concurrency:
  group: deploy-explorer-qa
  cancel-in-progress: false

env:
  SSH_USER: 'admin'
  SSH_HOST: '45.136.70.141'
  SSH_ED25519_FINGERPRINT: 'SHA256:pcVG+7QFbfi3Ojn3LeveNutqCWaTOIlgek1o3GKD/KA'
  WORKSPACE: 'explorerQaWorkspace'
  ROUTER_PORT: '8097'
  DEPLOY_BRANCH: 'ploinky-proxy'
  PLOINKY_BRANCH: 'ploinky-proxy'
  PUBLIC_HOST: 'explorer-qa.axiologic.dev'
  PUBLIC_URL: 'https://explorer-qa.axiologic.dev'
  CLOUDFLARE_TUNNEL_NAME: 'explorer-qa'
  CLOUDFLARE_TUNNEL_ID: ${{ vars.EXPLORER_QA_CLOUDFLARE_TUNNEL_ID }}
  CLOUDFLARE_TUNNEL_SECRET_HANDLE: 'publication/explorer-qa-tunnel'
  CLOUDFLARE_API_SECRET_HANDLE: 'publication/explorer-qa-api'
  MEDIA_PUBLIC_IPV4: '45.136.70.141'
  SOUL_GATEWAY_WORKSPACE: 'soulGateway'
  SOUL_GATEWAY_ROUTER_PORT: '8080'

jobs:
  deploy:
    name: Deploy Explorer QA through Ploinky Box
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read

    steps:
      - name: Validate GitHub configuration
        env:
          SSH_KEY: ${{ secrets.EXPLORER_QA_SSH_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.EXPLORER_QA_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.EXPLORER_QA_CLOUDFLARE_TUNNEL_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.EXPLORER_QA_CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ vars.EXPLORER_QA_CLOUDFLARE_ZONE_ID }}
          PLOINKY_MASTER_KEY: ${{ secrets.EXPLORER_QA_PLOINKY_MASTER_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_KEY:-}" ]; then
            echo "::error::Missing required repository secret EXPLORER_QA_SSH_KEY"
            exit 1
          fi
          if [ -z "${SSH_HOST:-}" ] || [ -z "${SSH_USER:-}" ]; then
            echo "::error::EXPLORER_QA_SSH_USER and EXPLORER_QA_SSH_HOST must be configured"
            exit 1
          fi
          if [ "$SSH_HOST" != '45.136.70.141' ] || [ "$SSH_USER" != 'admin' ] ||
            [ "$WORKSPACE" != 'explorerQaWorkspace' ]; then
            echo "::error::Explorer QA target identity is not the pinned admin@45.136.70.141/explorerQaWorkspace target"
            exit 1
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Missing required repository secret EXPLORER_QA_CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [[ "$CLOUDFLARE_API_TOKEN" == cfk_* ]]; then
            echo "::error::EXPLORER_QA_CLOUDFLARE_API_TOKEN is a Global API Key; Ploinky requires a scoped Account or User API Token used as a Bearer token"
            exit 1
          fi
          if [ -z "${CLOUDFLARE_TUNNEL_TOKEN:-}" ]; then
            echo "::error::Missing required repository secret EXPLORER_QA_CLOUDFLARE_TUNNEL_TOKEN"
            exit 1
          fi
          if [ "$CLOUDFLARE_API_TOKEN" = "$CLOUDFLARE_TUNNEL_TOKEN" ]; then
            echo "::error::Cloudflare management and connector authorities must be separate credentials"
            exit 1
          fi
          if [[ ! "$PLOINKY_MASTER_KEY" =~ ^[A-Fa-f0-9]{64}$ ]]; then
            echo "::error::EXPLORER_QA_PLOINKY_MASTER_KEY must be exactly 64 hex characters"
            exit 1
          fi
          if [[ ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-f0-9]{32}$ ]] ||
            [[ ! "$CLOUDFLARE_ZONE_ID" =~ ^[a-f0-9]{32}$ ]]; then
            echo "::error::Explorer QA Cloudflare account or zone variables are missing or malformed"
            exit 1
          fi
          if [[ ! "$CLOUDFLARE_TUNNEL_ID" =~ ^[a-f0-9-]{36}$ ]]; then
            echo "::error::Explorer QA Cloudflare tunnel ID is missing or malformed"
            exit 1
          fi
          if [[ ! "$CLOUDFLARE_TUNNEL_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,47}$ ]]; then
            echo "::error::Explorer QA managed Cloudflare tunnel name is malformed"
            exit 1
          fi
          case "${WORKSPACE:-}" in
            ''|.|..|*[!A-Za-z0-9._-]*)
              echo "::error::Invalid workspace name '${WORKSPACE:-}' (allowed: A-Za-z0-9._-)"
              exit 1
              ;;
          esac
          if [ "$WORKSPACE" = "$SOUL_GATEWAY_WORKSPACE" ]; then
            echo "::error::Refusing to deploy into the production Soul Gateway workspace"
            exit 1
          fi
          case "${ROUTER_PORT:-}" in
            ''|*[!0-9]*)
              echo "::error::Invalid router port '${ROUTER_PORT:-}'"
              exit 1
              ;;
          esac
          if [ "$ROUTER_PORT" -lt 1 ] || [ "$ROUTER_PORT" -gt 65535 ]; then
            echo "::error::Router port must be between 1 and 65535"
            exit 1
          fi
          case "$ROUTER_PORT" in
            8042|8043|8080|8085|8317|8318)
              echo "::error::Refusing to use protected proxies-host port ${ROUTER_PORT}"
              exit 1
              ;;
          esac
          git check-ref-format --branch "$DEPLOY_BRANCH" >/dev/null
          git check-ref-format --branch "$PLOINKY_BRANCH" >/dev/null
          if [ "$PUBLIC_URL" != "https://$PUBLIC_HOST" ]; then
            echo "::error::PUBLIC_URL and PUBLIC_HOST must identify the fixed Explorer QA hostname"
            exit 1
          fi
          TUNNEL_RESPONSE="$(mktemp /tmp/explorer_qa_tunnel.XXXXXX)"
          TUNNEL_LIST_RESPONSE="$(mktemp /tmp/explorer_qa_tunnel_list.XXXXXX)"
          TUNNEL_CONFIG_RESPONSE="$(mktemp /tmp/explorer_qa_tunnel_config.XXXXXX)"
          DNS_RESPONSE="$(mktemp /tmp/explorer_qa_dns.XXXXXX)"
          trap 'rm -f "$TUNNEL_RESPONSE" "$TUNNEL_LIST_RESPONSE" "$TUNNEL_CONFIG_RESPONSE" "$DNS_RESPONSE"' EXIT
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel/$CLOUDFLARE_TUNNEL_ID" \
            > "$TUNNEL_RESPONSE"
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --get \
            --data-urlencode 'is_deleted=false' \
            --data-urlencode "name=$CLOUDFLARE_TUNNEL_NAME" \
            --data-urlencode 'per_page=100' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel" \
            > "$TUNNEL_LIST_RESPONSE"
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel/$CLOUDFLARE_TUNNEL_ID/configurations" \
            > "$TUNNEL_CONFIG_RESPONSE"
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --get \
            --data-urlencode 'type=CNAME' \
            --data-urlencode "name=$PUBLIC_HOST" \
            --data-urlencode 'per_page=100' \
            "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/dns_records" \
            > "$DNS_RESPONSE"

          node --input-type=module - \
            "$TUNNEL_RESPONSE" \
            "$TUNNEL_LIST_RESPONSE" \
            "$TUNNEL_CONFIG_RESPONSE" \
            "$DNS_RESPONSE" <<'NODE'
          import fs from 'node:fs';

          const [detailPath, listPath, configPath, dnsPath] = process.argv.slice(2);
          const accountId = String(process.env.CLOUDFLARE_ACCOUNT_ID || '');
          const tunnelId = String(process.env.CLOUDFLARE_TUNNEL_ID || '');
          const tunnelName = String(process.env.CLOUDFLARE_TUNNEL_NAME || '');
          const publicHost = String(process.env.PUBLIC_HOST || '');
          const routerPort = String(process.env.ROUTER_PORT || '');
          const connectorToken = String(process.env.CLOUDFLARE_TUNNEL_TOKEN || '');
          const parse = (file) => JSON.parse(fs.readFileSync(file, 'utf8'));
          const requireSuccess = (payload, label) => {
            if (payload?.success !== true) throw new Error(`${label} inventory failed`);
            return payload.result;
          };
          const decodeConnectorClaims = (token) => {
            for (const candidate of [token, ...token.split('.')]) {
              try {
                const claims = JSON.parse(Buffer.from(candidate, 'base64url').toString('utf8'));
                const account = String(claims?.a || claims?.accountId || '');
                const tunnel = String(claims?.t || claims?.tunnelId || '');
                if (account && tunnel) return { account, tunnel };
              } catch { }
            }
            throw new Error('Explorer QA connector token has no parseable account/tunnel claims');
          };

          const detail = requireSuccess(parse(detailPath), 'tunnel detail');
          if (!detail || detail.id !== tunnelId || detail.name !== tunnelName
            || detail.deleted_at != null
            || (detail.account_tag != null && detail.account_tag !== accountId)) {
            throw new Error('selected tunnel is not the exact active explorer-qa tunnel identity');
          }
          const named = requireSuccess(parse(listPath), 'named tunnel');
          if (!Array.isArray(named) || named.length !== 1 || named[0]?.id !== tunnelId) {
            throw new Error('active explorer-qa tunnel inventory is absent or ambiguous');
          }

          const claims = decodeConnectorClaims(connectorToken);
          if (claims.account !== accountId || claims.tunnel !== tunnelId) {
            throw new Error('connector token claims do not match the selected Explorer QA tunnel/account');
          }

          const config = requireSuccess(parse(configPath), 'tunnel configuration');
          const ingress = config?.config?.ingress;
          if (!Array.isArray(ingress) || ingress.length < 1 || ingress.length > 2) {
            throw new Error('Explorer QA tunnel is shared or has ambiguous ingress');
          }
          const catchAll = ingress.at(-1);
          if (catchAll?.hostname != null || catchAll?.service !== 'http_status:404') {
            throw new Error('Explorer QA tunnel lacks the required terminal 404 ingress');
          }
          if (ingress.length === 2) {
            const route = ingress[0];
            if (route?.hostname !== publicHost || route?.service !== `http://localhost:${routerPort}`) {
              throw new Error('Explorer QA tunnel contains unrelated or incorrect ingress');
            }
          }

          const records = requireSuccess(parse(dnsPath), 'Explorer QA DNS');
          const expectedTarget = `${tunnelId}.cfargotunnel.com`;
          if (!Array.isArray(records) || records.length > 1
            || (records.length === 1 && (records[0]?.name !== publicHost
              || records[0]?.type !== 'CNAME'
              || records[0]?.content !== expectedTarget
              || records[0]?.proxied !== true))) {
            throw new Error('Explorer QA DNS is ambiguous or points outside the selected tunnel');
          }
          console.log('Validated one dedicated existing Explorer QA tunnel and matching connector claims.');
          NODE

          HOST_KEY_CANDIDATE="$RUNNER_TEMP/explorer_qa_known_hosts"
          ssh-keyscan -T 10 -t ed25519 "$SSH_HOST" > "$HOST_KEY_CANDIDATE"
          HOST_KEY_FINGERPRINT="$({ ssh-keygen -lf "$HOST_KEY_CANDIDATE" -E sha256 || true; } | awk '{print $2}' | sort -u)"
          if [ "$HOST_KEY_FINGERPRINT" != "$SSH_ED25519_FINGERPRINT" ]; then
            echo "::error::Explorer QA ED25519 host fingerprint did not match the pinned identity"
            exit 1
          fi
          chmod 600 "$HOST_KEY_CANDIDATE"
          echo "Validated the pinned Explorer QA SSH host identity."

      - name: Prepare SSH key
        env:
          SSH_KEY: ${{ secrets.EXPLORER_QA_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          install -m 600 "$RUNNER_TEMP/explorer_qa_known_hosts" ~/.ssh/explorer_qa_known_hosts

      - name: Reconcile and start Explorer QA Box
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.EXPLORER_QA_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.EXPLORER_QA_CLOUDFLARE_TUNNEL_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.EXPLORER_QA_CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ vars.EXPLORER_QA_CLOUDFLARE_ZONE_ID }}
          PLOINKY_MASTER_KEY: ${{ secrets.EXPLORER_QA_PLOINKY_MASTER_KEY }}
        run: |
          set -euo pipefail
          umask 077

          write_shell_var() {
            local name="$1"
            local value="${!name:-}"
            printf '%s=' "$name"
            printf '%q\n' "$value"
          }

          LOCAL_ENV_FILE="$(mktemp /tmp/explorer_qa_deploy.XXXXXX)"
          REMOTE_ENV_FILE="/tmp/$(basename "$LOCAL_ENV_FILE")"
          trap 'rm -f "$LOCAL_ENV_FILE"' EXIT
          {
            write_shell_var WORKSPACE
            write_shell_var ROUTER_PORT
            write_shell_var DEPLOY_BRANCH
            write_shell_var PLOINKY_BRANCH
            write_shell_var PUBLIC_HOST
            write_shell_var PUBLIC_URL
            write_shell_var CLOUDFLARE_TUNNEL_NAME
            write_shell_var CLOUDFLARE_TUNNEL_ID
            write_shell_var CLOUDFLARE_TUNNEL_SECRET_HANDLE
            write_shell_var CLOUDFLARE_API_SECRET_HANDLE
            write_shell_var CLOUDFLARE_API_TOKEN
            write_shell_var CLOUDFLARE_TUNNEL_TOKEN
            write_shell_var CLOUDFLARE_ACCOUNT_ID
            write_shell_var CLOUDFLARE_ZONE_ID
            write_shell_var MEDIA_PUBLIC_IPV4
            write_shell_var PLOINKY_MASTER_KEY
            write_shell_var SOUL_GATEWAY_WORKSPACE
            write_shell_var SOUL_GATEWAY_ROUTER_PORT
          } > "$LOCAL_ENV_FILE"

          scp \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$HOME/.ssh/explorer_qa_known_hosts" \
            "$LOCAL_ENV_FILE" \
            "${SSH_USER}@${SSH_HOST}:$REMOTE_ENV_FILE"
          rm -f "$LOCAL_ENV_FILE"

          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$HOME/.ssh/explorer_qa_known_hosts" \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            "${SSH_USER}@${SSH_HOST}" "bash -s -- '$REMOTE_ENV_FILE'" <<'REMOTE'
          set -euo pipefail
          REMOTE_ENV_FILE="${1:-}"
          CLOUDFLARE_CREDENTIAL_FILE=""
          PROTECTED_BEFORE_FILE=""
          PROTECTED_AFTER_FILE=""
          cleanup_remote_files() {
            rm -f "$REMOTE_ENV_FILE"
            if [ -n "$CLOUDFLARE_CREDENTIAL_FILE" ]; then
              rm -f "$CLOUDFLARE_CREDENTIAL_FILE"
            fi
            if [ -n "$PROTECTED_BEFORE_FILE" ]; then
              rm -f "$PROTECTED_BEFORE_FILE"
            fi
            if [ -n "$PROTECTED_AFTER_FILE" ]; then
              rm -f "$PROTECTED_AFTER_FILE"
            fi
          }
          case "$REMOTE_ENV_FILE" in
            /tmp/explorer_qa_deploy.[A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9]) ;;
            *)
              echo "[deploy-qa] ERROR: invalid deployment configuration path."
              exit 1
              ;;
          esac
          trap cleanup_remote_files EXIT

          if [ ! -f "$REMOTE_ENV_FILE" ] || [ -L "$REMOTE_ENV_FILE" ]; then
            echo "[deploy-qa] ERROR: deployment configuration was not transferred."
            exit 1
          fi
          set -a
          . "$REMOTE_ENV_FILE"
          set +a
          rm -f "$REMOTE_ENV_FILE"

          case "${WORKSPACE:-}" in
            ''|.|..|*[!A-Za-z0-9._-]*)
              echo "[deploy-qa] ERROR: invalid workspace name '${WORKSPACE:-}'."
              exit 1
              ;;
          esac
          if [ "$WORKSPACE" = "${SOUL_GATEWAY_WORKSPACE:-soulGateway}" ]; then
            echo "[deploy-qa] ERROR: refusing to operate on the production Soul Gateway workspace."
            exit 1
          fi
          case "${ROUTER_PORT:-}" in
            ''|*[!0-9]*)
              echo "[deploy-qa] ERROR: invalid router port '${ROUTER_PORT:-}'."
              exit 1
              ;;
          esac
          if [ "$ROUTER_PORT" -lt 1 ] || [ "$ROUTER_PORT" -gt 65535 ]; then
            echo "[deploy-qa] ERROR: router port must be between 1 and 65535."
            exit 1
          fi
          case "$ROUTER_PORT" in
            8042|8043|8080|8085|8317|8318)
              echo "[deploy-qa] ERROR: refusing to use protected proxies-host port $ROUTER_PORT."
              exit 1
              ;;
          esac
          git check-ref-format --branch "$DEPLOY_BRANCH" >/dev/null
          git check-ref-format --branch "$PLOINKY_BRANCH" >/dev/null
          if [ "$PUBLIC_URL" != "https://$PUBLIC_HOST" ]; then
            echo "[deploy-qa] ERROR: public URL and hostname do not identify Explorer QA."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "[deploy-qa] ERROR: a scoped Cloudflare API token is required."
            exit 1
          fi
          if [[ "$CLOUDFLARE_API_TOKEN" == cfk_* ]]; then
            echo "[deploy-qa] ERROR: the configured Cloudflare credential is a Global API Key, not a scoped Bearer API Token."
            exit 1
          fi
          if [[ ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-f0-9]{32}$ ]] ||
            [[ ! "$CLOUDFLARE_ZONE_ID" =~ ^[a-f0-9]{32}$ ]]; then
            echo "[deploy-qa] ERROR: Cloudflare account or zone identifiers are malformed."
            exit 1
          fi
          if [[ ! "$CLOUDFLARE_TUNNEL_ID" =~ ^[a-f0-9-]{36}$ ]]; then
            echo "[deploy-qa] ERROR: the authorized existing Cloudflare tunnel ID is malformed."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_TUNNEL_TOKEN:-}" ]; then
            echo "[deploy-qa] ERROR: the authorized existing Cloudflare tunnel token is required."
            exit 1
          fi
          if [[ ! "$PLOINKY_MASTER_KEY" =~ ^[A-Fa-f0-9]{64}$ ]]; then
            echo "[deploy-qa] ERROR: the QA Ploinky master key is malformed."
            exit 1
          fi
          if [[ ! "$CLOUDFLARE_TUNNEL_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,47}$ ]]; then
            echo "[deploy-qa] ERROR: managed Cloudflare tunnel name is malformed."
            exit 1
          fi

          for tool in git node curl; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "[deploy-qa] ERROR: missing required host tool '$tool'."
              exit 1
            fi
          done
          if ! command -v podman >/dev/null 2>&1 && ! command -v docker >/dev/null 2>&1; then
            echo "[deploy-qa] ERROR: neither Podman nor Docker is installed."
            exit 1
          fi

          WORK_DIR="$HOME/$WORKSPACE"
          if [ "$(id -un)" != 'admin' ] || [ "$HOME" != '/home/admin' ] ||
            [ "$WORK_DIR" != '/home/admin/explorerQaWorkspace' ]; then
            echo "[deploy-qa] ERROR: remote Explorer QA identity is not the pinned admin workspace."
            exit 1
          fi
          BOX_PATH_HASH="$(
            node --input-type=module -e '
              import crypto from "node:crypto";
              import path from "node:path";
              process.stdout.write(
                crypto.createHash("sha256").update(path.resolve(process.argv[1])).digest("hex").slice(0, 12),
              );
            ' "$WORK_DIR"
          )"
          if [ "$BOX_PATH_HASH" != '7a31ab7775eb' ]; then
            echo "[deploy-qa] ERROR: Explorer QA workspace hash does not match the pinned identity."
            exit 1
          fi
          BOX_INSTANCE="ploinky-box-explorerqaworkspace-$BOX_PATH_HASH"
          if [ -L "$WORK_DIR" ]; then
            echo "[deploy-qa] ERROR: workspace identity path must not be a symlink: $WORK_DIR"
            exit 1
          fi
          if [ -L "$WORK_DIR/.ploinky" ]; then
            echo "[deploy-qa] ERROR: workspace authority directory must not be a symlink: $WORK_DIR/.ploinky"
            exit 1
          fi

          snapshot_protected_resources() {
            local target="$1"
            node --input-type=module - "$BOX_PATH_HASH" "$BOX_INSTANCE" <<'NODE' > "$target"
          import { execFileSync } from 'node:child_process';

          const [qaHash, qaName] = process.argv.slice(2);
          const run = (engine, args) => execFileSync(engine, args, { encoding: 'utf8' }).trim();
          const engines = ['podman', 'docker'].filter((engine) => {
            try { run('sh', ['-lc', `command -v ${engine}`]); return true; } catch { return false; }
          });
          const protectedState = [];
          for (const engine of engines) {
            const containerIds = run(engine, ['container', 'ls', '-aq']).split('\n').filter(Boolean);
            for (const id of containerIds) {
              const item = JSON.parse(run(engine, ['container', 'inspect', id]))[0];
              const labels = item?.Config?.Labels || item?.Labels || {};
              const name = String(item?.Name || '').replace(/^\//, '');
              if (labels['io.assistos.ploinky-box.path-hash'] === qaHash || name === qaName) continue;
              protectedState.push({
                engine,
                kind: 'container',
                id: item.Id,
                name,
                image: item.Image,
                labels: Object.fromEntries(Object.entries(labels).sort()),
              });
            }
            const volumeNames = run(engine, ['volume', 'ls', '-q']).split('\n').filter(Boolean);
            for (const name of volumeNames) {
              const item = JSON.parse(run(engine, ['volume', 'inspect', name]))[0];
              const labels = item?.Labels || {};
              if (labels['io.assistos.ploinky-box.path-hash'] === qaHash
                || name.startsWith(`${qaName}-`)) continue;
              protectedState.push({
                engine,
                kind: 'volume',
                name,
                labels: Object.fromEntries(Object.entries(labels).sort()),
              });
            }
          }
          protectedState.sort((a, b) => JSON.stringify(a).localeCompare(JSON.stringify(b)));
          process.stdout.write(`${JSON.stringify(protectedState)}\n`);
          NODE
          }

          PROTECTED_BEFORE_FILE="$(mktemp /tmp/explorer_qa_protected_before.XXXXXX)"
          PROTECTED_AFTER_FILE="$(mktemp /tmp/explorer_qa_protected_after.XXXXXX)"
          snapshot_protected_resources "$PROTECTED_BEFORE_FILE"
          echo "[deploy-qa] Protected host resource identity sha256=$(sha256sum "$PROTECTED_BEFORE_FILE" | awk '{print $1}')"

          declare -a QA_CONTAINER_RECORDS=()
          declare -a QA_VOLUME_RECORDS=()
          QA_VOLUME_ROLES=(workspace containers ploinky-deps)
          for engine in podman docker; do
            command -v "$engine" >/dev/null 2>&1 || continue
            while IFS= read -r container_id; do
              [ -n "$container_id" ] || continue
              container_name="$($engine container inspect "$container_id" --format '{{.Name}}' | sed 's#^/##')"
              container_hash="$($engine container inspect "$container_id" --format '{{ index .Config.Labels "io.assistos.ploinky-box.path-hash" }}')"
              container_role="$($engine container inspect "$container_id" --format '{{ index .Config.Labels "io.assistos.ploinky-box.role" }}')"
              if [ "$container_hash" != "$BOX_PATH_HASH" ] || [ "$container_role" != 'box' ] ||
                [ "$container_name" != "$BOX_INSTANCE" ]; then
                echo "[deploy-qa] ERROR: exact QA Box identity has conflicting ownership labels."
                exit 1
              fi
              QA_CONTAINER_RECORDS+=("$engine|$container_id|$container_name")
              echo "[deploy-qa] Rollback Box: engine=$engine id=$container_id name=$container_name pathHash=$container_hash role=$container_role"
              "$engine" container exec "$container_id" sh -lc '
                for nested_engine in podman docker; do
                  command -v "$nested_engine" >/dev/null 2>&1 || continue
                  "$nested_engine" container ls -a --format "[deploy-qa] Rollback nested container: id={{.ID}} name={{.Names}} image={{.Image}} status={{.Status}} labels={{.Labels}}"
                  "$nested_engine" volume ls --format "[deploy-qa] Rollback nested volume: name={{.Name}} labels={{.Labels}}"
                done
              '
            done < <(
              {
                "$engine" container ls -aq --filter "label=io.assistos.ploinky-box.path-hash=$BOX_PATH_HASH"
                if "$engine" container inspect "$BOX_INSTANCE" >/dev/null 2>&1; then
                  "$engine" container inspect "$BOX_INSTANCE" --format '{{.Id}}'
                fi
              } | sort -u
            )

            while IFS= read -r volume_name; do
              [ -n "$volume_name" ] || continue
              volume_hash="$($engine volume inspect "$volume_name" --format '{{ index .Labels "io.assistos.ploinky-box.path-hash" }}')"
              volume_role="$($engine volume inspect "$volume_name" --format '{{ index .Labels "io.assistos.ploinky-box.role" }}')"
              role_allowed=0
              for allowed_role in "${QA_VOLUME_ROLES[@]}"; do
                if [ "$volume_role" = "$allowed_role" ]; then role_allowed=1; fi
              done
              if [ "$volume_hash" != "$BOX_PATH_HASH" ] || [ "$role_allowed" != '1' ] ||
                [ "$volume_name" != "$BOX_INSTANCE-$volume_role" ]; then
                echo "[deploy-qa] ERROR: exact QA volume identity has conflicting ownership labels: $volume_name"
                exit 1
              fi
              QA_VOLUME_RECORDS+=("$engine|$volume_name|$volume_role")
              echo "[deploy-qa] Rollback volume: engine=$engine name=$volume_name pathHash=$volume_hash role=$volume_role"
            done < <(
              {
                "$engine" volume ls -q --filter "label=io.assistos.ploinky-box.path-hash=$BOX_PATH_HASH"
                for volume_role in "${QA_VOLUME_ROLES[@]}"; do
                  exact_volume="$BOX_INSTANCE-$volume_role"
                  if "$engine" volume inspect "$exact_volume" >/dev/null 2>&1; then printf '%s\n' "$exact_volume"; fi
                done
              } | sort -u
            )
          done

          if [ "${#QA_CONTAINER_RECORDS[@]}" -gt 1 ]; then
            echo "[deploy-qa] ERROR: exact QA Box identity is ambiguous across engines."
            exit 1
          fi
          echo "[deploy-qa] Removing only the exact Explorer QA Box, labeled volumes, and identity directory..."
          for record in "${QA_CONTAINER_RECORDS[@]}"; do
            IFS='|' read -r engine container_id _ <<< "$record"
            "$engine" container rm -f "$container_id"
          done
          for record in "${QA_VOLUME_RECORDS[@]}"; do
            IFS='|' read -r engine volume_name _ <<< "$record"
            "$engine" volume rm "$volume_name"
          done
          node --input-type=module - "$WORK_DIR" <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const target = path.resolve(process.argv[2]);
          if (target !== '/home/admin/explorerQaWorkspace') {
            throw new Error(`refusing recursive cleanup outside exact QA identity: ${target}`);
          }
          try {
            const current = fs.lstatSync(target);
            if (!current.isDirectory() || current.isSymbolicLink()
              || (typeof process.getuid === 'function' && current.uid !== process.getuid())) {
              throw new Error(`refusing unsafe QA identity directory: ${target}`);
            }
            fs.rmSync(target, { recursive: true, force: false, maxRetries: 3 });
          } catch (error) {
            if (error?.code !== 'ENOENT') throw error;
          }
          NODE
          for engine in podman docker; do
            command -v "$engine" >/dev/null 2>&1 || continue
            if [ -n "$($engine container ls -aq --filter "label=io.assistos.ploinky-box.path-hash=$BOX_PATH_HASH")" ] ||
              "$engine" container inspect "$BOX_INSTANCE" >/dev/null 2>&1 ||
              [ -n "$($engine volume ls -q --filter "label=io.assistos.ploinky-box.path-hash=$BOX_PATH_HASH")" ]; then
              echo "[deploy-qa] ERROR: exact QA orphan resources remained after cleanup."
              exit 1
            fi
            for volume_role in "${QA_VOLUME_ROLES[@]}"; do
              if "$engine" volume inspect "$BOX_INSTANCE-$volume_role" >/dev/null 2>&1; then
                echo "[deploy-qa] ERROR: exact QA volume remained after cleanup."
                exit 1
              fi
            done
          done
          if [ -e "$WORK_DIR" ] || [ -L "$WORK_DIR" ]; then
            echo "[deploy-qa] ERROR: exact QA identity directory remained after cleanup."
            exit 1
          fi
          echo "[deploy-qa] Exact prior Explorer QA deployment cleanup verified."

          mkdir -p "$WORK_DIR"
          chmod 700 "$WORK_DIR"
          node --input-type=module - "$WORK_DIR/.env" <<'NODE'
          import fs from 'node:fs';

          const target = process.argv[2];
          const key = String(process.env.PLOINKY_MASTER_KEY || '');
          const content = `PLOINKY_MASTER_KEY=${key}\n`;
          if (!/^[A-Fa-f0-9]{64}$/.test(key)) {
            throw new Error('invalid QA Ploinky master key');
          }
          try {
            const current = fs.lstatSync(target);
            if (!current.isFile() || current.isSymbolicLink() || current.nlink !== 1
              || (typeof process.getuid === 'function' && current.uid !== process.getuid())) {
              throw new Error(`refusing unsafe workspace master-key target: ${target}`);
            }
            if (fs.readFileSync(target, 'utf8') !== content) {
              throw new Error('existing QA workspace master key does not match the authorized key');
            }
            fs.chmodSync(target, 0o600);
          } catch (error) {
            if (error?.code !== 'ENOENT') throw error;
            fs.writeFileSync(target, content, { encoding: 'utf8', flag: 'wx', mode: 0o600 });
            fs.chmodSync(target, 0o600);
          }
          NODE
          unset PLOINKY_MASTER_KEY
          mkdir -p "$WORK_DIR/.runtime"
          RUNTIME_DIR="$WORK_DIR/.runtime/ploinky"

          inspect_outer_box_status() {
            env PLOINKY_WORKSPACE_ROOT="$WORK_DIR" \
              node --input-type=module - \
                "$RUNTIME_DIR/ploinky-box/supervisor.mjs" <<'NODE'
          import { pathToFileURL } from 'node:url';

          const supervisorModule = process.argv[2];
          const {
            createBoxSupervisor,
            formatBoxStatus,
          } = await import(pathToFileURL(supervisorModule).href);
          const status = createBoxSupervisor().inspectBoxStatus();
          process.stdout.write(formatBoxStatus(status));
          NODE
          }

          if [ -e "$RUNTIME_DIR" ] && [ ! -d "$RUNTIME_DIR/.git" ]; then
            echo "[deploy-qa] ERROR: managed runtime path is not a Ploinky git checkout: $RUNTIME_DIR"
            exit 1
          fi
          if [ ! -d "$RUNTIME_DIR/.git" ]; then
            echo "[deploy-qa] Cloning the dedicated QA Ploinky runtime..."
            git clone --no-checkout https://github.com/AssistOS-AI/ploinky.git "$RUNTIME_DIR"
          fi

          RUNTIME_ORIGIN="$(git -C "$RUNTIME_DIR" remote get-url origin)"
          case "${RUNTIME_ORIGIN%.git}" in
            https://github.com/AssistOS-AI/ploinky) ;;
            *)
              echo "[deploy-qa] ERROR: unexpected Ploinky runtime origin '$RUNTIME_ORIGIN'."
              exit 1
              ;;
          esac

          GRAPH_REPOSITORIES=(
            'AchillesIDE|https://github.com/AssistOS-AI/AssistOSExplorer.git'
            'webmeetInfra|https://github.com/AssistOS-AI/webmeetInfra.git'
            'UmamiAgent|https://github.com/AssistOS-AI/UmamiAgent.git'
            'AchillesCLI|https://github.com/AssistOS-AI/AchillesCLI.git'
            'copilot-agents|https://github.com/AssistOS-AI/copilot-agents.git'
            'proxies|https://github.com/AssistOS-AI/proxies.git'
            'basic|https://github.com/AssistOS-AI/basic.git'
            'container-image-builds|https://github.com/AssistOS-AI/container-image-builds.git'
          )
          declare -A EXPECTED_COMMITS=()

          AGENTLIB_URL='https://github.com/AssistOS-AI/achillesAgentLib.git'
          if ! agentlib_record="$(
            git ls-remote --exit-code --heads "$AGENTLIB_URL" "refs/heads/$DEPLOY_BRANCH"
          )"; then
            echo "[deploy-qa] ERROR: achillesAgentLib has no '$DEPLOY_BRANCH' branch."
            exit 1
          fi
          EXPECTED_AGENTLIB_COMMIT="$(printf '%s\n' "$agentlib_record" | awk 'NR == 1 { print $1 }')"
          if [[ ! "$EXPECTED_AGENTLIB_COMMIT" =~ ^[a-f0-9]{40}$ ]]; then
            echo "[deploy-qa] ERROR: unable to resolve achillesAgentLib/$DEPLOY_BRANCH."
            exit 1
          fi

          echo "[deploy-qa] Resolving $DEPLOY_BRANCH across every managed Explorer repository..."
          for repository_record in "${GRAPH_REPOSITORIES[@]}"; do
            IFS='|' read -r repository_name repository_url <<< "$repository_record"
            if ! branch_record="$(
              git ls-remote --exit-code --heads \
                "$repository_url" \
                "refs/heads/$DEPLOY_BRANCH"
            )"; then
              echo "[deploy-qa] ERROR: $repository_name has no '$DEPLOY_BRANCH' branch."
              exit 1
            fi
            expected_commit="$(
              printf '%s\n' "$branch_record" | awk 'NR == 1 { print $1 }'
            )"
            if [[ ! "$expected_commit" =~ ^[a-f0-9]{40}$ ]]; then
              echo "[deploy-qa] ERROR: unable to resolve $repository_name/$DEPLOY_BRANCH."
              exit 1
            fi
            EXPECTED_COMMITS["$repository_name"]="$expected_commit"
          done

          if [ -x "$RUNTIME_DIR/bin/ploinky" ] &&
            [ -f "$RUNTIME_DIR/ploinky-box/bin/ploinky-box.mjs" ]; then
            echo "[deploy-qa] Stopping the existing QA Box before updating its mounted runtime..."
            if ! env PLOINKY_WORKSPACE_ROOT="$WORK_DIR" "$RUNTIME_DIR/bin/ploinky" stop; then
              echo "[deploy-qa] The inner graceful stop failed; proving the outer Box stopped..."
              if ! STOPPED_BOX_STATUS="$(inspect_outer_box_status)"; then
                echo "[deploy-qa] ERROR: unable to inspect the Box after the degraded stop."
                exit 1
              fi
              case "$STOPPED_BOX_STATUS" in
                *"Ploinky Box: stopped"*)
                  echo "[deploy-qa] The exact outer Box is stopped; continuing recovery."
                  ;;
                *)
                  printf '%s\n' "$STOPPED_BOX_STATUS"
                  echo "[deploy-qa] ERROR: the Box remained running or ambiguous after the degraded stop."
                  exit 1
                  ;;
              esac
            fi
          fi
          git -C "$RUNTIME_DIR" fetch --prune origin \
            "refs/heads/$PLOINKY_BRANCH:refs/remotes/origin/$PLOINKY_BRANCH"
          git -C "$RUNTIME_DIR" checkout --detach --force "refs/remotes/origin/$PLOINKY_BRANCH"
          git -C "$RUNTIME_DIR" reset --hard "refs/remotes/origin/$PLOINKY_BRANCH"
          git -C "$RUNTIME_DIR" clean -ffd

          PLOINKY="$RUNTIME_DIR/bin/ploinky"
          if [ ! -x "$PLOINKY" ]; then
            echo "[deploy-qa] ERROR: selected Ploinky branch does not provide bin/ploinky."
            exit 1
          fi
          echo "[deploy-qa] Ploinky runtime: $(git -C "$RUNTIME_DIR" rev-parse --short HEAD) ($PLOINKY_BRANCH)"
          node --input-type=module - \
            "$RUNTIME_DIR/globalDeps/package.json" \
            "$EXPECTED_AGENTLIB_COMMIT" <<'NODE'
          import fs from 'node:fs';

          const packageFile = process.argv[2];
          const expectedCommit = process.argv[3];
          const manifest = JSON.parse(fs.readFileSync(packageFile, 'utf8'));
          const source = String(manifest?.dependencies?.achillesAgentLib || '');
          if (!source.endsWith(`#${expectedCommit}`)) {
            throw new Error('Ploinky does not pin the selected achillesAgentLib branch revision');
          }
          NODE
          echo "[deploy-qa] Verified the Ploinky AgentLib pin at $EXPECTED_AGENTLIB_COMMIT."

          mkdir -p "$WORK_DIR/.ploinky"
          chmod 700 "$WORK_DIR/.ploinky"
          EDGE_DESIRED_FILE="$WORK_DIR/.ploinky/edge-desired.json"
          node --input-type=module - \
            "$EDGE_DESIRED_FILE" \
            "$PUBLIC_HOST" \
            "$CLOUDFLARE_ACCOUNT_ID" \
            "$CLOUDFLARE_ZONE_ID" \
            "$CLOUDFLARE_TUNNEL_ID" \
            "$CLOUDFLARE_TUNNEL_SECRET_HANDLE" \
            "$CLOUDFLARE_API_SECRET_HANDLE" \
            "$MEDIA_PUBLIC_IPV4" <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const target = path.resolve(process.argv[2]);
          const [
            publicHost,
            accountId,
            zoneId,
            tunnelId,
            tunnelTokenSecret,
            apiTokenSecret,
            mediaPublicIPv4,
          ] = process.argv.slice(3);
          const desired = {
            hosts: {
              [publicHost]: {
                agent: 'AchillesIDE/explorer',
                routerSurfaces: [
                  'browser-auth',
                  'agent-mcp',
                  'user-admin',
                  'workspace-assets',
                  'blob-transfer',
                  'marketplace-ui',
                  'webchat',
                ],
              },
            },
            cloudflare: {
              accountId,
              zoneId,
              tunnelId,
              tunnelTokenSecret,
              apiTokenSecret,
            },
            media: {
              publicIPv4: mediaPublicIPv4,
              addressMode: 'direct',
            },
          };
          try {
            const current = fs.lstatSync(target);
            if (!current.isFile() || current.isSymbolicLink() || current.nlink !== 1) {
              throw new Error(`refusing unsafe edge desired target: ${target}`);
            }
          } catch (error) {
            if (error?.code !== 'ENOENT') throw error;
          }
          const temporary = `${target}.${process.pid}.tmp`;
          try {
            fs.writeFileSync(temporary, `${JSON.stringify(desired, null, 2)}\n`, {
              encoding: 'utf8',
              flag: 'wx',
              mode: 0o600,
            });
            fs.renameSync(temporary, target);
            fs.chmodSync(target, 0o600);
          } finally {
            try { fs.unlinkSync(temporary); } catch (error) {
              if (error?.code !== 'ENOENT') throw error;
            }
          }
          NODE
          echo "[deploy-qa] Selected the authorized existing Cloudflare tunnel for $PUBLIC_HOST."

          SOUL_HEALTH_URL="http://127.0.0.1:${SOUL_GATEWAY_ROUTER_PORT:-8080}/base-agent-additional-server/soul-gateway/7000/healthz/"
          SOUL_UP_BEFORE=0
          if curl -sf "$SOUL_HEALTH_URL" >/dev/null 2>&1; then
            SOUL_UP_BEFORE=1
            echo "[deploy-qa] Protected Soul Gateway was healthy before deployment."
          fi

          export PLOINKY_WORKSPACE_ROOT="$WORK_DIR"
          PLAN_JSON="$(
            "$PLOINKY" --dry-run --port "$ROUTER_PORT" start explorer --branch=ploinky-proxy
          )"
          BOX_INSTANCE="$(
            printf '%s' "$PLAN_JSON" |
              node -e '
                let input = "";
                process.stdin.on("data", (chunk) => { input += chunk; });
                process.stdin.on("end", () => {
                  const plan = JSON.parse(input);
                  if (!/^ploinky-box-[a-z0-9-]+-[a-f0-9]{12}$/.test(plan.identity || "")) {
                    throw new Error("invalid Box identity in dry-run plan");
                  }
                  process.stdout.write(plan.identity);
                });
              '
          )"
          if [ "$BOX_INSTANCE" != "ploinky-box-explorerqaworkspace-$BOX_PATH_HASH" ]; then
            echo "[deploy-qa] ERROR: Ploinky dry-run selected an identity outside the pinned Explorer QA Box."
            exit 1
          fi
          echo "[deploy-qa] Box plan: $PLAN_JSON"

          echo "[deploy-qa] Preparing the exact QA Box..."
          node --input-type=module - \
            "$RUNTIME_DIR/ploinky-box/supervisor.mjs" \
            "$ROUTER_PORT" <<'NODE'
          import { pathToFileURL } from 'node:url';

          const supervisorModule = process.argv[2];
          const routerPort = Number(process.argv[3]);
          if (!Number.isSafeInteger(routerPort) || routerPort < 1 || routerPort > 65535) {
            throw new Error('invalid Router port');
          }
          const { createBoxSupervisor } = await import(pathToFileURL(supervisorModule).href);
          await createBoxSupervisor().prepareBoxForCommand({ explicitPort: routerPort });
          NODE

          BOX_ENGINE=""
          for candidate in podman docker; do
            if command -v "$candidate" >/dev/null 2>&1 &&
              "$candidate" container inspect "$BOX_INSTANCE" >/dev/null 2>&1; then
              if [ -n "$BOX_ENGINE" ]; then
                echo "[deploy-qa] ERROR: Box identity exists in more than one container engine."
                exit 1
              fi
              BOX_ENGINE="$candidate"
            fi
          done
          if [ -z "$BOX_ENGINE" ]; then
            echo "[deploy-qa] ERROR: exact Box instance '$BOX_INSTANCE' was not found."
            exit 1
          fi

          "$BOX_ENGINE" container exec \
            --user podman \
            "$BOX_INSTANCE" \
            node --input-type=module --eval '
              import fs from "node:fs";
              const target = "/workspace/.ploinky";
              try {
                const current = fs.lstatSync(target);
                if (!current.isDirectory() || current.isSymbolicLink()) {
                  throw new Error(`refusing unsafe Ploinky authority directory: ${target}`);
                }
                if (typeof process.getuid === "function" && current.uid !== process.getuid()) {
                  throw new Error(`Ploinky authority directory has the wrong owner: ${target}`);
                }
              } catch (error) {
                if (error?.code !== "ENOENT") throw error;
                fs.mkdirSync(target, { mode: 0o700 });
              }
              fs.chmodSync(target, 0o700);
            '

          STAGED_EDGE_DESIRED="/workspace/.ploinky/.explorer-qa-edge-desired.json"
          "$BOX_ENGINE" container exec \
            --user podman \
            "$BOX_INSTANCE" \
            node --input-type=module --eval '
              import fs from "node:fs";
              const staged = "/workspace/.ploinky/.explorer-qa-edge-desired.json";
              try {
                const current = fs.lstatSync(staged);
                if (!current.isFile() || current.isSymbolicLink() || current.nlink !== 1) {
                  throw new Error(`refusing unsafe staged edge desired file: ${staged}`);
                }
                if (typeof process.getuid === "function" && current.uid !== process.getuid()) {
                  throw new Error(`staged edge desired file has the wrong owner: ${staged}`);
                }
                fs.unlinkSync(staged);
              } catch (error) {
                if (error?.code !== "ENOENT") throw error;
              }
            '
          "$BOX_ENGINE" container cp \
            "$EDGE_DESIRED_FILE" \
            "$BOX_INSTANCE:$STAGED_EDGE_DESIRED"
          "$BOX_ENGINE" container exec \
            --user podman \
            "$BOX_INSTANCE" \
            node --input-type=module --eval '
              import fs from "node:fs";
              const staged = "/workspace/.ploinky/.explorer-qa-edge-desired.json";
              const target = "/workspace/.ploinky/edge-desired.json";
              try {
                const stagedStat = fs.lstatSync(staged);
                if (!stagedStat.isFile() || stagedStat.isSymbolicLink() || stagedStat.nlink !== 1) {
                  throw new Error(`refusing unsafe staged edge desired file: ${staged}`);
                }
                if (typeof process.getuid === "function" && stagedStat.uid !== process.getuid()) {
                  throw new Error(`staged edge desired file has the wrong owner: ${staged}`);
                }
                JSON.parse(fs.readFileSync(staged, "utf8"));
                try {
                  const current = fs.lstatSync(target);
                  if (!current.isFile() || current.isSymbolicLink() || current.nlink !== 1) {
                    throw new Error(`refusing unsafe edge desired target: ${target}`);
                  }
                  if (typeof process.getuid === "function" && current.uid !== process.getuid()) {
                    throw new Error(`edge desired target has the wrong owner: ${target}`);
                  }
                } catch (error) {
                  if (error?.code !== "ENOENT") throw error;
                }
                fs.renameSync(staged, target);
                fs.chmodSync(target, 0o600);
              } finally {
                try { fs.unlinkSync(staged); } catch (error) {
                  if (error?.code !== "ENOENT") throw error;
                }
              }
            '

          CLOUDFLARE_CREDENTIAL_FILE="$(mktemp /tmp/explorer_qa_cloudflare.XXXXXX)"
          node --input-type=module - "$CLOUDFLARE_CREDENTIAL_FILE" <<'NODE'
          import fs from 'node:fs';

          const target = process.argv[2];
          const values = {
            'publication/explorer-qa-api': String(process.env.CLOUDFLARE_API_TOKEN || ''),
            'publication/explorer-qa-tunnel': String(process.env.CLOUDFLARE_TUNNEL_TOKEN || ''),
          };
          if (Object.values(values).some((value) => !value)) {
            throw new Error('Cloudflare credentials are missing');
          }
          fs.writeFileSync(target, JSON.stringify(values), {
            encoding: 'utf8',
            flag: 'w',
            mode: 0o600,
          });
          fs.chmodSync(target, 0o600);
          NODE
          STAGED_CREDENTIAL_FILE="/workspace/.ploinky/.explorer-qa-cloudflare-credentials.json"
          CREDENTIAL_STATUS=0
          "$BOX_ENGINE" container cp \
            "$CLOUDFLARE_CREDENTIAL_FILE" \
            "$BOX_INSTANCE:$STAGED_CREDENTIAL_FILE" || CREDENTIAL_STATUS=$?
          if [ "$CREDENTIAL_STATUS" = "0" ]; then
            "$BOX_ENGINE" container exec \
              --user podman \
              --workdir /workspace \
              --env PLOINKY_WORKSPACE_ROOT=/workspace \
              "$BOX_INSTANCE" \
              node --input-type=module --eval '
                import fs from "node:fs";
                import { setSecretValue } from "/opt/ploinky/cli/utils/security/encryptedSecretsFile.js";
                const file = process.argv.at(-1);
                const values = JSON.parse(fs.readFileSync(file, "utf8"));
                const expected = [
                  "publication/explorer-qa-api",
                  "publication/explorer-qa-tunnel",
                ];
                if (JSON.stringify(Object.keys(values).sort()) !== JSON.stringify(expected)) {
                  throw new Error("unexpected Cloudflare credential handles");
                }
                for (const [name, value] of Object.entries(values)) {
                  if (!String(value || "")) throw new Error(`empty Cloudflare credential ${name}`);
                  setSecretValue(name, value);
                }
              ' "$STAGED_CREDENTIAL_FILE" || CREDENTIAL_STATUS=$?
          fi
          "$BOX_ENGINE" container exec \
            --user podman \
            "$BOX_INSTANCE" \
            rm -f "$STAGED_CREDENTIAL_FILE" >/dev/null 2>&1 || true
          rm -f "$CLOUDFLARE_CREDENTIAL_FILE"
          CLOUDFLARE_CREDENTIAL_FILE=""
          unset CLOUDFLARE_API_TOKEN
          unset CLOUDFLARE_TUNNEL_TOKEN
          if [ "$CREDENTIAL_STATUS" != "0" ]; then
            echo "[deploy-qa] ERROR: unable to persist Cloudflare credentials in the encrypted Ploinky store."
            exit "$CREDENTIAL_STATUS"
          fi

          echo "[deploy-qa] Starting Explorer with every managed repository on $DEPLOY_BRANCH..."
          "$PLOINKY" start explorer --branch=ploinky-proxy

          QA_READY=0
          QA_READY_STREAK=0
          QA_TERMINAL_FAILURE=0
          NO_WAIT_FAILURES=""
          for _ in $(seq 1 90); do
            BOX_STATUS="$(inspect_outer_box_status)"
            if [[ "$BOX_STATUS" == *"Ploinky Box: running-initialized"* ]] &&
              [[ "$BOX_STATUS" == *"Tracked agents: 16"* ]] &&
              [[ "$BOX_STATUS" == *"Running agents: 16"* ]] &&
              [[ "$BOX_STATUS" == *"Cloudflare mode: cloudflare"* ]] &&
              [[ "$BOX_STATUS" == *"Cloudflare management: api-managed"* ]] &&
              [[ "$BOX_STATUS" == *"Cloudflare publication: ready"* ]] &&
              [[ "$BOX_STATUS" == *"Cloudflare connector: running"* ]]; then
              QA_READY_STREAK=$((QA_READY_STREAK + 1))
              if [ "$QA_READY_STREAK" -ge 3 ]; then
                QA_READY=1
                break
              fi
            else
              QA_READY_STREAK=0
              if NO_WAIT_FAILURES="$(
                "$BOX_ENGINE" container exec \
                  --user podman \
                  "$BOX_INSTANCE" \
                  node -e '
                    const fs = require("node:fs");
                    const directory = "/workspace/.ploinky/running/no-wait";
                    let files = [];
                    try {
                      files = fs.readdirSync(directory).filter((name) => name.endsWith(".json"));
                    } catch (error) {
                      if (error?.code !== "ENOENT") throw error;
                    }
                    const failures = files.flatMap((name) => {
                      try {
                        const status = JSON.parse(fs.readFileSync(`${directory}/${name}`, "utf8"));
                        return status?.state === "failed" ? [status] : [];
                      } catch {
                        return [];
                      }
                    });
                    if (!failures.length) process.exit(1);
                    for (const status of failures) {
                      const message = String(status?.error?.message || "unknown failure")
                        .replace(/\s+/g, " ")
                        .replace(/((?:token|secret|password|authorization|cookie)\s*[:=]\s*)\S+/gi, "$1[redacted]");
                      process.stdout.write(
                        `[deploy-qa] no-wait failure ${status.repoName}/${status.shortAgent}: ${message}\n`,
                      );
                    }
                  '
              )"; then
                QA_TERMINAL_FAILURE=1
                break
              fi
            fi
            sleep 10
          done
          printf '%s\n' "$BOX_STATUS"
          if [ "$QA_TERMINAL_FAILURE" = "1" ]; then
            printf '%s\n' "$NO_WAIT_FAILURES"
            echo "[deploy-qa] ERROR: a no-wait agent reached a terminal startup failure."
            exit 1
          fi
          if [ "$QA_READY" != "1" ]; then
            echo "[deploy-qa] ERROR: timed out waiting for stable 16/16 Explorer QA admission."
            exit 1
          fi
          case "$BOX_STATUS" in
            *"Ploinky Box: running-initialized"*) ;;
            *)
              echo "[deploy-qa] ERROR: Box did not reach running-initialized state."
              exit 1
              ;;
          esac
          for expected_status in \
            'Tracked agents: 16' \
            'Running agents: 16' \
            'Cloudflare mode: cloudflare' \
            'Cloudflare management: api-managed' \
            'Cloudflare publication: ready' \
            'Cloudflare connector: running'; do
            case "$BOX_STATUS" in
              *"$expected_status"*) ;;
              *)
                echo "[deploy-qa] ERROR: missing Box status '$expected_status'."
                exit 1
                ;;
            esac
          done
          for repository_record in "${GRAPH_REPOSITORIES[@]}"; do
            IFS='|' read -r repository_name _ <<< "$repository_record"
            deployed_commit="$(
              "$BOX_ENGINE" container exec \
                --user podman \
                "$BOX_INSTANCE" \
                git -C "/workspace/.ploinky/repos/$repository_name" rev-parse HEAD
            )"
            expected_commit="${EXPECTED_COMMITS[$repository_name]}"
            if [ "$deployed_commit" != "$expected_commit" ]; then
              echo "[deploy-qa] ERROR: deployed $repository_name commit $deployed_commit"
              echo "[deploy-qa]        does not match $DEPLOY_BRANCH at $expected_commit."
              exit 1
            fi
            deployed_branch="$(
              "$BOX_ENGINE" container exec --user podman "$BOX_INSTANCE" \
                git -C "/workspace/.ploinky/repos/$repository_name" branch --show-current
            )"
            deployed_upstream="$(
              "$BOX_ENGINE" container exec --user podman "$BOX_INSTANCE" \
                git -C "/workspace/.ploinky/repos/$repository_name" rev-parse \
                  --abbrev-ref --symbolic-full-name '@{upstream}'
            )"
            deployed_dirty="$(
              "$BOX_ENGINE" container exec --user podman "$BOX_INSTANCE" \
                git -C "/workspace/.ploinky/repos/$repository_name" status --porcelain
            )"
            if [ "$deployed_branch" != "$DEPLOY_BRANCH" ] ||
              [ "$deployed_upstream" != "origin/$DEPLOY_BRANCH" ] ||
              [ -n "$deployed_dirty" ]; then
              echo "[deploy-qa] ERROR: deployed $repository_name checkout is not clean and tracking origin/$DEPLOY_BRANCH."
              exit 1
            fi
            echo "[deploy-qa] Verified $repository_name/$DEPLOY_BRANCH at $deployed_commit."
          done
          "$BOX_ENGINE" container exec \
            --user podman \
            --env "EXPECTED_AGENTLIB_COMMIT=$EXPECTED_AGENTLIB_COMMIT" \
            "$BOX_INSTANCE" \
            node --input-type=module --eval '
              import crypto from "node:crypto";
              import { execFileSync } from "node:child_process";
              import fs from "node:fs";
              import path from "node:path";

              const root = "/workspace/.ploinky/deps";
              const expectedBranch = "ploinky-proxy";
              const expectedCommit = String(process.env.EXPECTED_AGENTLIB_COMMIT || "");
              if (!/^[a-f0-9]{40}$/.test(expectedCommit)) {
                throw new Error("invalid expected AgentLib commit");
              }
              let manifests = 0;
              const packageRoots = [];
              const pending = [root];
              while (pending.length) {
                const directory = pending.pop();
                let entries;
                try {
                  entries = fs.readdirSync(directory, { withFileTypes: true });
                } catch (error) {
                  if (error?.code === "ENOENT") continue;
                  throw error;
                }
                for (const entry of entries) {
                  const target = path.join(directory, entry.name);
                  if (entry.isDirectory()) {
                    pending.push(target);
                    continue;
                  }
                  if (entry.name !== "package.json") continue;
                  const manifest = JSON.parse(fs.readFileSync(target, "utf8"));
                  if (manifest?.name === "ploinky-agent-lib"
                    && path.basename(path.dirname(target)) === "achillesAgentLib") {
                    packageRoots.push(path.dirname(target));
                  }
                  const source = String(manifest?.dependencies?.achillesAgentLib || "");
                  if (!source) continue;
                  manifests += 1;
                  if (!source.endsWith(`#${expectedBranch}`)) {
                    throw new Error(`dependency cache did not select achillesAgentLib#${expectedBranch}`);
                  }
                }
              }
              if (manifests < 1) throw new Error("no AgentLib dependency cache was materialized");
              if (packageRoots.length < 1) throw new Error("no installed AgentLib runtime package was materialized");

              const packageDigests = new Map();
              const digestPackage = (packageRoot) => {
                const files = [];
                const directories = [packageRoot];
                while (directories.length) {
                  const directory = directories.pop();
                  for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
                    const target = path.join(directory, entry.name);
                    const relative = path.relative(packageRoot, target);
                    if (entry.isDirectory()) {
                      if (!relative.split(path.sep).includes("node_modules")) directories.push(target);
                    } else if (entry.isFile()) {
                      files.push(relative);
                    }
                  }
                }
                files.sort();
                if (!files.length) throw new Error(`empty AgentLib runtime package: ${packageRoot}`);
                const hash = crypto.createHash("sha256");
                for (const relative of files) {
                  hash.update(relative); hash.update("\0");
                  hash.update(fs.readFileSync(path.join(packageRoot, relative))); hash.update("\0");
                }
                return { files: files.length, sha256: hash.digest("hex") };
              };
              for (const packageRoot of packageRoots) {
                const lockPath = path.join(path.dirname(packageRoot), ".package-lock.json");
                if (!fs.existsSync(lockPath)) throw new Error(`missing runtime lock for ${packageRoot}`);
                const lock = JSON.parse(fs.readFileSync(lockPath, "utf8"));
                const record = lock?.packages?.["node_modules/achillesAgentLib"];
                if (!String(record?.resolved || "").endsWith(`#${expectedCommit}`)) {
                  throw new Error(`AgentLib runtime lock is not pinned to ${expectedCommit}`);
                }
                const realRoot = fs.realpathSync(packageRoot);
                packageDigests.set(realRoot, digestPackage(realRoot));
              }

              const nested = JSON.parse(execFileSync("podman", ["container", "ls", "--format", "json"], { encoding: "utf8" }));
              const explorer = nested.find((item) => {
                const labels = item.Labels || item.labels || {};
                const names = Array.isArray(item.Names) ? item.Names.join(" ") : String(item.Names || item.Name || "");
                return labels["io.assistos.ploinky.resource"] === "agent" && names.includes("_explorer_");
              });
              const explorerName = Array.isArray(explorer?.Names) ? explorer.Names[0] : String(explorer?.Names || explorer?.Name || "");
              if (!explorerName) throw new Error("running Explorer container was not found for AgentLib resolution");
              const resolved = JSON.parse(execFileSync("podman", [
                "container", "exec", explorerName, "node", "-e",
                "const fs=require(\"fs\");const p=require.resolve(\"achillesAgentLib/package.json\");console.log(JSON.stringify({packageJson:p,realPackageJson:fs.realpathSync(p),entry:require.resolve(\"achillesAgentLib\")}));",
              ], { encoding: "utf8" }));
              const loadedRoot = path.dirname(resolved.realPackageJson);
              const loadedDigest = packageDigests.get(loadedRoot);
              if (!loadedDigest || !resolved.entry) {
                throw new Error("Explorer did not load AgentLib bytes from a verified immutable runtime package");
              }
              process.stdout.write(
                `[deploy-qa] Verified ${manifests} AgentLib manifests and ${packageDigests.size} installed packages at ${expectedCommit}; Explorer loaded ${loadedDigest.files} files sha256=${loadedDigest.sha256}.\n`,
              );
            '
          echo "[deploy-qa] Verified remote achillesAgentLib/$DEPLOY_BRANCH and loaded runtime identity at $EXPECTED_AGENTLIB_COMMIT."

          echo "[deploy-qa] Verifying the loopback Router publication..."
          ROUTER_OK=0
          for _ in $(seq 1 30); do
            code="$(
              curl -s -o /dev/null -w '%{http_code}' \
                "http://127.0.0.1:${ROUTER_PORT}/dashboard" || true
            )"
            if [ "$code" = "200" ] || [ "$code" = "302" ]; then
              ROUTER_OK=1
              break
            fi
            sleep 2
          done
          if [ "$ROUTER_OK" != "1" ]; then
            echo "[deploy-qa] ERROR: Box Router did not answer on loopback port $ROUTER_PORT."
            exit 1
          fi

          if [ "$SOUL_UP_BEFORE" = "1" ] && ! curl -sf "$SOUL_HEALTH_URL" >/dev/null 2>&1; then
            echo "[deploy-qa] ERROR: protected Soul Gateway became unhealthy during QA deployment."
            exit 1
          fi

          snapshot_protected_resources "$PROTECTED_AFTER_FILE"
          if ! cmp -s "$PROTECTED_BEFORE_FILE" "$PROTECTED_AFTER_FILE"; then
            echo "[deploy-qa] ERROR: an unrelated host container or volume identity changed during QA cleanup/deployment."
            exit 1
          fi
          echo "[deploy-qa] Protected host resource identities remained unchanged (sha256=$(sha256sum "$PROTECTED_AFTER_FILE" | awk '{print $1}'))."

          echo "[deploy-qa] Explorer QA Box is ready."
          REMOTE

      - name: Verify public URL
        run: |
          set -euo pipefail
          echo "[deploy-qa] Verifying the public Explorer login flow at ${PUBLIC_URL%/}/..."
          for attempt in $(seq 1 60); do
            code="$(
              curl -L -s -o /tmp/explorer-qa-response.txt -w '%{http_code}' \
                "${PUBLIC_URL%/}/" || true
            )"
            if [ "$code" = "200" ] || [ "$code" = "302" ]; then
              echo "[deploy-qa] Public URL responded with HTTP $code."
              exit 0
            fi
            if [ "$attempt" = "60" ]; then
              echo "::error::Public URL did not become reachable; last HTTP code: ${code:-none}"
              sed -n '1,40p' /tmp/explorer-qa-response.txt 2>/dev/null || true
              exit 1
            fi
            sleep 5
          done

      - name: Create summary
        if: always()
        run: |
          {
            echo "## Explorer QA Box Deploy"
            echo ""
            echo "- Host: \`${SSH_USER}@${SSH_HOST}\`"
            echo "- Identity directory: \`~/${WORKSPACE}\`"
            echo "- Router publication: \`127.0.0.1:${ROUTER_PORT}:8080/tcp\`"
            echo "- Media publication: \`0.0.0.0:7882:7882/udp\`"
            echo "- Managed graph branch: \`${DEPLOY_BRANCH}\`"
            echo "- Ploinky branch: \`${PLOINKY_BRANCH}\`"
            echo "- Cloudflare: existing authorized tunnel, ingress, and DNS API-managed by Ploinky"
            echo "- Public URL: \`${PUBLIC_URL}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: always()
        run: |
          rm -f \
            ~/.ssh/deploy_key \
            ~/.ssh/explorer_qa_known_hosts \
            /tmp/explorer_qa_deploy.env \
            /tmp/explorer-qa-response.txt
