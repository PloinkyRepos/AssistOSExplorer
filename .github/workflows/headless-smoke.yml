name: Headless Smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Explorer router URL to test'
        required: false
        default: 'https://skills.axiologic.dev'
        type: string
      webchat_agent:
        description: 'WebChat agent route name'
        required: false
        default: 'achilles-cli'
        type: string
      open_interpreter:
        description: 'Run long Open Interpreter relay checks'
        required: false
        default: false
        type: boolean
      webmeet_media:
        description: 'Run fake camera/microphone WebMeet media checks'
        required: false
        default: false
        type: boolean
      onlyoffice:
        description: 'Run DPU/OnlyOffice checks'
        required: false
        default: false
        type: boolean
      github:
        description: 'Run GitHub plugin checks'
        required: false
        default: false
        type: boolean

concurrency:
  group: headless-smoke-${{ inputs.base_url || 'default' }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Playwright smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: tests/smoke

    env:
      SMOKE_BASE_URL: ${{ inputs.base_url || vars.EXPLORER_PUBLIC_URL || 'https://skills.axiologic.dev' }}
      SMOKE_WEBCHAT_AGENT: ${{ inputs.webchat_agent || 'achilles-cli' }}
      SMOKE_USERNAME: ${{ secrets.SMOKE_USERNAME || vars.SMOKE_USERNAME || 'admin' }}
      SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD || 'admin' }}
      SMOKE_SECONDARY_USERNAME: ${{ secrets.SMOKE_SECONDARY_USERNAME || vars.SMOKE_SECONDARY_USERNAME || 'user' }}
      SMOKE_SECONDARY_PASSWORD: ${{ secrets.SMOKE_SECONDARY_PASSWORD || 'user' }}
      SMOKE_OPEN_INTERPRETER: ${{ inputs.open_interpreter && '1' || '0' }}
      SMOKE_WEBMEET_MEDIA: ${{ inputs.webmeet_media && '1' || '0' }}
      SMOKE_ONLYOFFICE: ${{ inputs.onlyoffice && '1' || '0' }}
      SMOKE_GITHUB: ${{ inputs.github && '1' || '0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tests/smoke/package-lock.json

      - name: Install smoke dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke suite
        run: npm test

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-smoke-artifacts
          path: |
            tests/smoke/test-results
            tests/smoke/playwright-report
            .ploinky/test-artifacts/headless-smoke
          if-no-files-found: ignore
