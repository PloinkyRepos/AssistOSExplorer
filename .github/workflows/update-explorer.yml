name: Update Explorer

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'AssistOSExplorer branch to update to'
        required: false
        default: 'main'
        type: string
      update_ploinky:
        description: 'Also update Ploinky on the remote host'
        required: false
        default: false
        type: boolean
      ploinky_branch:
        description: 'Ploinky branch (if updating)'
        required: false
        default: 'master'
        type: string
      workspace_name:
        description: 'Workspace directory name on the remote host'
        required: false
        default: 'explorerWorkspace'
        type: string
      router_port:
        description: 'Router port on the remote host'
        required: false
        default: '8097'
        type: string
      restart_services:
        description: 'Restart services after update'
        required: false
        default: true
        type: boolean

  push:
    branches:
      - main
    paths:
      - 'explorer/**'
      - '.github/workflows/update-explorer.yml'

env:
  SSH_USER: ${{ vars.SSH_USER || 'admin' }}
  SSH_HOST: ${{ vars.SSH_HOST || '193.180.209.191' }}

jobs:
  update:
    name: Update on Remote Host
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'main' }}
          fetch-depth: 0

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ env.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Update Ploinky
        if: ${{ inputs.update_ploinky == true }}
        env:
          PLOINKY_BRANCH: ${{ inputs.ploinky_branch || 'master' }}
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "${{ env.SSH_USER }}@${{ env.SSH_HOST }}" bash -s -- "$PLOINKY_BRANCH" << 'UPDATE_PLOINKY'
          set -euo pipefail
          PLOINKY_BRANCH="$1"
          PLOINKY_DIR="$HOME/ploinky"
          if [ ! -d "$PLOINKY_DIR/.git" ]; then
            echo "[update] Ploinky not found, skipping."
            exit 0
          fi
          cd "$PLOINKY_DIR"
          git stash 2>/dev/null || true
          git fetch origin
          git checkout "${PLOINKY_BRANCH:-master}"
          git pull origin "${PLOINKY_BRANCH:-master}"
          npm install
          echo "[update] Ploinky updated."
          UPDATE_PLOINKY

      - name: Update fileExplorer repository
        env:
          WORKSPACE: ${{ inputs.workspace_name || vars.EXPLORER_WORKSPACE || 'explorerWorkspace' }}
          EXPLORER_BRANCH: ${{ inputs.branch || 'main' }}
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "${{ env.SSH_USER }}@${{ env.SSH_HOST }}" bash -s -- "$WORKSPACE" "$EXPLORER_BRANCH" << 'UPDATE_REPO'
          set -euo pipefail
          WORKSPACE="$1"
          EXPLORER_BRANCH="$2"
          export PATH="$HOME/ploinky/bin:$HOME/.local/bin:$PATH"

          WORK_DIR="$HOME/$WORKSPACE"
          EXPLORER_REPO="$WORK_DIR/.ploinky/repos/fileExplorer"
          if [ ! -d "$EXPLORER_REPO/.git" ]; then
            echo "[update] fileExplorer repo not found at $EXPLORER_REPO"
            exit 1
          fi

          echo "[update] Updating fileExplorer repo to $EXPLORER_BRANCH..."
          cd "$EXPLORER_REPO"
          git stash 2>/dev/null || true
          git clean -fd 2>/dev/null || true
          git fetch origin
          git checkout "${EXPLORER_BRANCH:-main}"
          git reset --hard "origin/${EXPLORER_BRANCH:-main}"
          echo "[update] fileExplorer updated to $(git rev-parse --short HEAD)"
          UPDATE_REPO

      - name: Update gitTest repository
        env:
          WORKSPACE: ${{ inputs.workspace_name || vars.EXPLORER_WORKSPACE || 'explorerWorkspace' }}
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "${{ env.SSH_USER }}@${{ env.SSH_HOST }}" bash -s -- "$WORKSPACE" << 'UPDATE_GITTEST'
          set -euo pipefail
          WORKSPACE="$1"
          export PATH="$HOME/ploinky/bin:$HOME/.local/bin:$PATH"

          WORK_DIR="$HOME/$WORKSPACE"
          GITTEST_REPO="$WORK_DIR/.ploinky/repos/gitTest"
          if [ ! -d "$GITTEST_REPO/.git" ]; then
            echo "[update] gitTest repo not found, adding it..."
            cd "$WORK_DIR"
            ploinky add repo gitTest https://github.com/AssistosTest/gitTest.git main || true
          else
            echo "[update] Updating gitTest repo..."
            cd "$GITTEST_REPO"
            git fetch origin 2>/dev/null || true
            git pull origin main 2>/dev/null || git pull origin master 2>/dev/null || true
            echo "[update] gitTest updated to $(git rev-parse --short HEAD)"
          fi
          UPDATE_GITTEST

      - name: Update environment variables
        env:
          WORKSPACE: ${{ inputs.workspace_name || vars.EXPLORER_WORKSPACE || 'explorerWorkspace' }}
          ROUTER_PORT: ${{ inputs.router_port || vars.EXPLORER_ROUTER_PORT || '8097' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AXIOLOGIC_API_KEY: ${{ secrets.AXIOLOGIC_API_KEY }}
          OPENAI_OPENCODE_KEY: ${{ secrets.OPENAI_OPENCODE_KEY }}
          SOUL_GATEWAY_API_KEY: ${{ secrets.SOUL_GATEWAY_API_KEY }}
          OPENAI_AXIOLOGIC_KIRO_URL: ${{ vars.OPENAI_AXIOLOGIC_KIRO_URL }}
          OPENAI_AXIOLOGIC_KIRO_KEY_ENV: ${{ vars.OPENAI_AXIOLOGIC_KIRO_KEY_ENV }}
          ANTHROPIC_AXIOLOGIC_ANTIGRAVITY_URL: ${{ vars.ANTHROPIC_AXIOLOGIC_ANTIGRAVITY_URL }}
          ANTHROPIC_AXIOLOGIC_ANTIGRAVITY_KEY_ENV: ${{ vars.ANTHROPIC_AXIOLOGIC_ANTIGRAVITY_KEY_ENV }}
          OPENAI_OPENCODE_URL: ${{ vars.OPENAI_OPENCODE_URL }}
          OPENAI_OPENAI_RESPONSES_URL: ${{ vars.OPENAI_OPENAI_RESPONSES_URL }}
          OPENAI_OPENAI_RESPONSES_KEY_ENV: ${{ vars.OPENAI_OPENAI_RESPONSES_KEY_ENV }}
          LLM_MODELS: ${{ vars.LLM_MODELS }}
          ONLYOFFICE_PUBLIC_URL: ${{ vars.ONLYOFFICE_PUBLIC_URL }}
          ONLYOFFICE_INTERNAL_URL: ${{ vars.ONLYOFFICE_INTERNAL_URL }}
          ONLYOFFICE_CALLBACK_BASE_URL: ${{ vars.ONLYOFFICE_CALLBACK_BASE_URL }}
          ONLYOFFICE_JWT_SECRET: ${{ secrets.ONLYOFFICE_JWT_SECRET }}
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "${{ env.SSH_USER }}@${{ env.SSH_HOST }}" 'bash -s' << ENVVARS
          set -eo pipefail
          export PATH="\$HOME/ploinky/bin:\$HOME/.local/bin:\$PATH"

          WORK_DIR="\$HOME/${WORKSPACE}"
          cd "\$WORK_DIR"
          echo "[update] Updating environment variables..."

          set_var() {
            local name="\$1"
            local value="\$2"
            if [ -n "\$value" ]; then
              ploinky var "\$name" "\$value" 2>/dev/null || true
            fi
          }

          # Infrastructure variables (must match deploy-explorer.yml)
          ploinky var PLOINKY_CODE_WRITABLE "1" 2>/dev/null || true
          ploinky var PLOINKY_ROUTER_URL "http://host.containers.internal:${ROUTER_PORT}" 2>/dev/null || true
          ploinky var ASSISTOS_FS_ROOT "\$WORK_DIR" 2>/dev/null || true

          # OnlyOffice public/internal service routing
          # Write directly to .secrets because ploinky host hooks (preinstall)
          # only receive PLOINKY_* env vars — ONLYOFFICE_* vars set via
          # ploinky var are not visible during preinstall.
          set_var ONLYOFFICE_PUBLIC_URL "${ONLYOFFICE_PUBLIC_URL:-}"
          set_var ONLYOFFICE_INTERNAL_URL "${ONLYOFFICE_INTERNAL_URL:-}"
          set_var ONLYOFFICE_CALLBACK_BASE_URL "${ONLYOFFICE_CALLBACK_BASE_URL:-}"
          set_var ONLYOFFICE_JWT_SECRET "${ONLYOFFICE_JWT_SECRET:-}"

          # Write OnlyOffice vars to .secrets AND ~/.env (the preinstall
          # walks up from workspace root and ~/.env takes precedence).
          for TARGET_FILE in "\$WORK_DIR/.ploinky/.secrets" "\$HOME/.env"; do
            if [ -f "\$TARGET_FILE" ]; then
              sed -i '/^ONLYOFFICE_/d' "\$TARGET_FILE"
              echo "ONLYOFFICE_PUBLIC_URL=${ONLYOFFICE_PUBLIC_URL:-}" >> "\$TARGET_FILE"
              echo "ONLYOFFICE_INTERNAL_URL=${ONLYOFFICE_INTERNAL_URL:-}" >> "\$TARGET_FILE"
              echo "ONLYOFFICE_CALLBACK_BASE_URL=${ONLYOFFICE_CALLBACK_BASE_URL:-}" >> "\$TARGET_FILE"
              echo "ONLYOFFICE_JWT_SECRET=${ONLYOFFICE_JWT_SECRET:-}" >> "\$TARGET_FILE"
              echo "[update] OnlyOffice vars written to \$TARGET_FILE"
            fi
          done

          # API Keys
          set_var OPENAI_API_KEY "${OPENAI_API_KEY:-}"
          set_var OPENROUTER_API_KEY "${OPENROUTER_API_KEY:-}"
          set_var AXIOLOGIC_API_KEY "${AXIOLOGIC_API_KEY:-}"
          set_var OPENAI_OPENCODE_KEY "${OPENAI_OPENCODE_KEY:-}"
          set_var SOUL_GATEWAY_API_KEY "${SOUL_GATEWAY_API_KEY:-}"

          # LLM Provider endpoints
          set_var OPENAI_AXIOLOGIC_KIRO_URL "${OPENAI_AXIOLOGIC_KIRO_URL:-}"
          set_var OPENAI_AXIOLOGIC_KIRO_KEY_ENV "${OPENAI_AXIOLOGIC_KIRO_KEY_ENV:-}"
          set_var ANTHROPIC_AXIOLOGIC_ANTIGRAVITY_URL "${ANTHROPIC_AXIOLOGIC_ANTIGRAVITY_URL:-}"
          set_var ANTHROPIC_AXIOLOGIC_ANTIGRAVITY_KEY_ENV "${ANTHROPIC_AXIOLOGIC_ANTIGRAVITY_KEY_ENV:-}"
          set_var OPENAI_OPENCODE_URL "${OPENAI_OPENCODE_URL:-}"
          set_var OPENAI_OPENAI_RESPONSES_URL "${OPENAI_OPENAI_RESPONSES_URL:-}"
          set_var OPENAI_OPENAI_RESPONSES_KEY_ENV "${OPENAI_OPENAI_RESPONSES_KEY_ENV:-}"

          # LLM Model definitions (dynamically parsed from LLM_MODELS var)
          if [ -n "${LLM_MODELS:-}" ]; then
            IFS=';' read -ra MODEL_ENTRIES <<< "${LLM_MODELS}"
            for entry in "\${MODEL_ENTRIES[@]}"; do
              entry="\$(printf '%s' "\$entry" | xargs)"
              [ -z "\$entry" ] && continue
              model_key="\${entry%%=*}"
              model_val="\${entry#*=}"
              if [ -n "\$model_key" ] && [ -n "\$model_val" ]; then
                set_var "\$model_key" "\$model_val"
              fi
            done
          fi

          echo "[update] Environment variables updated."
          ENVVARS

      - name: Restart services
        if: ${{ inputs.restart_services == '' || inputs.restart_services == true }}
        env:
          WORKSPACE: ${{ inputs.workspace_name || vars.EXPLORER_WORKSPACE || 'explorerWorkspace' }}
          ROUTER_PORT: ${{ inputs.router_port || vars.EXPLORER_ROUTER_PORT || '8097' }}
        run: |
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -i ~/.ssh/deploy_key "${{ env.SSH_USER }}@${{ env.SSH_HOST }}" bash -s -- "$WORKSPACE" "$ROUTER_PORT" << 'RESTART'
          set -euo pipefail
          WORKSPACE="$1"
          ROUTER_PORT="$2"
          export PATH="$HOME/ploinky/bin:$HOME/.local/bin:$PATH"

          WORK_DIR="$HOME/$WORKSPACE"
          cd "$WORK_DIR"
          mkdir -p "$WORK_DIR/logs"
          mkdir -p "$WORK_DIR/.ploinky"
          echo "[update] Restarting explorer on router port $ROUTER_PORT..."
          echo "[debug] .secrets ONLYOFFICE entries BEFORE ploinky start:"
          grep ONLYOFFICE "$WORK_DIR/.ploinky/.secrets" || echo "(none)"

          LEGACY_AGENTS_FILE="$WORK_DIR/.ploinky/agents"
          AGENTS_REGISTRY_FILE="$WORK_DIR/.ploinky/agents.json"
          if [ -f "$LEGACY_AGENTS_FILE" ]; then
            if [ ! -e "$AGENTS_REGISTRY_FILE" ]; then
              echo "[update] Migrating legacy agent registry .ploinky/agents -> .ploinky/agents.json..."
              mv "$LEGACY_AGENTS_FILE" "$AGENTS_REGISTRY_FILE"
            else
              echo "[update] Removing conflicting legacy .ploinky/agents file..."
              rm -f "$LEGACY_AGENTS_FILE"
            fi
          fi
          mkdir -p "$WORK_DIR/.ploinky/agents" "$WORK_DIR/.ploinky/code" "$WORK_DIR/.ploinky/skills" "$WORK_DIR/.ploinky/logs" "$WORK_DIR/.ploinky/shared" "$WORK_DIR/.ploinky/running" "$WORK_DIR/.ploinky/transcripts"

          # Ensure routing.json has our port BEFORE ploinky stop, so
          # killRouterIfRunning() kills the correct router (not the
          # default port 8080 which belongs to the coral workspace).
          ROUTING_FILE="$WORK_DIR/.ploinky/routing.json"
          if [ -f "$ROUTING_FILE" ]; then
            python3 -c "import json; f=open('$ROUTING_FILE'); cfg=json.load(f); f.close(); cfg['port']=$ROUTER_PORT; f=open('$ROUTING_FILE','w'); json.dump(cfg,f,indent=2); f.close()" 2>/dev/null || true
          else
            echo "{\"port\":$ROUTER_PORT,\"routes\":{}}" > "$ROUTING_FILE"
          fi

          ploinky stop || true

          # Remove preinstall markers so hooks re-run with updated code/config
          rm -f "$WORK_DIR/.ploinky/running"/preinstall-* 2>/dev/null || true

          # Remove mcp-sdk markers and stopped containers so ploinky start
          # creates fresh containers with a full npm install.
          for AGENT_ROOT in "$WORK_DIR/.ploinky/agents" "$WORK_DIR/agents"; do
            [ -d "$AGENT_ROOT" ] || continue
            for AGENT_DIR in "$AGENT_ROOT"/*/; do
              [ -d "$AGENT_DIR" ] || continue
              MARKER="$AGENT_DIR/node_modules/mcp-sdk"
              if [ -d "$MARKER" ]; then
                echo "[update] Removing mcp-sdk marker for $(basename "$AGENT_DIR")..."
                rm -rf "$MARKER"
              fi
            done
          done
          # Remove stopped containers so ploinky start recreates them
          for cid in $(podman ps -a --filter "status=exited" --format '{{.Names}}' | grep "explorerWorkspace" || true); do
            echo "[update] Removing stopped container $cid..."
            podman rm "$cid" 2>/dev/null || true
          done

          nohup ploinky start explorer "$ROUTER_PORT" > "$WORK_DIR/logs/update-start.log" 2>&1 &

          echo "[update] Waiting for router to come up..."
          sleep 10
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:${ROUTER_PORT}/dashboard" || true)
            if [ "$code" = "200" ] || [ "$code" = "302" ]; then
              echo "[update] Router is responding (HTTP $code)"
              break
            fi
            if [ "$i" = "90" ]; then
              echo "[update] WARNING: router did not respond within 3 minutes"
              tail -50 "$WORK_DIR/logs/update-start.log" || true
              exit 1
            fi
            sleep 2
          done

          echo "[update] Containers:"
          podman ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" | head -80
          echo "[debug] .secrets ONLYOFFICE entries AFTER ploinky start:"
          grep ONLYOFFICE "$WORK_DIR/.ploinky/.secrets" || echo "(none)"
          echo "[update] Restart complete."
          RESTART

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
