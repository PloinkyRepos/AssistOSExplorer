name: Destroy Explorer (Remote Wipe)

on:
  workflow_dispatch:
    inputs:
      workspace_name:
        description: 'Workspace directory name to wipe on the remote host'
        required: false
        default: 'explorerWorkspace'
        type: string
      router_port:
        description: 'Router port this workspace owns (gates the conditional ploinky shutdown)'
        required: false
        default: '8097'
        type: string
      remove_workspace_dir:
        description: 'Also remove the entire workspace directory (rm -rf ~/workspace_name)'
        required: false
        default: true
        type: boolean

# Share the deploy concurrency group so a destroy and a deploy can never run
# against the skills Explorer workspace at the same time.
concurrency:
  group: deploy-skills-explorer
  cancel-in-progress: false

env:
  SSH_USER: ${{ vars.SSH_USER || 'admin' }}
  SSH_HOST: ${{ vars.SSH_HOST || '193.180.209.191' }}
  WORKSPACE: ${{ inputs.workspace_name || vars.EXPLORER_WORKSPACE || 'explorerWorkspace' }}
  ROUTER_PORT: ${{ inputs.router_port || vars.EXPLORER_ROUTER_PORT || '8097' }}

jobs:
  destroy:
    name: Destroy deployment on Remote Host
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Validate GitHub configuration
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          PLOINKY_MASTER_KEY: ${{ secrets.PLOINKY_MASTER_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_KEY:-}" ]; then
            echo "::error::Missing required repository secret SSH_KEY"
            exit 1
          fi
          if [ -z "${PLOINKY_MASTER_KEY:-}" ]; then
            echo "::error::Missing required repository secret PLOINKY_MASTER_KEY"
            exit 1
          fi
          if ! printf '%s' "$PLOINKY_MASTER_KEY" | grep -Eq '^[A-Fa-f0-9]{64}$'; then
            echo "::error::PLOINKY_MASTER_KEY must be exactly 64 hex characters"
            exit 1
          fi
          if [ -z "${SSH_HOST:-}" ] || [ -z "${SSH_USER:-}" ]; then
            echo "::error::SSH_USER and SSH_HOST must be configured"
            exit 1
          fi
          case "${WORKSPACE:-}" in
            ''|.|..|*[!A-Za-z0-9._-]*)
              echo "::error::Invalid workspace name '${WORKSPACE:-}' (allowed: A-Za-z0-9._-)"
              exit 1
              ;;
          esac
          case "${ROUTER_PORT:-}" in
            ''|*[!0-9]*)
              echo "::error::Invalid router port '${ROUTER_PORT:-}'"
              exit 1
              ;;
          esac

      - name: Prepare SSH key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ env.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Destroy Skills Explorer workspace
        env:
          PLOINKY_MASTER_KEY: ${{ secrets.PLOINKY_MASTER_KEY }}
          REMOVE_DIR: ${{ inputs.remove_workspace_dir }}
        run: |
          set -euo pipefail

          # Keep the master key off the command line and out of the process list:
          # ship it in a 0600 env file, source it remotely, then delete it.
          umask 077
          printf 'PLOINKY_MASTER_KEY=%q\n' "$PLOINKY_MASTER_KEY" > /tmp/skills_explorer_destroy_env
          chmod 600 /tmp/skills_explorer_destroy_env
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no /tmp/skills_explorer_destroy_env "${SSH_USER}@${SSH_HOST}:/tmp/skills_explorer_destroy_env"
          rm -f /tmp/skills_explorer_destroy_env

          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            -i ~/.ssh/deploy_key "${SSH_USER}@${SSH_HOST}" \
            "WORKSPACE='$WORKSPACE' ROUTER_PORT='$ROUTER_PORT' REMOVE_DIR='$REMOVE_DIR' bash -s" << 'DESTROY'
          set -euo pipefail
          # Always remove the plaintext env file, even on early exit.
          trap 'rm -f /tmp/skills_explorer_destroy_env' EXIT
          export PATH="$HOME/ploinky/bin:$HOME/.local/bin:$PATH"

          PLOINKY_MASTER_KEY=""
          if [ -f /tmp/skills_explorer_destroy_env ]; then
            set -a
            . /tmp/skills_explorer_destroy_env
            set +a
            rm -f /tmp/skills_explorer_destroy_env
          fi

          case "${WORKSPACE:-}" in
            ''|.|..|*[!A-Za-z0-9._-]*)
              echo "[destroy] ERROR: invalid workspace name '${WORKSPACE:-}'."
              exit 1
              ;;
          esac
          case "${ROUTER_PORT:-}" in
            ''|*[!0-9]*)
              echo "[destroy] ERROR: invalid router port '${ROUTER_PORT:-}'."
              exit 1
              ;;
          esac

          WORK_DIR="$HOME/$WORKSPACE"
          echo "[destroy] Workspace: $WORK_DIR (router port $ROUTER_PORT)"
          export PLOINKY_WORKSPACE_ROOT="$WORK_DIR"

          resolve_ploinky() {
            if [ -x "$HOME/ploinky/bin/ploinky" ]; then printf '%s\n' "$HOME/ploinky/bin/ploinky"; return 0; fi
            if [ -x "$HOME/.local/bin/ploinky" ]; then printf '%s\n' "$HOME/.local/bin/ploinky"; return 0; fi
            if command -v ploinky >/dev/null 2>&1; then command -v ploinky; return 0; fi
            return 1
          }
          PLOINKY="$(resolve_ploinky)" || PLOINKY=""

          # 'ploinky shutdown' targets the port in the cwd workspace's routing.json
          # and may fall back to a default when that file is absent. Gate strictly
          # on routing.json port == ROUTER_PORT before asking Ploinky to stop.
          read_routing_port() {
            node -e 'try{const p=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).port;process.stdout.write(p?String(p):"")}catch(e){process.stdout.write("")}' "$1" 2>/dev/null || true
          }
          SAFE_TO_SHUTDOWN=0
          if [ -f "$WORK_DIR/.ploinky/routing.json" ]; then
            WORKSPACE_ROUTING_PORT="$(read_routing_port "$WORK_DIR/.ploinky/routing.json")"
            if [ "$WORKSPACE_ROUTING_PORT" = "$ROUTER_PORT" ]; then
              SAFE_TO_SHUTDOWN=1
            elif [ -n "$WORKSPACE_ROUTING_PORT" ]; then
              echo "[destroy] ERROR: existing routing.json port ($WORKSPACE_ROUTING_PORT) != ROUTER_PORT ($ROUTER_PORT)."
              echo "[destroy] 'ploinky shutdown' would target a port this run does not own. Aborting."
              exit 1
            fi
          fi
          if [ -n "$PLOINKY" ] && [ -d "$WORK_DIR" ] && [ "$SAFE_TO_SHUTDOWN" = "1" ]; then
            echo "[destroy] Workspace owns :$ROUTER_PORT; shutting it down..."
            ( cd "$WORK_DIR" && env PLOINKY_WORKSPACE_ROOT="$WORK_DIR" PLOINKY_MASTER_KEY="$PLOINKY_MASTER_KEY" "$PLOINKY" shutdown ) 2>/dev/null || \
              ( cd "$WORK_DIR" && env PLOINKY_WORKSPACE_ROOT="$WORK_DIR" PLOINKY_MASTER_KEY="$PLOINKY_MASTER_KEY" "$PLOINKY" stop ) 2>/dev/null || true
          else
            echo "[destroy] Skipping 'ploinky shutdown' because this workspace does not provably own :$ROUTER_PORT."
          fi

          echo "[destroy] Removing remaining containers for workspace $WORKSPACE..."
          REMAINING=$(podman ps -a --format '{{.Names}}' | grep "_${WORKSPACE}_" || true)
          if [ -n "$REMAINING" ]; then
            printf '%s\n' "$REMAINING" | while IFS= read -r C; do
              [ -z "$C" ] && continue
              echo "[destroy]   stopping $C"
              podman stop "$C" 2>/dev/null || true
              podman rm -f "$C" 2>/dev/null || true
            done
          fi

          ONLYOFFICE_CONTAINER="ploinky_onlyoffice_${WORKSPACE}"
          if podman container exists "$ONLYOFFICE_CONTAINER" 2>/dev/null; then
            echo "[destroy]   stopping $ONLYOFFICE_CONTAINER"
            podman stop "$ONLYOFFICE_CONTAINER" 2>/dev/null || true
            podman rm -f "$ONLYOFFICE_CONTAINER" 2>/dev/null || true
          fi

          if [ -d "$WORK_DIR" ] && [ "$WORK_DIR" != "$HOME" ]; then
            echo "[destroy] Removing workspace contents..."
            podman unshare rm -rf \
              "$WORK_DIR/.ploinky" \
              "$WORK_DIR/agents" \
              "$WORK_DIR/code" \
              "$WORK_DIR/skills" \
              "$WORK_DIR/shared" \
              "$WORK_DIR/logs" \
              "$WORK_DIR/gitTest" \
              2>/dev/null || true
            rm -rf \
              "$WORK_DIR/.ploinky" \
              "$WORK_DIR/agents" \
              "$WORK_DIR/code" \
              "$WORK_DIR/skills" \
              "$WORK_DIR/shared" \
              "$WORK_DIR/logs" \
              "$WORK_DIR/gitTest" \
              2>/dev/null || true
          fi

          if [ "$REMOVE_DIR" = "true" ] && [ -d "$WORK_DIR" ] && [ "$WORK_DIR" != "$HOME" ]; then
            echo "[destroy] Removing workspace directory..."
            podman unshare rm -rf "$WORK_DIR" 2>/dev/null || true
            rm -rf "$WORK_DIR" 2>/dev/null || true
          fi

          echo "[destroy] Remaining containers for $WORKSPACE:"
          podman ps -a --format '{{.Names}}' | grep "_${WORKSPACE}_" || echo "[destroy] none"
          echo "[destroy] Done."
          DESTROY

      - name: Create summary
        if: always()
        run: |
          {
            echo "## Skills Explorer Destroy"
            echo ""
            echo "- Host: \`${SSH_USER}@${SSH_HOST}\`"
            echo "- Workspace: \`${WORKSPACE}\`"
            echo "- Router port: \`${ROUTER_PORT}\`"
            echo "- Remove workspace dir: \`${{ inputs.remove_workspace_dir }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key /tmp/skills_explorer_destroy_env
