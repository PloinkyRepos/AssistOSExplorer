name: Remote Skills Status

on:
  workflow_dispatch:
    inputs:
      workspace_name:
        description: 'Workspace directory name on the remote host'
        required: false
        default: 'explorerWorkspace'
        type: string
      router_port:
        description: 'Router port on the remote host'
        required: false
        default: '8097'
        type: string
      public_url:
        description: 'Public Explorer URL'
        required: false
        default: 'https://skills.axiologic.dev'
        type: string

env:
  SSH_USER: ${{ vars.SSH_USER || 'admin' }}
  SSH_HOST: ${{ vars.SSH_HOST || '193.180.209.191' }}
  WORKSPACE: ${{ inputs.workspace_name || vars.EXPLORER_WORKSPACE || 'explorerWorkspace' }}
  ROUTER_PORT: ${{ inputs.router_port || vars.EXPLORER_ROUTER_PORT || '8097' }}
  PUBLIC_URL: ${{ inputs.public_url || vars.EXPLORER_PUBLIC_URL || 'https://skills.axiologic.dev' }}

jobs:
  status:
    name: Inspect Remote Skills Host
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Validate GitHub configuration
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_KEY:-}" ]; then
            echo "::error::Missing required repository secret SSH_KEY"
            exit 1
          fi
          if [ -z "${SSH_HOST:-}" ] || [ -z "${SSH_USER:-}" ]; then
            echo "::error::SSH_USER and SSH_HOST must be configured"
            exit 1
          fi

      - name: Prepare SSH key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ env.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Inspect remote host
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            -i ~/.ssh/deploy_key "${SSH_USER}@${SSH_HOST}" \
            "WORKSPACE='$WORKSPACE' ROUTER_PORT='$ROUTER_PORT' PUBLIC_URL='$PUBLIC_URL' bash -s" << 'REMOTE'
          set -euo pipefail
          export PATH="$HOME/ploinky/bin:$HOME/.local/bin:$PATH"

          section() {
            printf '\n===== %s =====\n' "$1"
          }

          check_repo() {
            local label="$1"
            local dir="$2"
            local branch="${3:-master}"
            section "$label"
            if [ ! -d "$dir/.git" ]; then
              echo "missing: $dir"
              return
            fi
            git -C "$dir" fetch origin "$branch" --quiet || true
            echo "path: $dir"
            echo "branch: $(git -C "$dir" branch --show-current 2>/dev/null || true)"
            echo "head: $(git -C "$dir" rev-parse --short HEAD 2>/dev/null || true) $(git -C "$dir" log -1 --pretty=%s 2>/dev/null || true)"
            echo "origin/$branch: $(git -C "$dir" rev-parse --short "origin/$branch" 2>/dev/null || true)"
            git -C "$dir" status --short --branch || true
          }

          section "Host"
          hostname || true
          date -Is || true
          uname -a || true
          id || true

          section "Tooling"
          command -v node >/dev/null 2>&1 && node --version || echo "node missing"
          command -v npm >/dev/null 2>&1 && npm --version || echo "npm missing"
          command -v podman >/dev/null 2>&1 && podman --version || echo "podman missing"
          command -v ploinky >/dev/null 2>&1 && ploinky --version || echo "ploinky missing"

          check_repo "Ploinky" "$HOME/ploinky" master

          section "AchillesAgentLib"
          if [ -d "$HOME/ploinky/node_modules/achillesAgentLib" ]; then
            npm --prefix "$HOME/ploinky" ls achillesAgentLib --depth=0 || true
            if [ -d "$HOME/ploinky/node_modules/achillesAgentLib/.git" ]; then
              git -C "$HOME/ploinky/node_modules/achillesAgentLib" fetch origin --quiet || true
              echo "head: $(git -C "$HOME/ploinky/node_modules/achillesAgentLib" rev-parse --short HEAD 2>/dev/null || true)"
              echo "status: $(git -C "$HOME/ploinky/node_modules/achillesAgentLib" status --short --branch 2>/dev/null || true)"
            fi
          else
            echo "achillesAgentLib is not installed under ~/ploinky/node_modules"
          fi

          WORK_DIR="$HOME/$WORKSPACE"
          check_repo "fileExplorer workspace repo" "$WORK_DIR/.ploinky/repos/fileExplorer" main
          check_repo "webmeetInfra workspace repo" "$WORK_DIR/.ploinky/repos/webmeetInfra" main

          section "Enabled repos"
          [ -f "$WORK_DIR/.ploinky/enabled_repos.json" ] && cat "$WORK_DIR/.ploinky/enabled_repos.json" || true

          section "Ploinky status"
          if [ -f "$WORK_DIR/.env" ]; then
            set -a
            . "$WORK_DIR/.env"
            set +a
          fi
          (cd "$WORK_DIR" && ploinky status) || true

          section "Containers"
          podman ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' || true

          section "Listening ports"
          ss -ltnp 2>/dev/null | grep -E "(:80|:443|:${ROUTER_PORT}|:5432|:6379|:17880|:17980)" || true

          section "Explorer start log"
          tail -160 "$WORK_DIR/logs/skills-explorer-start.log" 2>/dev/null || true

          section "Local HTTP checks"
          curl -sS -I "http://127.0.0.1:${ROUTER_PORT}/dashboard" || true
          domain="$(node -e "console.log(new URL(process.argv[1]).hostname)" "$PUBLIC_URL")"
          curl -k -sS -I --resolve "${domain}:443:127.0.0.1" "https://${domain}/dashboard" || true
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
