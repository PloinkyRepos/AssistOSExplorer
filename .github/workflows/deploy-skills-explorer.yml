name: Deploy Skills Explorer

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'AssistOSExplorer branch to deploy'
        required: false
        default: 'main'
        type: string
      workspace_name:
        description: 'Workspace directory name on the remote host'
        required: false
        default: 'explorerWorkspace'
        type: string
      router_port:
        description: 'Router port on the remote host'
        required: false
        default: '8097'
        type: string
      public_url:
        description: 'Public Explorer URL'
        required: false
        default: 'https://skills.axiologic.dev'
        type: string
      profile:
        description: 'Ploinky profile to use. Defaults to vars.PLOINKY_PROFILE, then prod.'
        required: false
        default: ''
        type: string
      proxies_branch:
        description: 'proxies repo branch. Falls back to vars.PROXIES_BRANCH, then main.'
        required: false
        default: ''
        type: string
      ploinky_branch:
        description: 'Ploinky runtime branch. Falls back to vars.PLOINKY_BRANCH, then main.'
        required: false
        default: ''
        type: string
      achilles_branch:
        description: 'achillesAgentLib branch. Falls back to vars.ACHILLES_BRANCH, then main.'
        required: false
        default: ''
        type: string
      webmeet_infra_image_tag:
        description: 'liveKitServerAgent image tag override. Falls back to vars.WEBMEET_INFRA_IMAGE_TAG, then webmeet-infra.'
        required: false
        default: ''
        type: string

concurrency:
  group: deploy-skills-explorer
  cancel-in-progress: false

env:
  SSH_USER: ${{ vars.SSH_USER || 'admin' }}
  SSH_HOST: ${{ vars.SSH_HOST || '193.180.209.191' }}
  WORKSPACE: ${{ inputs.workspace_name || vars.EXPLORER_WORKSPACE || 'explorerWorkspace' }}
  ROUTER_PORT: ${{ inputs.router_port || vars.EXPLORER_ROUTER_PORT || '8097' }}
  PUBLIC_URL: ${{ inputs.public_url || vars.EXPLORER_PUBLIC_URL || 'https://skills.axiologic.dev' }}
  EXPLORER_BRANCH: ${{ inputs.branch || 'main' }}
  PLOINKY_PROFILE: ${{ inputs.profile || vars.PLOINKY_PROFILE || 'prod' }}

jobs:
  deploy:
    name: Deploy or Update Explorer
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Validate GitHub configuration
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          PLOINKY_MASTER_KEY: ${{ secrets.PLOINKY_MASTER_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_KEY:-}" ]; then
            echo "::error::Missing required repository secret SSH_KEY"
            exit 1
          fi
          if [ -z "${PLOINKY_MASTER_KEY:-}" ]; then
            echo "::error::Missing required repository secret PLOINKY_MASTER_KEY"
            exit 1
          fi
          if ! printf '%s' "$PLOINKY_MASTER_KEY" | grep -Eq '^[A-Fa-f0-9]{64}$'; then
            echo "::error::PLOINKY_MASTER_KEY must be exactly 64 hex characters"
            exit 1
          fi
          if [ -z "${SSH_HOST:-}" ] || [ -z "${SSH_USER:-}" ]; then
            echo "::error::SSH_USER and SSH_HOST must be configured"
            exit 1
          fi

      - name: Prepare SSH key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ env.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy workspace
        env:
          PLOINKY_MASTER_KEY: ${{ secrets.PLOINKY_MASTER_KEY }}
          SOUL_GATEWAY_API_KEY: ${{ secrets.SOUL_GATEWAY_API_KEY }}
          SOUL_GATEWAY_BASE_URL: ${{ vars.SOUL_GATEWAY_BASE_URL }}
          ONLYOFFICE_PUBLIC_URL: ${{ vars.ONLYOFFICE_PUBLIC_URL }}
          ONLYOFFICE_INTERNAL_URL: ${{ vars.ONLYOFFICE_INTERNAL_URL }}
          ONLYOFFICE_CALLBACK_BASE_URL: ${{ vars.ONLYOFFICE_CALLBACK_BASE_URL }}
          WEBMEET_PUBLIC_LIVEKIT_URL: ${{ vars.WEBMEET_PUBLIC_LIVEKIT_URL }}
          WEBMEET_LIVEKIT_URL: ${{ vars.WEBMEET_LIVEKIT_URL }}
          WEBMEET_EGRESS_URL: ${{ vars.WEBMEET_EGRESS_URL }}
          WEBMEET_INFRA_IMAGE_TAG: ${{ inputs.webmeet_infra_image_tag || vars.WEBMEET_INFRA_IMAGE_TAG || 'webmeet-infra' }}
          WEBMEET_INFRA_HEALTH_PORT: ${{ vars.WEBMEET_INFRA_HEALTH_PORT }}
          WEBMEET_LIVEKIT_USE_EXTERNAL_IP: ${{ vars.WEBMEET_LIVEKIT_USE_EXTERNAL_IP }}
          WEBMEET_LIVEKIT_NODE_IP: ${{ vars.WEBMEET_LIVEKIT_NODE_IP }}
          WEBMEET_LIVEKIT_LOG_LEVEL: ${{ vars.WEBMEET_LIVEKIT_LOG_LEVEL }}
          WEBMEET_LIVEKIT_FORCE_TCP: ${{ vars.WEBMEET_LIVEKIT_FORCE_TCP }}
          WEBMEET_LIVEKIT_REDIS_ADDRESS: ${{ vars.WEBMEET_LIVEKIT_REDIS_ADDRESS }}
          WEBMEET_EGRESS_REDIS_ADDRESS: ${{ vars.WEBMEET_EGRESS_REDIS_ADDRESS }}
          WEBMEET_LIVEKIT_INTERNAL_WS_URL: ${{ vars.WEBMEET_LIVEKIT_INTERNAL_WS_URL }}
          WEBMEET_TLS_HOSTNAME: ${{ vars.WEBMEET_TLS_HOSTNAME }}
          WEBMEET_TLS_HTTPS_PORT: ${{ vars.WEBMEET_TLS_HTTPS_PORT }}
          WEBMEET_TLS_HTTP_PORT: ${{ vars.WEBMEET_TLS_HTTP_PORT }}
          WEBMEET_LIVEKIT_UPSTREAM: ${{ vars.WEBMEET_LIVEKIT_UPSTREAM }}
          WEBMEET_CERT_EMAIL: ${{ vars.WEBMEET_CERT_EMAIL }}
          WEBMEET_CERTBOT_AUTO_ISSUE: ${{ vars.WEBMEET_CERTBOT_AUTO_ISSUE }}
          WEBMEET_CERTBOT_RENEW_INTERVAL_SECONDS: ${{ vars.WEBMEET_CERTBOT_RENEW_INTERVAL_SECONDS }}
          WEBMEET_TURN_EXTERNAL_IP: ${{ vars.WEBMEET_TURN_EXTERNAL_IP }}
          WEBMEET_TURN_HOST: ${{ vars.WEBMEET_TURN_HOST }}
          WEBMEET_TURN_PORT: ${{ vars.WEBMEET_TURN_PORT }}
          WEBMEET_TURN_REALM: ${{ vars.WEBMEET_TURN_REALM }}
          WEBMEET_TURN_USER: ${{ vars.WEBMEET_TURN_USER }}
          WEBMEET_ICE_TRANSPORT_POLICY: ${{ vars.WEBMEET_ICE_TRANSPORT_POLICY }}
          WEBMEET_TURN_MIN_PORT: ${{ vars.WEBMEET_TURN_MIN_PORT }}
          WEBMEET_TURN_MAX_PORT: ${{ vars.WEBMEET_TURN_MAX_PORT }}
        run: |
          set -euo pipefail

          write_env() {
            local name="$1"
            local value="${!name:-}"
            if [ "$name" != "PLOINKY_MASTER_KEY" ] && [ -z "$value" ]; then
              return 0
            fi
            printf '%s=' "$name"
            printf '%q\n' "$value"
          }

          {
            write_env PLOINKY_MASTER_KEY
            write_env SOUL_GATEWAY_API_KEY
            write_env SOUL_GATEWAY_BASE_URL
            write_env ONLYOFFICE_PUBLIC_URL
            write_env ONLYOFFICE_INTERNAL_URL
            write_env ONLYOFFICE_CALLBACK_BASE_URL
            write_env WEBMEET_PUBLIC_LIVEKIT_URL
            write_env WEBMEET_LIVEKIT_URL
            write_env WEBMEET_EGRESS_URL
            write_env WEBMEET_INFRA_IMAGE_TAG
            write_env WEBMEET_INFRA_HEALTH_PORT
            write_env WEBMEET_LIVEKIT_USE_EXTERNAL_IP
            write_env WEBMEET_LIVEKIT_NODE_IP
            write_env WEBMEET_LIVEKIT_LOG_LEVEL
            write_env WEBMEET_LIVEKIT_FORCE_TCP
            write_env WEBMEET_LIVEKIT_REDIS_ADDRESS
            write_env WEBMEET_EGRESS_REDIS_ADDRESS
            write_env WEBMEET_LIVEKIT_INTERNAL_WS_URL
            write_env WEBMEET_TLS_HOSTNAME
            write_env WEBMEET_TLS_HTTPS_PORT
            write_env WEBMEET_TLS_HTTP_PORT
            write_env WEBMEET_LIVEKIT_UPSTREAM
            write_env WEBMEET_CERT_EMAIL
            write_env WEBMEET_CERTBOT_AUTO_ISSUE
            write_env WEBMEET_CERTBOT_RENEW_INTERVAL_SECONDS
            write_env WEBMEET_TURN_EXTERNAL_IP
            write_env WEBMEET_TURN_HOST
            write_env WEBMEET_TURN_PORT
            write_env WEBMEET_TURN_REALM
            write_env WEBMEET_TURN_USER
            write_env WEBMEET_ICE_TRANSPORT_POLICY
            write_env WEBMEET_TURN_MIN_PORT
            write_env WEBMEET_TURN_MAX_PORT
          } > /tmp/skills_explorer_env
          chmod 600 /tmp/skills_explorer_env

          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no /tmp/skills_explorer_env "${SSH_USER}@${SSH_HOST}:/tmp/skills_explorer_env"

          PROXIES_BRANCH="${{ inputs.proxies_branch || vars.PROXIES_BRANCH || 'main' }}"
          PLOINKY_BRANCH="${{ inputs.ploinky_branch || vars.PLOINKY_BRANCH || 'main' }}"
          ACHILLES_BRANCH="${{ inputs.achilles_branch || vars.ACHILLES_BRANCH || 'main' }}"

          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            -i ~/.ssh/deploy_key "${SSH_USER}@${SSH_HOST}" \
            "WORKSPACE='$WORKSPACE' EXPLORER_BRANCH='$EXPLORER_BRANCH' PROXIES_BRANCH='$PROXIES_BRANCH' PLOINKY_BRANCH='$PLOINKY_BRANCH' ACHILLES_BRANCH='$ACHILLES_BRANCH' ROUTER_PORT='$ROUTER_PORT' PUBLIC_URL='$PUBLIC_URL' PLOINKY_PROFILE='$PLOINKY_PROFILE' bash -s" << 'REMOTE'
          set -euo pipefail
          # Ensure the plaintext env file is removed even if a later step exits non-zero.
          trap 'rm -f /tmp/skills_explorer_env' EXIT

          resolve_ploinky() {
            if [ -x "$HOME/ploinky/bin/ploinky" ]; then
              printf '%s\n' "$HOME/ploinky/bin/ploinky"
              return 0
            fi
            if [ -x "$HOME/.local/bin/ploinky" ]; then
              printf '%s\n' "$HOME/.local/bin/ploinky"
              return 0
            fi
            if command -v ploinky >/dev/null 2>&1; then
              command -v ploinky
              return 0
            fi
            return 1
          }

          PLOINKY="$(resolve_ploinky)" || {
            echo "[deploy] ERROR: ploinky is not installed on the remote host."
            echo "[deploy] Run the Provision Skills Explorer Host workflow first."
            exit 1
          }

          for tool in git node npm podman curl; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "[deploy] ERROR: missing required tool '$tool'."
              echo "[deploy] Run the Provision Skills Explorer Host workflow first."
              exit 1
            fi
          done

          WORK_DIR="$HOME/$WORKSPACE"
          mkdir -p "$WORK_DIR/logs"
          cd "$WORK_DIR"

          set -a
          . /tmp/skills_explorer_env
          set +a
          rm -f /tmp/skills_explorer_env

          WEBMEET_INFRA_IMAGE_TAG="${WEBMEET_INFRA_IMAGE_TAG:-webmeet-infra}"
          WEBMEET_INFRA_HEALTH_PORT="${WEBMEET_INFRA_HEALTH_PORT:-17000}"
          if [ "${WEBMEET_EGRESS_URL:-}" = "http://webmeetLivekitEgress:7980" ]; then
            echo "[deploy] Ignoring retired split-agent WEBMEET_EGRESS_URL override."
            WEBMEET_EGRESS_URL=""
          fi
          if [ "${PLOINKY_PROFILE:-prod}" = "prod" ]; then
            WEBMEET_EGRESS_URL="${WEBMEET_EGRESS_URL:-http://host.containers.internal:7980}"
          fi

          echo "[deploy] Removing current workspace containers if present..."
          env PLOINKY_MASTER_KEY="$PLOINKY_MASTER_KEY" "$PLOINKY" shutdown || \
            env PLOINKY_MASTER_KEY="$PLOINKY_MASTER_KEY" "$PLOINKY" stop || true

          echo "[deploy] Ensuring Ploinky runtime is on requested branch..."
          resolve_realpath() {
            if command -v realpath >/dev/null 2>&1; then
              realpath "$1"
            else
              readlink -f "$1"
            fi
          }

          checkout_runtime_branch() {
            local repo_dir="$1"
            local branch="$2"
            local label="$3"
            git -C "$repo_dir" check-ref-format --branch "$branch" >/dev/null
            git -C "$repo_dir" fetch origin
            if git -C "$repo_dir" show-ref --verify --quiet "refs/heads/$branch"; then
              git -C "$repo_dir" checkout "$branch"
            else
              git -C "$repo_dir" checkout -b "$branch" "origin/$branch"
            fi
            git -C "$repo_dir" reset --hard "origin/$branch"
            echo "[deploy] $label at $(git -C "$repo_dir" rev-parse --short HEAD) ($branch)"
          }

          PLOINKY_BRANCH="${PLOINKY_BRANCH:-main}"
          PLOINKY_BIN="$(resolve_realpath "$PLOINKY")"
          PLOINKY_DIR="$(cd "$(dirname "$PLOINKY_BIN")/.." && pwd -P)"
          if [ ! -d "$PLOINKY_DIR/.git" ] && [ -d "$HOME/ploinky/.git" ]; then
            PLOINKY_DIR="$HOME/ploinky"
            PLOINKY="$PLOINKY_DIR/bin/ploinky"
          fi
          if [ -d "$PLOINKY_DIR/.git" ]; then
            checkout_runtime_branch "$PLOINKY_DIR" "$PLOINKY_BRANCH" "Ploinky runtime"
          elif [ "$PLOINKY_BRANCH" != "main" ]; then
            echo "[deploy] ERROR: cannot checkout Ploinky branch '$PLOINKY_BRANCH'; '$PLOINKY_DIR' is not a git checkout."
            exit 1
          fi

          ACHILLES_BRANCH="${ACHILLES_BRANCH:-main}"
          ACHILLES_DIR="$PLOINKY_DIR/node_modules/achillesAgentLib"
          if [ -d "$ACHILLES_DIR/.git" ]; then
            checkout_runtime_branch "$ACHILLES_DIR" "$ACHILLES_BRANCH" "achillesAgentLib"
          elif [ "$ACHILLES_BRANCH" != "main" ]; then
            echo "[deploy] ERROR: cannot checkout achillesAgentLib branch '$ACHILLES_BRANCH'; '$ACHILLES_DIR' is not a git checkout."
            exit 1
          fi

          echo "[deploy] Ensuring Ploinky repos are installed and enabled..."
          "$PLOINKY" add repo AchillesIDE https://github.com/PloinkyRepos/AssistOSExplorer.git "${EXPLORER_BRANCH:-main}" || true
          "$PLOINKY" add repo webmeetInfra https://github.com/PloinkyRepos/webmeetInfra.git main || true
          "$PLOINKY" add repo proxies https://github.com/PloinkyRepos/proxies.git "${PROXIES_BRANCH:-main}" || true
          "$PLOINKY" enable repo AchillesIDE
          "$PLOINKY" enable repo webmeetInfra
          "$PLOINKY" enable repo proxies

          echo "[deploy] Updating Ploinky, Achilles dependencies, and installed repos..."
          if ! env PLOINKY_MASTER_KEY="$PLOINKY_MASTER_KEY" "$PLOINKY" update; then
            echo "[deploy] Initial update failed; retrying once in case Ploinky self-updated during this run..."
            env PLOINKY_MASTER_KEY="$PLOINKY_MASTER_KEY" "$PLOINKY" update
          fi

          for repo_spec in "AchillesIDE:${EXPLORER_BRANCH:-main}" "webmeetInfra:main" "proxies:${PROXIES_BRANCH:-main}"; do
            repo_name="${repo_spec%%:*}"
            repo_branch="${repo_spec#*:}"
            repo_dir="$WORK_DIR/.ploinky/repos/$repo_name"
            if [ -d "$repo_dir/.git" ]; then
              git -C "$repo_dir" fetch origin
              git -C "$repo_dir" checkout "$repo_branch"
              git -C "$repo_dir" reset --hard "origin/$repo_branch"
              git -C "$repo_dir" clean -fd
              echo "[deploy] $repo_name at $(git -C "$repo_dir" rev-parse --short HEAD)"
            fi
          done

          cleanup_retired_webmeet_infra() {
            local retired_agents=(
              stack
              webmeetCoturn
              webmeetRedis
              webmeetLivekitServer
              webmeetLivekitEgress
              webmeetLivekitNginx
              webmeetLivekitCertbot
            )

            echo "[deploy] Removing retired split WebMeet infra agent registrations..."
            for agent in "${retired_agents[@]}"; do
              env PLOINKY_MASTER_KEY="$PLOINKY_MASTER_KEY" "$PLOINKY" disable agent "webmeetInfra/$agent" || true
              env PLOINKY_MASTER_KEY="$PLOINKY_MASTER_KEY" "$PLOINKY" disable agent "$agent" || true
            done

            node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const retired = new Set([
            'stack',
            'webmeetCoturn',
            'webmeetRedis',
            'webmeetLivekitServer',
            'webmeetLivekitEgress',
            'webmeetLivekitNginx',
            'webmeetLivekitCertbot',
          ]);
          const root = process.cwd();

          function splitRef(value) {
            const text = String(value || '');
            const parts = text.split('/');
            return {
              repo: parts.length > 1 ? parts[0] : '',
              agent: parts[parts.length - 1] || text,
            };
          }

          function readJson(filePath) {
            try {
              return JSON.parse(fs.readFileSync(filePath, 'utf8'));
            } catch (_) {
              return null;
            }
          }

          function writeJson(filePath, value) {
            fs.writeFileSync(filePath, `${JSON.stringify(value, null, 2)}\n`);
          }

          const agentsPath = path.join(root, '.ploinky', 'agents.json');
          const agents = readJson(agentsPath);
          let agentsChanged = false;
          if (agents && typeof agents === 'object') {
            for (const [key, record] of Object.entries(agents)) {
              if (key === '_config' || !record || typeof record !== 'object') continue;
              const keyRef = splitRef(key);
              const repo = String(record.repoName || keyRef.repo);
              const agent = String(record.agentName || keyRef.agent);
              if (repo === 'webmeetInfra' && retired.has(agent)) {
                delete agents[key];
                agentsChanged = true;
              }
            }
            if (agentsChanged) {
              writeJson(agentsPath, agents);
            }
          }

          const routingPath = path.join(root, '.ploinky', 'routing.json');
          const routing = readJson(routingPath);
          let routingChanged = false;
          if (routing && routing.routes && typeof routing.routes === 'object') {
            for (const [key, route] of Object.entries(routing.routes)) {
              const keyRef = splitRef(key);
              const routeRef = splitRef(route && route.agent);
              const agent = String(routeRef.agent || keyRef.agent);
              const repo = String(route && route.repo || routeRef.repo || keyRef.repo);
              if (retired.has(agent) && (!repo || repo === 'webmeetInfra')) {
                delete routing.routes[key];
                routingChanged = true;
              }
            }
            if (routingChanged) {
              writeJson(routingPath, routing);
            }
          }

          console.log(`[deploy] Retired registry cleanup: agents=${agentsChanged ? 'updated' : 'unchanged'} routes=${routingChanged ? 'updated' : 'unchanged'}`);
          NODE

            local retired_pattern="^ploinky_webmeetInfra_(stack|webmeetCoturn|webmeetRedis|webmeetLivekitServer|webmeetLivekitEgress|webmeetLivekitNginx|webmeetLivekitCertbot)_${WORKSPACE}_"
            podman ps -a --format '{{.Names}}' | grep -E "$retired_pattern" | while read -r container_name; do
              [ -n "$container_name" ] || continue
              echo "[deploy] Removing retired container $container_name"
              podman rm -f "$container_name" || true
            done || true
          }

          cleanup_retired_webmeet_infra

          "$PLOINKY" profile "${PLOINKY_PROFILE:-prod}"
          "$PLOINKY" sandbox disable

          set_var() {
            local name="$1"
            local value="$2"
            if [ -n "$value" ]; then
              env PLOINKY_MASTER_KEY="$PLOINKY_MASTER_KEY" "$PLOINKY" var "$name" "$value"
              echo "[deploy] Set $name"
            fi
          }

          set_var PLOINKY_CODE_WRITABLE "1"
          set_var ASSISTOS_FS_ROOT "$WORK_DIR"
          set_var WORKSPACE_ROOT "$WORK_DIR"
          set_var PLOINKY_WORKSPACE_ROOT "$WORK_DIR"

          set_var SOUL_GATEWAY_API_KEY "${SOUL_GATEWAY_API_KEY:-}"
          set_var SOUL_GATEWAY_BASE_URL "${SOUL_GATEWAY_BASE_URL:-}"

          set_var ONLYOFFICE_PUBLIC_URL "${ONLYOFFICE_PUBLIC_URL:-}"
          set_var ONLYOFFICE_INTERNAL_URL "${ONLYOFFICE_INTERNAL_URL:-}"
          set_var ONLYOFFICE_CALLBACK_BASE_URL "${ONLYOFFICE_CALLBACK_BASE_URL:-$PUBLIC_URL}"

          set_var WEBMEET_PUBLIC_LIVEKIT_URL "${WEBMEET_PUBLIC_LIVEKIT_URL:-}"
          set_var WEBMEET_LIVEKIT_URL "${WEBMEET_LIVEKIT_URL:-}"
          set_var WEBMEET_EGRESS_URL "${WEBMEET_EGRESS_URL:-}"
          set_var WEBMEET_INFRA_IMAGE_TAG "${WEBMEET_INFRA_IMAGE_TAG:-webmeet-infra}"
          set_var WEBMEET_INFRA_HEALTH_PORT "${WEBMEET_INFRA_HEALTH_PORT:-17000}"
          set_var WEBMEET_LIVEKIT_USE_EXTERNAL_IP "${WEBMEET_LIVEKIT_USE_EXTERNAL_IP:-}"
          set_var WEBMEET_LIVEKIT_NODE_IP "${WEBMEET_LIVEKIT_NODE_IP:-}"
          set_var WEBMEET_LIVEKIT_LOG_LEVEL "${WEBMEET_LIVEKIT_LOG_LEVEL:-}"
          set_var WEBMEET_LIVEKIT_FORCE_TCP "${WEBMEET_LIVEKIT_FORCE_TCP:-}"
          set_var WEBMEET_LIVEKIT_REDIS_ADDRESS "${WEBMEET_LIVEKIT_REDIS_ADDRESS:-}"
          set_var WEBMEET_EGRESS_REDIS_ADDRESS "${WEBMEET_EGRESS_REDIS_ADDRESS:-}"
          set_var WEBMEET_LIVEKIT_INTERNAL_WS_URL "${WEBMEET_LIVEKIT_INTERNAL_WS_URL:-}"
          set_var WEBMEET_TLS_HOSTNAME "${WEBMEET_TLS_HOSTNAME:-}"
          set_var WEBMEET_TLS_HTTPS_PORT "${WEBMEET_TLS_HTTPS_PORT:-}"
          set_var WEBMEET_TLS_HTTP_PORT "${WEBMEET_TLS_HTTP_PORT:-}"
          set_var WEBMEET_LIVEKIT_UPSTREAM "${WEBMEET_LIVEKIT_UPSTREAM:-}"
          set_var WEBMEET_CERT_EMAIL "${WEBMEET_CERT_EMAIL:-}"
          set_var WEBMEET_CERTBOT_AUTO_ISSUE "${WEBMEET_CERTBOT_AUTO_ISSUE:-}"
          set_var WEBMEET_CERTBOT_RENEW_INTERVAL_SECONDS "${WEBMEET_CERTBOT_RENEW_INTERVAL_SECONDS:-}"
          set_var WEBMEET_TURN_EXTERNAL_IP "${WEBMEET_TURN_EXTERNAL_IP:-}"
          set_var WEBMEET_TURN_HOST "${WEBMEET_TURN_HOST:-}"
          set_var WEBMEET_TURN_PORT "${WEBMEET_TURN_PORT:-}"
          set_var WEBMEET_TURN_REALM "${WEBMEET_TURN_REALM:-}"
          set_var WEBMEET_TURN_USER "${WEBMEET_TURN_USER:-}"
          set_var WEBMEET_ICE_TRANSPORT_POLICY "${WEBMEET_ICE_TRANSPORT_POLICY:-all}"
          set_var WEBMEET_TURN_MIN_PORT "${WEBMEET_TURN_MIN_PORT:-}"
          set_var WEBMEET_TURN_MAX_PORT "${WEBMEET_TURN_MAX_PORT:-}"

          echo "[deploy] Pulling liveKitServerAgent image docker.io/assistos/livekit-server-agent:${WEBMEET_INFRA_IMAGE_TAG}..."
          podman pull "docker.io/assistos/livekit-server-agent:${WEBMEET_INFRA_IMAGE_TAG}"

          echo "[deploy] Starting Explorer..."
          nohup env PLOINKY_MASTER_KEY="$PLOINKY_MASTER_KEY" "$PLOINKY" start AchillesIDE/explorer "$ROUTER_PORT" \
            --branch "${EXPLORER_BRANCH:-main}" \
            --repo-branch "proxies=${PROXIES_BRANCH:-main}" \
            --repo-branch "webmeetInfra=main" \
            --branch-fallback fail \
            --reset-repos \
            > "$WORK_DIR/logs/skills-explorer-start.log" 2>&1 &

          echo "[deploy] Waiting for local router..."
          sleep 10
          for i in $(seq 1 390); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${ROUTER_PORT}/dashboard" || true)"
            if [ "$code" = "200" ] || [ "$code" = "302" ]; then
              echo "[deploy] Local router responding with HTTP $code"
              break
            fi
            if [ "$i" = "390" ]; then
              echo "[deploy] ERROR: local router did not respond in time"
              tail -120 "$WORK_DIR/logs/skills-explorer-start.log" || true
              exit 1
            fi
            sleep 2
          done

          echo "[deploy] Verifying liveKitServerAgent health on 127.0.0.1:${WEBMEET_INFRA_HEALTH_PORT}..."
          for i in $(seq 1 120); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${WEBMEET_INFRA_HEALTH_PORT}/" || true)"
            if [ "$code" = "200" ]; then
              echo "[deploy] liveKitServerAgent health responding with HTTP $code"
              break
            fi
            if [ "$i" = "120" ]; then
              echo "[deploy] ERROR: liveKitServerAgent health did not respond in time"
              echo "[deploy] Last HTTP code: ${code:-none}"
              tail -120 "$WORK_DIR/logs/skills-explorer-start.log" || true
              exit 1
            fi
            sleep 2
          done

          ONLYOFFICE_API_BASE="${ONLYOFFICE_INTERNAL_URL:-http://127.0.0.1:8082}"
          echo "[deploy] Verifying OnlyOffice api.js through ${ONLYOFFICE_API_BASE%/}..."
          for i in $(seq 1 120); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "${ONLYOFFICE_API_BASE%/}/web-apps/apps/api/documents/api.js" || true)"
            if [ "$code" = "200" ]; then
              echo "[deploy] OnlyOffice api.js responding with HTTP $code"
              break
            fi
            if [ "$i" = "120" ]; then
              echo "[deploy] ERROR: OnlyOffice api.js did not respond in time"
              echo "[deploy] Last HTTP code: ${code:-none}"
              tail -120 "$WORK_DIR/logs/skills-explorer-start.log" || true
              exit 1
            fi
            sleep 2
          done

          echo "[deploy] Containers:"
          podman ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" | head -100
          echo "[deploy] Workspace status:"
          env PLOINKY_MASTER_KEY="$PLOINKY_MASTER_KEY" "$PLOINKY" status || true
          REMOTE

      - name: Verify public URL
        env:
          ONLYOFFICE_PUBLIC_URL: ${{ vars.ONLYOFFICE_PUBLIC_URL }}
          WEBMEET_PUBLIC_LIVEKIT_URL: ${{ vars.WEBMEET_PUBLIC_LIVEKIT_URL || 'wss://livekit-skills.axiologic.dev' }}
        run: |
          set -euo pipefail
          echo "[deploy] Verifying ${PUBLIC_URL}/dashboard from GitHub runner..."
          for i in $(seq 1 60); do
            code="$(curl -L -s -o /tmp/skills-explorer-response.txt -w '%{http_code}' "${PUBLIC_URL%/}/dashboard" || true)"
            if [ "$code" = "200" ] || [ "$code" = "302" ]; then
              echo "[deploy] Public URL responding with HTTP $code"
              break
            fi
            if [ "$i" = "60" ]; then
              echo "[deploy] ERROR: public URL did not become reachable"
              echo "[deploy] Last HTTP code: ${code:-none}"
              sed -n '1,40p' /tmp/skills-explorer-response.txt 2>/dev/null || true
              exit 1
            fi
            sleep 5
          done

          if [ -n "${WEBMEET_PUBLIC_LIVEKIT_URL:-}" ]; then
            livekit_probe_url="${WEBMEET_PUBLIC_LIVEKIT_URL/#wss:/https:}"
            livekit_probe_url="${livekit_probe_url/#ws:/http:}"
            echo "[deploy] Verifying ${livekit_probe_url%/}/ from GitHub runner..."
            for i in $(seq 1 60); do
              code="$(curl -L -s -o /tmp/livekit-public-response.txt -w '%{http_code}' "${livekit_probe_url%/}/" || true)"
              if [ "$code" = "200" ]; then
                echo "[deploy] Public LiveKit endpoint responding with HTTP $code"
                break
              fi
              if [ "$i" = "60" ]; then
                echo "[deploy] ERROR: public LiveKit endpoint did not become reachable"
                echo "[deploy] Last HTTP code: ${code:-none}"
                sed -n '1,40p' /tmp/livekit-public-response.txt 2>/dev/null || true
                exit 1
              fi
              sleep 5
            done
          fi

          if [ -n "${ONLYOFFICE_PUBLIC_URL:-}" ]; then
            echo "[deploy] Verifying OnlyOffice public api.js from GitHub runner..."
            for i in $(seq 1 60); do
              code="$(curl -L -s -o /tmp/onlyoffice-public-api.js -w '%{http_code}' "${ONLYOFFICE_PUBLIC_URL%/}/web-apps/apps/api/documents/api.js" || true)"
              if [ "$code" = "200" ]; then
                echo "[deploy] OnlyOffice public api.js responding with HTTP $code"
                exit 0
              fi
              if [ "$i" = "60" ]; then
                echo "[deploy] ERROR: OnlyOffice public api.js did not become reachable"
                echo "[deploy] Last HTTP code: ${code:-none}"
                exit 1
              fi
              sleep 5
            done
          fi

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key /tmp/skills_explorer_env
