name: Destroy Explorer QA Box

on:
  workflow_dispatch:
    inputs:
      workspace_name:
        description: 'Host identity directory of the QA Box'
        required: false
        default: 'explorerQaWorkspace'
        type: string
      confirm_destroy:
        description: 'Confirm removal of the outer Box (named data volumes are retained)'
        required: true
        default: false
        type: boolean

concurrency:
  group: deploy-explorer-qa
  cancel-in-progress: false

env:
  SSH_USER: ${{ vars.EXPLORER_QA_SSH_USER || 'admin' }}
  SSH_HOST: ${{ vars.EXPLORER_QA_SSH_HOST || '45.136.70.141' }}
  WORKSPACE: ${{ inputs.workspace_name || vars.EXPLORER_QA_WORKSPACE || 'explorerQaWorkspace' }}
  CONFIRM_DESTROY: ${{ inputs.confirm_destroy }}
  SOUL_GATEWAY_WORKSPACE: 'soulGateway'
  SOUL_GATEWAY_ROUTER_PORT: '8080'

jobs:
  destroy:
    name: Destroy Explorer QA outer Box
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Validate GitHub configuration
        env:
          SSH_KEY: ${{ secrets.EXPLORER_QA_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_KEY:-}" ]; then
            echo "::error::Missing required repository secret EXPLORER_QA_SSH_KEY"
            exit 1
          fi
          if [ -z "${SSH_HOST:-}" ] || [ -z "${SSH_USER:-}" ]; then
            echo "::error::EXPLORER_QA_SSH_USER and EXPLORER_QA_SSH_HOST must be configured"
            exit 1
          fi
          case "${WORKSPACE:-}" in
            ''|.|..|*[!A-Za-z0-9._-]*)
              echo "::error::Invalid workspace name '${WORKSPACE:-}' (allowed: A-Za-z0-9._-)"
              exit 1
              ;;
          esac
          if [ "$WORKSPACE" = "$SOUL_GATEWAY_WORKSPACE" ]; then
            echo "::error::Refusing to destroy the production Soul Gateway workspace"
            exit 1
          fi
          if [ "$CONFIRM_DESTROY" != "true" ]; then
            echo "::error::confirm_destroy must be enabled"
            exit 1
          fi

      - name: Prepare SSH key
        env:
          SSH_KEY: ${{ secrets.EXPLORER_QA_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" > ~/.ssh/explorer_qa_known_hosts
          chmod 600 ~/.ssh/explorer_qa_known_hosts

      - name: Destroy Explorer QA Box
        run: |
          set -euo pipefail
          umask 077

          write_shell_var() {
            local name="$1"
            local value="${!name:-}"
            printf '%s=' "$name"
            printf '%q\n' "$value"
          }

          {
            write_shell_var WORKSPACE
            write_shell_var SOUL_GATEWAY_WORKSPACE
            write_shell_var SOUL_GATEWAY_ROUTER_PORT
          } > /tmp/explorer_qa_destroy.env

          scp \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$HOME/.ssh/explorer_qa_known_hosts" \
            /tmp/explorer_qa_destroy.env \
            "${SSH_USER}@${SSH_HOST}:/tmp/explorer_qa_destroy.env"
          rm -f /tmp/explorer_qa_destroy.env

          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$HOME/.ssh/explorer_qa_known_hosts" \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            "${SSH_USER}@${SSH_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          trap 'rm -f /tmp/explorer_qa_destroy.env' EXIT

          if [ ! -f /tmp/explorer_qa_destroy.env ]; then
            echo "[destroy-qa] ERROR: destroy configuration was not transferred."
            exit 1
          fi
          set -a
          . /tmp/explorer_qa_destroy.env
          set +a
          rm -f /tmp/explorer_qa_destroy.env

          case "${WORKSPACE:-}" in
            ''|.|..|*[!A-Za-z0-9._-]*)
              echo "[destroy-qa] ERROR: invalid workspace name '${WORKSPACE:-}'."
              exit 1
              ;;
          esac
          if [ "$WORKSPACE" = "${SOUL_GATEWAY_WORKSPACE:-soulGateway}" ]; then
            echo "[destroy-qa] ERROR: refusing to operate on the production Soul Gateway workspace."
            exit 1
          fi

          WORK_DIR="$HOME/$WORKSPACE"
          if [ -L "$WORK_DIR" ]; then
            echo "[destroy-qa] ERROR: workspace identity path must not be a symlink: $WORK_DIR"
            exit 1
          fi
          if [ ! -d "$WORK_DIR" ]; then
            echo "[destroy-qa] No QA identity directory exists at $WORK_DIR; nothing to destroy."
            exit 0
          fi

          RUNTIME_DIR="$WORK_DIR/.runtime/ploinky"
          PLOINKY="$RUNTIME_DIR/bin/ploinky"
          if [ ! -d "$RUNTIME_DIR/.git" ] || [ ! -x "$PLOINKY" ]; then
            echo "[destroy-qa] ERROR: the dedicated QA Ploinky runtime is missing or invalid."
            echo "[destroy-qa] Refusing to substitute a shared host runtime for exact Box destruction."
            exit 1
          fi

          SOUL_HEALTH_URL="http://127.0.0.1:${SOUL_GATEWAY_ROUTER_PORT:-8080}/base-agent-additional-server/soul-gateway/7000/healthz/"
          SOUL_UP_BEFORE=0
          if curl -sf "$SOUL_HEALTH_URL" >/dev/null 2>&1; then
            SOUL_UP_BEFORE=1
            echo "[destroy-qa] Protected Soul Gateway was healthy before destruction."
          fi

          export PLOINKY_WORKSPACE_ROOT="$WORK_DIR"
          echo "[destroy-qa] Exact Box status before destruction:"
          "$PLOINKY" status || true

          echo "[destroy-qa] Destroying the exact outer Box for $WORK_DIR..."
          printf 'yes\n' | "$PLOINKY" destroy

          BOX_STATUS="$("$PLOINKY" status)"
          printf '%s\n' "$BOX_STATUS"
          case "$BOX_STATUS" in
            *"Ploinky Box: absent"*|*"Ploinky Box: absent-retained-volumes"*) ;;
            *)
              echo "[destroy-qa] ERROR: outer Box still appears to exist."
              exit 1
              ;;
          esac

          if [ "$SOUL_UP_BEFORE" = "1" ] && ! curl -sf "$SOUL_HEALTH_URL" >/dev/null 2>&1; then
            echo "[destroy-qa] ERROR: protected Soul Gateway became unhealthy during QA destruction."
            exit 1
          fi

          echo "[destroy-qa] Outer Box removed. Named workspace, nested-container, and dependency volumes were retained."
          REMOTE

      - name: Create summary
        if: always()
        run: |
          {
            echo "## Explorer QA Box Destroy"
            echo ""
            echo "- Host: \`${SSH_USER}@${SSH_HOST}\`"
            echo "- Identity directory: \`~/${WORKSPACE}\`"
            echo "- Outer Box: removed when present"
            echo "- Named data volumes: retained"
            echo "- Host identity directory: retained"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: always()
        run: |
          rm -f \
            ~/.ssh/deploy_key \
            ~/.ssh/explorer_qa_known_hosts \
            /tmp/explorer_qa_destroy.env
