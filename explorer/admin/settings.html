<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Administration</title>
    <link rel="stylesheet" href="../shared/ui/ui-common.css">
    <link rel="stylesheet" href="../plugins.css">
    <link rel="stylesheet" href="../web-components/components/custom-select/custom-select.css">
    <link rel="stylesheet" href="./settings.css">
</head>
<body>
<main>
    <header>
        <div>
            <h1>Administration</h1>
            <div class="agent-label" id="agentLabel"></div>
        </div>
        <a class="gray-button" href="/explorer/index.html" id="backLink">Back to Explorer</a>
    </header>
    <section class="panel administration-panel">
        <div class="administration-tabs" role="tablist" aria-label="Administration settings">
            <button type="button" class="administration-tab active" data-tab="users" role="tab" aria-selected="true">Users</button>
            <button type="button" class="administration-tab" data-tab="branding" role="tab" aria-selected="false">Branding</button>
            <button type="button" class="administration-tab" data-tab="audit" role="tab" aria-selected="false">Audit settings</button>
        </div>
        <div class="status" id="status"></div>
        <section class="administration-tab-panel active" data-panel="users" role="tabpanel">
            <form class="toolbar" id="createForm">
                <label>Username
                    <input name="username" autocomplete="off" required>
                </label>
                <label>Password
                    <span class="password-field">
                        <input name="password" type="password" autocomplete="new-password" required>
                        <button type="button" class="password-toggle" data-toggle-password aria-label="Show password" title="Show password" aria-pressed="false">
                            <img src="../assets/icons/eye.svg" alt="">
                        </button>
                    </span>
                </label>
                <label>Name
                    <input name="name" autocomplete="off">
                </label>
                <label>Roles
                    <custom-select name="roles" data-admin-custom-select></custom-select>
                </label>
                <button class="general-button" type="submit">Add User</button>
            </form>
            <div id="tableHost"></div>
        </section>
        <section class="administration-tab-panel" data-panel="branding" role="tabpanel" hidden>
            <div id="settingsStripHost"></div>
        </section>
        <section class="administration-tab-panel" data-panel="audit" role="tabpanel" hidden>
            <div id="auditSettingsHost"></div>
        </section>
    </section>
</main>
<script>
(() => {
    const pathParts = window.location.pathname.split('/').filter(Boolean);
    const embedded = new URLSearchParams(window.location.search).get('embedded') === '1';
    document.body.classList.toggle('embedded', embedded);
    // Apply theme: explicit ?theme= param (passed by the host Explorer) wins, else the browser/OS preference.
    const themeParam = new URLSearchParams(window.location.search).get('theme');
    const prefersDark = typeof window.matchMedia === 'function' && window.matchMedia('(prefers-color-scheme: dark)').matches;
    const isDarkTheme = themeParam ? themeParam.toLowerCase() === 'dark' : prefersDark;
    document.documentElement.classList.toggle('theme-dark', isDarkTheme);
    document.documentElement.classList.toggle('theme-light', !isDarkTheme);
    const agent = pathParts[0] || 'explorer';
    const apiBase = `/api/agents/${encodeURIComponent(agent)}/users`;
    const settingsApi = `/api/agents/${encodeURIComponent(agent)}/settings`;
    const status = document.getElementById('status');
    const tableHost = document.getElementById('tableHost');
    const settingsStripHost = document.getElementById('settingsStripHost');
    const auditSettingsHost = document.getElementById('auditSettingsHost');
    const createForm = document.getElementById('createForm');
    const createRolesSelect = createForm.querySelector('custom-select[name="roles"]');
    const backLink = document.getElementById('backLink');
    const tabButtons = Array.from(document.querySelectorAll('.administration-tab'));
    const tabPanels = Array.from(document.querySelectorAll('.administration-tab-panel'));
    document.getElementById('agentLabel').textContent = `Agent: ${agent}`;
    backLink.href = `/${encodeURIComponent(agent)}/index.html`;
    backLink.textContent = `Back to ${agent}`;

    let users = [];
    let availableRoles = [];
    let loginBrandingName = 'Login';
    let auditConfig = {
        enabled: false,
        canManage: false,
        error: '',
        capture: {
            dpuOperations: true,
            fileAccess: true,
            explorerActions: true,
            pluginUsage: true,
            aiActivity: false,
        },
    };

    function setStatus(message, kind = '') {
        status.textContent = message || '';
        status.className = `status${kind ? ` ${kind}` : ''}`;
    }

    function parseRoles(value) {
        const values = Array.isArray(value) ? value : [value];
        const roles = values
            .flatMap((entry) => String(entry || '').split(','))
            .map((role) => role.trim())
            .filter((role) => role.toLowerCase() !== 'local')
            .filter(Boolean);
        return Array.from(new Set(roles));
    }

    function getRoleOptions() {
        return availableRoles;
    }

    function getEffectiveRole(roles = []) {
        const selectedRoles = parseRoles(roles);
        const elevatedRole = [...selectedRoles].reverse().find((role) => role !== 'user' && availableRoles.includes(role));
        if (elevatedRole) {
            return elevatedRole;
        }
        if (selectedRoles.includes('user') && availableRoles.includes('user')) {
            return 'user';
        }
        return selectedRoles.find((role) => availableRoles.includes(role)) || availableRoles[0] || '';
    }

    function getRoleOptionItems() {
        return getRoleOptions().map((role) => ({ value: role, label: role }));
    }

    function encodeRoleOptions() {
        return encodeURIComponent(JSON.stringify(getRoleOptionItems()));
    }

    function renderRoleOptions(selectedRoles = []) {
        const selectedRole = getEffectiveRole(selectedRoles);
        return getRoleOptions()
            .map((role) => `<option value="${escapeAttr(role)}"${role === selectedRole ? ' selected' : ''}>${escapeAttr(role)}</option>`)
            .join('');
    }

    function renderRoleSelect(selectedRoles = [], attributes = '') {
        const selectedRole = getEffectiveRole(selectedRoles);
        return `<custom-select data-admin-custom-select ${attributes} data-options="${encodeRoleOptions()}" data-selected="${escapeAttr(selectedRole)}"></custom-select>`;
    }

    function getSelectedRoles(select) {
        return parseRoles(select.value);
    }

    function syncCreateRoleOptions() {
        const selectedRoles = getSelectedRoles(createRolesSelect);
        const selectedRole = getEffectiveRole(selectedRoles);
        createRolesSelect.setAttribute('data-options', encodeRoleOptions());
        createRolesSelect.setAttribute('data-selected', selectedRole);
        upgradeAdminCustomSelect(createRolesSelect, selectedRole);
    }

    function decodeSelectOptions(encoded = '') {
        if (!encoded) return [];
        try {
            const parsed = JSON.parse(decodeURIComponent(encoded));
            return Array.isArray(parsed) ? parsed.map((entry) => ({
                value: String(entry?.value ?? entry?.label ?? ''),
                label: String(entry?.label ?? entry?.value ?? '')
            })) : [];
        } catch (_) {
            return [];
        }
    }

    function closeAdminCustomSelect(select) {
        const list = select?.querySelector?.('.custom-select-options-list');
        const trigger = select?.querySelector?.('.custom-select');
        if (!list) return;
        list.hidden = true;
        list.classList.add('hidden');
        trigger?.classList.remove('focused');
        trigger?.setAttribute('aria-expanded', 'false');
    }

    function positionAdminCustomSelect(select) {
        const trigger = select.querySelector('.custom-select');
        const list = select.querySelector('.custom-select-options-list');
        if (!trigger || !list || list.hidden) return;
        const rect = trigger.getBoundingClientRect();
        const margin = 8;
        const gap = 4;
        const viewportWidth = document.documentElement.clientWidth || window.innerWidth;
        const viewportHeight = document.documentElement.clientHeight || window.innerHeight;
        const mobile = viewportWidth <= 720;
        const width = mobile ? viewportWidth - margin * 2 : Math.min(Math.max(rect.width, 180), viewportWidth - margin * 2);
        const left = mobile ? margin : Math.min(Math.max(rect.left, margin), viewportWidth - width - margin);
        const desiredMaxHeight = 330;
        const spaceBelow = viewportHeight - rect.bottom - margin - gap;
        const spaceAbove = rect.top - margin - gap;
        const openAbove = spaceBelow < 180 && spaceAbove > spaceBelow;
        const maxHeight = Math.min(desiredMaxHeight, Math.max(64, openAbove ? spaceAbove : spaceBelow));
        const listHeight = Math.min(list.scrollHeight || maxHeight, maxHeight);
        const top = openAbove
            ? Math.max(margin, rect.top - gap - listHeight)
            : Math.min(rect.bottom + gap, viewportHeight - margin - listHeight);
        Object.assign(list.style, {
            left: `${left}px`,
            top: `${top}px`,
            width: `${width}px`,
            maxHeight: `${maxHeight}px`
        });
    }

    function setAdminCustomSelectValue(select, value, emit = false) {
        const options = decodeSelectOptions(select.getAttribute('data-options'));
        const selected = options.find((option) => option.value === String(value ?? '')) || options[0] || { value: '', label: '' };
        select._value = selected.value;
        const hiddenInput = select.querySelector('.custom-select-hidden-input');
        if (hiddenInput) {
            hiddenInput.name = select.getAttribute('name') || '';
            hiddenInput.value = selected.value;
        }
        const current = select.querySelector('.current-option');
        if (current) current.textContent = selected.label;
        select.querySelectorAll('.custom-select-option').forEach((option) => {
            const isSelected = option.dataset.value === selected.value;
            option.toggleAttribute('data-selected', isSelected);
            option.setAttribute('aria-selected', isSelected ? 'true' : 'false');
        });
        if (emit) {
            select.dispatchEvent(new Event('input', { bubbles: true }));
            select.dispatchEvent(new Event('change', { bubbles: true }));
        }
    }

    function upgradeAdminCustomSelect(select, selectedValue = null) {
        if (!select) return;
        const options = decodeSelectOptions(select.getAttribute('data-options'));
        if (!select.dataset.adminCustomSelectReady) {
            select.innerHTML = `
                <div class="custom-select pointer" role="button" tabindex="0" aria-haspopup="listbox" aria-expanded="false">
                    <div class="current-option"></div>
                    <img class="select-arrow" src="../assets/icons/arrow.svg" alt="" aria-hidden="true">
                    <div class="options-list custom-select-options-list hidden" role="listbox" hidden></div>
                </div>
                <input class="custom-select-hidden-input" type="hidden">
            `;
            Object.defineProperty(select, 'value', {
                configurable: true,
                get: () => select._value || '',
                set: (nextValue) => setAdminCustomSelectValue(select, nextValue, false)
            });
            select.addEventListener('click', (event) => {
                const option = event.target.closest('.custom-select-option');
                if (option) {
                    event.preventDefault();
                    setAdminCustomSelectValue(select, option.dataset.value || '', true);
                    closeAdminCustomSelect(select);
                    return;
                }
                if (!event.target.closest('.custom-select')) return;
                const list = select.querySelector('.custom-select-options-list');
                const trigger = select.querySelector('.custom-select');
                const willOpen = list.hidden;
                document.querySelectorAll('custom-select[data-admin-custom-select]').forEach((item) => {
                    if (item !== select) closeAdminCustomSelect(item);
                });
                list.hidden = !willOpen;
                list.classList.toggle('hidden', !willOpen);
                trigger.classList.toggle('focused', willOpen);
                trigger.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
                if (willOpen) positionAdminCustomSelect(select);
            });
            select.dataset.adminCustomSelectReady = 'true';
        }
        const list = select.querySelector('.custom-select-options-list');
        if (list) {
            list.innerHTML = options.map((option) => `
                <button type="button" class="option custom-select-option" data-value="${escapeAttr(option.value)}" role="option">
                    ${escapeAttr(option.label)}
                </button>
            `).join('');
        }
        setAdminCustomSelectValue(select, selectedValue ?? select.getAttribute('data-selected') ?? select.value ?? '', false);
    }

    function togglePasswordVisibility(button) {
        const field = button.closest('.password-field');
        const input = field?.querySelector('input');
        if (!input) return;
        const shouldShow = input.type === 'password';
        input.type = shouldShow ? 'text' : 'password';
        const label = shouldShow ? 'Hide password' : 'Show password';
        button.setAttribute('aria-label', label);
        button.setAttribute('aria-pressed', shouldShow ? 'true' : 'false');
        button.title = label;
        input.focus();
    }

    async function request(path, options = {}) {
        const response = await fetch(path, {
            credentials: 'include',
            headers: {
                Accept: 'application/json',
                ...(options.body ? { 'Content-Type': 'application/json' } : {}),
            },
            ...options,
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok || payload.ok === false) {
            throw new Error(payload.message || payload.error || `HTTP ${response.status}`);
        }
        return payload;
    }

    async function callDpuTool(name, args = {}) {
        const services = getAppServices();
        if (!services) {
            throw new Error('DPU MCP client is not available in this view.');
        }
        if (typeof services.callTool === 'function') {
            const result = await services.callTool('dpuAgent', name, args);
            return normalizeToolResult(result);
        }
        const client = services.getClient?.('dpuAgent');
        if (!client || typeof client.callTool !== 'function') {
            throw new Error('DPU MCP client is not available in this view.');
        }
        return normalizeToolResult(await client.callTool(name, args));
    }

    function getAppServices() {
        const candidates = [
            () => window.webSkel?.appServices,
            () => window.assistOS?.appServices,
            () => window.parent?.webSkel?.appServices,
            () => window.parent?.assistOS?.appServices,
        ];
        for (const resolve of candidates) {
            try {
                const services = resolve();
                if (services?.callTool || services?.getClient) {
                    return services;
                }
            } catch (_) {
                // Cross-origin parent access is not available.
            }
        }
        return null;
    }

    function normalizeToolResult(result) {
        if (!result) return {};
        if (result.json && typeof result.json === 'object') return result.json;
        if (result.raw) return normalizeToolResult(result.raw);
        if (result.isError) {
            throw new Error(extractToolText(result) || 'DPU tool failed.');
        }
        const blocks = Array.isArray(result.content) ? result.content : Array.isArray(result.blocks) ? result.blocks : [];
        const jsonBlock = blocks.find((block) => block?.type === 'json' && block.json !== undefined);
        if (jsonBlock) return jsonBlock.json;
        const text = result.text || extractToolText({ content: blocks });
        if (text) {
            try {
                return JSON.parse(text);
            } catch {
                if (/missing or invalid mcp session/i.test(text)) {
                    throw new Error(text);
                }
            }
        }
        return result;
    }

    function extractToolText(result) {
        const blocks = Array.isArray(result?.content) ? result.content : Array.isArray(result?.blocks) ? result.blocks : [];
        return blocks.find((block) => block?.type === 'text' && typeof block.text === 'string')?.text || '';
    }

    function normalizeAuditCapture(capture = {}) {
        return {
            dpuOperations: capture.dpuOperations !== false,
            fileAccess: capture.fileAccess !== false,
            explorerActions: capture.explorerActions !== false,
            pluginUsage: capture.pluginUsage !== false,
            aiActivity: capture.aiActivity === true,
        };
    }

    function userRow(user) {
        const tr = document.createElement('tr');
        tr.dataset.userId = user.id;
        tr.innerHTML = `
            <td data-label="Username"><input data-field="username" value="${escapeAttr(user.username)}"></td>
            <td data-label="Name"><input data-field="name" value="${escapeAttr(user.name || '')}"></td>
            <td data-label="Roles">${renderRoleSelect(user.roles, 'data-field="roles"')}</td>
            <td data-label="Password"><span class="password-field">
                <input data-field="password" type="password" placeholder="Leave unchanged">
                <button type="button" class="password-toggle" data-toggle-password aria-label="Show password" title="Show password" aria-pressed="false">
                    <img src="../assets/icons/eye.svg" alt="">
                </button>
            </span></td>
            <td data-label="Actions"><div class="actions">
                <button type="button" class="gray-button" data-action="save">Save</button>
                <button type="button" class="gray-button danger" data-action="delete">Delete</button>
            </div></td>
        `;
        return tr;
    }

    function escapeAttr(value) {
        return String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/"/g, '&quot;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
    }

    function switchAdministrationTab(tab) {
        const normalizedTab = ['users', 'branding', 'audit'].includes(tab) ? tab : 'users';
        tabButtons.forEach((button) => {
            const active = button.dataset.tab === normalizedTab;
            button.classList.toggle('active', active);
            button.setAttribute('aria-selected', active ? 'true' : 'false');
        });
        tabPanels.forEach((panel) => {
            const active = panel.dataset.panel === normalizedTab;
            panel.classList.toggle('active', active);
            panel.hidden = !active;
        });
    }

    function renderLoginSettings() {
        const section = document.createElement('section');
        section.className = 'settings-strip';
        section.innerHTML = `
            <form class="login-branding-form" id="loginBrandingForm">
                <label>Brand name
                    <input name="loginBrandingName" autocomplete="off" value="${escapeAttr(loginBrandingName)}" placeholder="Login">
                </label>
                <button class="general-button compact-save" type="submit">Save</button>
            </form>
        `;
        const form = section.querySelector('#loginBrandingForm');
        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const data = new FormData(form);
            try {
                setStatus('Saving login branding...');
                const payload = await request(settingsApi, {
                    method: 'PATCH',
                    body: JSON.stringify({
                        loginBrandingName: data.get('loginBrandingName'),
                    }),
                });
                loginBrandingName = payload.settings?.loginBrandingName || 'Login';
                render();
                setStatus('Login branding saved.', 'ok');
            } catch (error) {
                setStatus(error.message, 'error');
            }
        });
        return section;
    }

    function renderAuditSettings() {
        const capture = normalizeAuditCapture(auditConfig.capture);
        const section = document.createElement('section');
        section.className = 'audit-settings';
        if (auditConfig.error) {
            section.innerHTML = `<div class="audit-settings-error">${escapeAttr(auditConfig.error)}</div>`;
            return section;
        }
        section.innerHTML = `
            <form class="audit-settings-form" id="auditSettingsForm">
                <label class="audit-toggle">
                    <input name="enabled" type="checkbox" ${auditConfig.enabled ? 'checked' : ''} ${auditConfig.canManage ? '' : 'disabled'}>
                    <span>Enable audit</span>
                </label>
                <div class="audit-capture-grid">
                    <label><input name="dpuOperations" type="checkbox" ${capture.dpuOperations ? 'checked' : ''} ${auditConfig.canManage ? '' : 'disabled'}> DPU operations</label>
                    <label><input name="fileAccess" type="checkbox" ${capture.fileAccess ? 'checked' : ''} ${auditConfig.canManage ? '' : 'disabled'}> File access</label>
                    <label><input name="explorerActions" type="checkbox" ${capture.explorerActions ? 'checked' : ''} ${auditConfig.canManage ? '' : 'disabled'}> Explorer actions</label>
                    <label><input name="pluginUsage" type="checkbox" ${capture.pluginUsage ? 'checked' : ''} ${auditConfig.canManage ? '' : 'disabled'}> Plugin usage</label>
                    <label><input name="aiActivity" type="checkbox" ${capture.aiActivity ? 'checked' : ''} ${auditConfig.canManage ? '' : 'disabled'}> AI activity metadata</label>
                </div>
                <button class="general-button compact-save" type="submit" ${auditConfig.canManage ? '' : 'disabled'}>Save</button>
            </form>
        `;
        const form = section.querySelector('#auditSettingsForm');
        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const data = new FormData(form);
            try {
                setStatus('Saving audit settings...');
                const payload = await callDpuTool('dpu_audit_config_set', {
                    enabled: data.get('enabled') === 'on',
                    capture: {
                        dpuOperations: data.get('dpuOperations') === 'on',
                        fileAccess: data.get('fileAccess') === 'on',
                        explorerActions: data.get('explorerActions') === 'on',
                        pluginUsage: data.get('pluginUsage') === 'on',
                        aiActivity: data.get('aiActivity') === 'on',
                    },
                });
                auditConfig = {
                    ...auditConfig,
                    ...(payload.audit || {}),
                    error: '',
                    capture: normalizeAuditCapture(payload.audit?.capture),
                };
                render();
                setStatus('Audit settings saved.', 'ok');
            } catch (error) {
                setStatus(error.message, 'error');
            }
        });
        return section;
    }

    function render() {
        settingsStripHost.replaceChildren(renderLoginSettings());
        auditSettingsHost.replaceChildren(renderAuditSettings());
        const fragment = document.createDocumentFragment();
        const userHeader = document.createElement('div');
        userHeader.className = 'section-heading user-section-heading';
        userHeader.innerHTML = '<h2>Manage users</h2>';
        fragment.appendChild(userHeader);
        if (!users.length) {
            const empty = document.createElement('div');
            empty.className = 'empty';
            empty.textContent = 'No users.';
            fragment.appendChild(empty);
            tableHost.replaceChildren(fragment);
            return;
        }
        const table = document.createElement('table');
        table.innerHTML = `
            <thead>
                <tr>
                    <th>Username</th>
                    <th>Name</th>
                    <th>Roles</th>
                    <th>Password Reset</th>
                    <th></th>
                </tr>
            </thead>
            <tbody></tbody>
        `;
        const tbody = table.querySelector('tbody');
        users.forEach((user) => tbody.appendChild(userRow(user)));
        fragment.appendChild(table);
        tableHost.replaceChildren(fragment);
        tableHost.querySelectorAll('custom-select[data-admin-custom-select]').forEach((select) => upgradeAdminCustomSelect(select));
    }

    async function loadPage() {
        setStatus('Loading settings...');
        const [settingsPayload, usersPayload] = await Promise.all([
            request(settingsApi),
            request(apiBase),
        ]);
        loginBrandingName = settingsPayload.settings?.loginBrandingName || 'Login';
        users = Array.isArray(usersPayload.users) ? usersPayload.users : [];
        availableRoles = parseRoles(usersPayload.availableRoles);
        syncCreateRoleOptions();
        try {
            const auditPayload = await callDpuTool('dpu_audit_config_get');
            auditConfig = {
                ...auditConfig,
                ...(auditPayload.audit || {}),
                error: '',
                capture: normalizeAuditCapture(auditPayload.audit?.capture),
            };
        } catch (error) {
            auditConfig = {
                ...auditConfig,
                error: error.message || 'Audit settings could not be loaded.',
            };
        }
        render();
        setStatus(auditConfig.error || `${users.length} user${users.length === 1 ? '' : 's'} loaded.`, auditConfig.error ? 'error' : 'ok');
    }

    tabButtons.forEach((button) => {
        button.addEventListener('click', () => switchAdministrationTab(button.dataset.tab));
    });

    createForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const data = new FormData(createForm);
        try {
            setStatus('Creating user...');
            await request(apiBase, {
                method: 'POST',
                body: JSON.stringify({
                    username: data.get('username'),
                    password: data.get('password'),
                    name: data.get('name'),
                    roles: parseRoles(data.get('roles')),
                }),
            });
            createForm.reset();
            await loadPage();
        } catch (error) {
            setStatus(error.message, 'error');
        }
    });

    tableHost.addEventListener('click', async (event) => {
        const button = event.target.closest('button[data-action]');
        if (!button) return;
        const row = button.closest('tr[data-user-id]');
        if (!row) return;
        const userId = row.dataset.userId;
        const action = button.dataset.action;
        try {
            if (action === 'delete') {
                setStatus('Deleting user...');
                await request(`${apiBase}/${encodeURIComponent(userId)}`, { method: 'DELETE' });
                await loadPage();
                return;
            }
            if (action === 'save') {
                const body = {};
                row.querySelectorAll('input[data-field], custom-select[data-field]').forEach((input) => {
                    if (input.dataset.field === 'roles') {
                        body.roles = getSelectedRoles(input);
                    } else if (input.dataset.field === 'password') {
                        if (input.value) body.password = input.value;
                    } else {
                        body[input.dataset.field] = input.value;
                    }
                });
                setStatus('Saving user...');
                await request(`${apiBase}/${encodeURIComponent(userId)}`, {
                    method: 'PATCH',
                    body: JSON.stringify(body),
                });
                await loadPage();
            }
        } catch (error) {
            setStatus(error.message, 'error');
        }
    });

    document.addEventListener('click', (event) => {
        if (!event.target.closest('custom-select[data-admin-custom-select]')) {
            document.querySelectorAll('custom-select[data-admin-custom-select]').forEach((select) => closeAdminCustomSelect(select));
        }
        const button = event.target.closest('button[data-toggle-password]');
        if (!button) return;
        togglePasswordVisibility(button);
    });

    window.addEventListener('resize', () => {
        document.querySelectorAll('custom-select[data-admin-custom-select]').forEach((select) => positionAdminCustomSelect(select));
    }, { passive: true });

    loadPage().catch((error) => setStatus(error.message, 'error'));
})();
</script>
</body>
</html>
