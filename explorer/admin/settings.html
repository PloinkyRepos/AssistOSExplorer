<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Administration</title>
    <link rel="stylesheet" href="../shared/ui/ui-common.css">
    <link rel="stylesheet" href="../plugins.css">
    <link rel="stylesheet" href="./settings.css">
</head>
<body>
<main>
    <header>
        <div>
            <h1>Administration</h1>
            <div class="agent-label" id="agentLabel"></div>
        </div>
        <a class="gray-button" href="/explorer/index.html" id="backLink">Back to Explorer</a>
    </header>
    <admin-settings-panel data-presenter="admin-settings-panel"></admin-settings-panel>
</main>
<script type="module">
    import WebSkel from '../shared/libs/webskel/webskel.mjs';
    import assistosSDK from '../services/assistosSDK.js';
    import { initializeTheme } from '../shared/ui/theme.js';

    const pathParts = window.location.pathname.split('/').filter(Boolean);
    const agent = pathParts[0] || 'explorer';
    window.ASSISTOS_AGENT_ID = window.ASSISTOS_AGENT_ID || agent;

    initializeTheme();
    const webSkel = await WebSkel.initialise('../webskel.json');
    webSkel.appServices = assistosSDK;
    window.UI = webSkel;

    document.getElementById('agentLabel').textContent = `Agent: ${agent}`;
    const backLink = document.getElementById('backLink');
    backLink.href = `/${encodeURIComponent(agent)}/index.html`;
    backLink.textContent = `Back to ${agent}`;
</script>
</body>
</html>
