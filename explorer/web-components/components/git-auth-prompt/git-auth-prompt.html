<div class="git-auth" id="gitAuthPrompt" style="display: none;">
    <div class="git-auth-title">Authentication required</div>
    <div class="git-auth-hint">Enter a Personal Access Token (PAT) for HTTPS push.</div>
    <div class="git-auth-row">
        <label class="git-auth-label" for="gitAuthToken">Token</label>
        <input id="gitAuthToken" type="password" autocomplete="off" spellcheck="false" />
    </div>
    <div class="git-auth-actions">
        <label class="git-toggle git-toggle-small">
            <input type="checkbox" id="gitAuthRemember">
            Remember
        </label>
        <div class="git-auth-buttons">
            <button type="button" class="secondary" data-local-action="cancelGitToken">Cancel</button>
            <button type="button" data-local-action="saveGitToken">Continue</button>
        </div>
    </div>
</div>
