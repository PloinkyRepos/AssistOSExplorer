<div class="git-identity" id="gitIdentityPrompt" style="display: none;">
    <div class="git-identity-title">Git identity required</div>
    <div class="git-identity-row">
        <label class="git-identity-label" for="gitIdentityName">Name</label>
        <input id="gitIdentityName" type="text" autocomplete="off" spellcheck="false" />
    </div>
    <div class="git-identity-row">
        <label class="git-identity-label" for="gitIdentityEmail">Email</label>
        <input id="gitIdentityEmail" type="text" autocomplete="off" spellcheck="false" />
    </div>
    <div class="git-identity-actions">
        <button type="button" class="secondary" data-local-action="cancelGitIdentity">Cancel</button>
        <button type="button" class="secondary" data-local-action="saveGitIdentity local">Save for this repo</button>
        <button type="button" class="secondary" data-local-action="saveGitIdentity global">Save global</button>
    </div>
</div>
