<div class="backlog-panel">
    <div class="backlog-header">
        <div class="backlog-title">Backlog</div>
        <div class="backlog-actions">
            <button type="button" class="secondary" data-local-action="refreshBacklog">Refresh</button>
        </div>
    </div>

    <div class="backlog-error" id="backlogError" aria-live="polite"></div>

    <div class="backlog-filters" id="backlogFilters">
        <label>
            Repo
            <select id="backlogRepoFilter"></select>
        </label>
        <label>
            Status
            <select id="backlogStatusFilter"></select>
        </label>
        <label>
            Type
            <select id="backlogTypeFilter"></select>
        </label>
        <label>
            Priority
            <select id="backlogPriorityFilter"></select>
        </label>
        <label>
            Assignee
            <input id="backlogAssigneeFilter" type="search" autocomplete="off" spellcheck="false"/>
        </label>
        <label>
            Tag
            <input id="backlogTagFilter" type="search" autocomplete="off" spellcheck="false"/>
        </label>
        <label>
            Search
            <input id="backlogSearchFilter" type="search" autocomplete="off" spellcheck="false"/>
        </label>
    </div>

    <div class="backlog-create-actions">
        <button type="button" class="primary" data-local-action="openCreateTaskModal">New task</button>
    </div>

    <div class="backlog-section-title">Tasks</div>
    <div class="backlog-list" id="backlogList"></div>
    <div class="backlog-empty" id="backlogEmpty">No tasks found.</div>
</div>
