<div class="backlog-create-modal">
    <div class="modal-header">
        <div class="modal-title">New task</div>
        <button type="button" class="secondary" data-local-action="closeModal">Close</button>
    </div>
    <div class="modal-body">
        <label>
            Repo
            <select id="backlogModalRepo"></select>
        </label>
        <label>
            Type
            <select id="backlogModalType"></select>
        </label>
        <label>
            Status
            <select id="backlogModalStatus"></select>
        </label>
        <label>
            Priority
            <select id="backlogModalPriority"></select>
        </label>
        <label>
            Assignee
            <input id="backlogModalAssignee" type="text" autocomplete="off" spellcheck="false"/>
        </label>
        <label>
            Tags
            <input id="backlogModalTags" type="text" placeholder="tag1, tag2" autocomplete="off" spellcheck="false"/>
        </label>
        <label class="modal-description">
            Description
            <textarea id="backlogModalDescription" rows="4" spellcheck="false"></textarea>
        </label>
        <label class="modal-description">
            Observations
            <textarea id="backlogModalObservations" rows="3" spellcheck="false"></textarea>
        </label>
    </div>
    <div class="modal-actions">
        <button type="button" class="primary" data-local-action="createTask">Create</button>
    </div>
</div>
