<div class="backlog-create-modal">
    <div class="modal-header">
        <div class="modal-title">New task</div>
        <div class="close" data-local-action="closeModal">
            <img class="close-icon" src="./assets/icons/x-mark.svg" alt="close">
        </div>
    </div>
    <div class="modal-body">
        <label>
            Type
            <select id="backlogModalType"></select>
        </label>
        <label>
            Status
            <select id="backlogModalStatus"></select>
        </label>
        <label>
            Priority
            <select id="backlogModalPriority"></select>
        </label>
        <label class="modal-description">
            Description
            <textarea id="backlogModalDescription" rows="4" spellcheck="false"></textarea>
        </label>
        <label class="modal-description">
            Proposed solution
            <textarea id="backlogModalProposedSolution" rows="3" spellcheck="false"></textarea>
        </label>
        <label class="modal-description">
            Observations
            <textarea id="backlogModalObservations" rows="3" spellcheck="false"></textarea>
        </label>
    </div>
    <div class="modal-actions">
        <button type="button" class="primary" data-local-action="createTask">Create</button>
    </div>
</div>
