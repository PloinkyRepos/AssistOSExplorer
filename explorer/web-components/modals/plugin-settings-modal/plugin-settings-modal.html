<div class="modal-header">
    <div class="modal-title">Plugin Settings</div>
    <div class="close" data-local-action="closeModal" aria-label="Close">
        <img class="close-icon" src="./assets/icons/x-mark.svg" alt="close">
    </div>
</div>
<div class="modal-body plugin-settings-modal-body">
    <p class="plugin-settings-description">
        Enable or disable discovered workspace plugins. This updates workspace settings only.
    </p>
    <div class="plugin-settings-status" id="pluginSettingsStatus" role="status" aria-live="polite"></div>
    <div class="plugin-settings-list" id="pluginSettingsList"></div>
    <div class="modal-actions">
        <button type="button" class="gray-button" data-local-action="closeModal">Close</button>
    </div>
</div>
