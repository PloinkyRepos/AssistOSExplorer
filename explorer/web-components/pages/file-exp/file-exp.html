<main>
    <section class="panel" id="directoryPanel">
        <div class="path-info">
            <span>Path:</span>
            <div class="breadcrumbs" id="breadcrumbs"></div>
        </div>
	        <div class="toolbar">
            <button id="upButton" class="secondary" title="Go to parent directory" data-local-action="goUp">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                     class="bi bi-arrow-up-short" viewBox="0 0 16 16">
                    <path fill-rule="evenodd"
                          d="M8 12a.5.5 0 0 0 .5-.5V5.707l2.146 2.147a.5.5 0 0 0 .708-.708l-3-3a.5.5 0 0 0-.708 0l-3 3a.5.5 0 1 0 .708.708L7.5 5.707V11.5a.5.5 0 0 0 .5.5z"/>
                </svg>
                Up
            </button>
            <button id="refreshButton" class="secondary" title="Reload directory" data-local-action="refresh">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                     class="bi bi-arrow-clockwise" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2v1z"/>
                    <path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466z"/>
                </svg>
                Refresh
            </button>
            <button id="newDirButton" title="Create a new directory" data-local-action="newDirectory">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                     class="bi bi-folder-plus" viewBox="0 0 16 16">
                    <path d="m.5 3 .04.87a1.99 1.99 0 0 0-.342 1.311l.637 7A2 2 0 0 0 2.826 14H9v-1H2.826a1 1 0 0 1-.995-.91l-.637-7A1 1 0 0 1 2.19 4h11.62a1 1 0 0 1 .996 1.09L14.54 8h1.005l.256-2.819A2 2 0 0 0 13.81 3H9.828a2 2 0 0 1-1.414-.586l-.828-.828A2 2 0 0 0 6.172 1H2.5a2 2 0 0 0-2 2zm.69-1.207A1 1 0 0 1 2.5 1h3.672a1 1 0 0 1 .707.293L7.586 3H2.19c-.24 0-.47.042-.683.12L1.19 1.793z"/>
                    <path d="M13.5 10a.5.5 0 0 1 .5.5V12h1.5a.5.5 0 1 1 0 1H14v1.5a.5.5 0 1 1-1 0V13h-1.5a.5.5 0 0 1 0-1H13v-1.5a.5.5 0 0 1 .5-.5z"/>
                </svg>
                New Folder
            </button>
            <button id="newFileButton" title="Create a new file" data-local-action="newFile">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                     class="bi bi-file-earmark-plus-fill" viewBox="0 0 16 16">
                    <path d="M9.293 0H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V4.707A1 1 0 0 0 13.707 4L10 .293A1 1 0 0 0 9.293 0zM9.5 3.5v-2l3 3h-2a1 1 0 0 1-1-1zM8.5 7v1.5H10a.5.5 0 0 1 0 1H8.5V11a.5.5 0 0 1-1 0V9.5H6a.5.5 0 0 1 0-1h1.5V7a.5.5 0 0 1 1 0z"/>
                </svg>
                New File
            </button>
            <button id="searchInFilesButton" class="secondary" title="Search in files (content)"
                    data-local-action="openSearchInFiles">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                     class="bi bi-search" viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001l3.85 3.85a1 1 0 0 0 1.415-1.415l-3.85-3.85zm-5.242.656a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/>
                </svg>
                Search in files
            </button>
            <div class="clipboard-group">
                <span id="clipboardInfo" class="clipboard-info"></span>
                <button id="clearClipboardButton" class="secondary" title="Clear the current clipboard selection"
                        data-local-action="clearClipboard" disabled>
                    Clear
                </button>
            </div>
            <label class="filter-specs-toggle">
                <input type="checkbox" id="filterSpecsToggle" data-local-action="toggleFilterSpecs"/>
                Filter specs (.md)
            </label>
	            <span class="toolbar-spacer"></span>
            <button id="tasksButton" class="secondary" title="Open backlog" data-local-action="openBacklog">
                Backlog
            </button>
            <button id="gitButton" class="secondary" title="Commit and push with Git" data-local-action="openGitModal">
                Git
                <span class="git-conflict-indicator" id="gitConflictIndicator" aria-hidden="true">!</span>
                <span class="git-push-warning-indicator" id="gitPushWarningIndicator" aria-hidden="true">!</span>
            </button>
	            <a class="primary-button" href="/soplangAgent/web/build-status.html" target="_blank" rel="noopener">Open
	                Builder</a>
	        </div>
        <div class="workspace">
            <div class="panel list">
                <div class="list-header">
                    <div class="directory-filter" role="search" aria-label="Filter directory contents">
                        <input id="directoryFilterInput" type="search" placeholder="Search file…" autocomplete="off"
                               spellcheck="false"/>
                        <button id="directoryFilterClear" type="button" class="secondary" title="Clear filter"
                                aria-label="Clear filter">
                            Clear
                        </button>
                    </div>
                    <div class="list-header-actions">
                        <div class="column-visibility">
                            <button id="columnVisibilityButton" class="toggle-list view-button" title="Choose columns" aria-haspopup="true" aria-expanded="false">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
                                    <circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.2"/>
                                    <circle cx="4.5" cy="8" r="1" fill="currentColor"/>
                                    <circle cx="8" cy="8" r="1" fill="currentColor"/>
                                    <circle cx="11.5" cy="8" r="1" fill="currentColor"/>
                                </svg>
	                            </button>
	                            <div class="column-visibility-menu" id="columnVisibilityMenu" role="menu">
	                                <label><input type="checkbox" data-column="type"> Type</label>
	                                <label><input type="checkbox" data-column="size"> Size</label>
	                                <label><input type="checkbox" data-column="modified"> Modified</label>
	                            </div>
	                        </div>
                        <button id="toggleListButton" class="toggle-list" title="Toggle directory view"
                                aria-label="Hide directory panel">
                            <svg class="toggle-icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22"
                                 viewBox="0 0 22 22" aria-hidden="true">
                                <path class="toggle-folder"
                                      d="M2.5 18.5h17a1.5 1.5 0 0 0 1.5-1.5V9A1.5 1.5 0 0 0 19.5 7.5h-8.6l-1.8-2H4.5A1.5 1.5 0 0 0 3 7v10a1.5 1.5 0 0 0 1.5 1.5Z"/>
                                <g class="icon-inward">
                                    <path d="M5.5 12.5 H9.5 M7.8 10 L9.5 12.5 L7.8 15"/>
                                    <path d="M16.5 12.5 H12.5 M14.2 10 L12.5 12.5 L14.2 15"/>
                                </g>
                                <g class="icon-outward">
                                    <path d="M11 12.5 H6 M8 10 L6 12.5 L8 15"/>
                                    <path d="M11 12.5 H16 M13 10 L16 12.5 L13 15"/>
                                </g>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="entries">
                    <table>
                        <thead>
                        <tr>
                            <th>
                                <button type="button" class="sort-button" data-sort-key="name" aria-sort="none">
                                    Name
                                    <span class="sort-indicator" aria-hidden="true"></span>
                                </button>
                            </th>
                            <th class="col-type">Type</th>
                            <th class="col-size">
                                <button type="button" class="sort-button" data-sort-key="size" aria-sort="none">
                                    Size
                                    <span class="sort-indicator" aria-hidden="true"></span>
                                </button>
                            </th>
                            <th class="col-modified">
                                <button type="button" class="sort-button" data-sort-key="modified" aria-sort="none">
                                    Modified
                                    <span class="sort-indicator" aria-hidden="true"></span>
                                </button>
                            </th>
                            <th class="col-actions"></th>
                        </tr>
                        </thead>
                        <tbody id="entriesBody">$$entriesHTML</tbody>
                    </table>
                </div>
            </div>
            <div class="resizer" id="resizer"></div>
            <div class="panel preview">
                <div class="preview-header">
                    <div class="preview-title">
                        <span id="editorFileName" class="preview-filename"></span>
                    </div>
                    <div id="previewHeaderExtras" class="preview-header-extras"></div>
                    <div id="markdownViewActions" class="hidden">
                        <button id="toggleMarkdownViewButton" class="secondary" data-local-action="toggleMarkdownView">
                            View as text
                        </button>
                    </div>
                    <div id="editorActions" class="hidden">
                        <button id="editButton" data-local-action="editFile">Edit</button>
                    </div>
                    <div id="editingActions" class="hidden">
                        <button id="saveButton" data-local-action="saveFile">Save</button>
                        <button id="cancelButton" data-local-action="cancelEdit" class="secondary">Cancel</button>
                    </div>
                </div>
                <div id="previewNotice" class="preview-notice hidden" role="status"></div>
                <div class="preview-body">
                    <div class="preview-content">
                        <pre id="filePreview"></pre>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <div class="status" id="statusBanner"></div>
</main>
