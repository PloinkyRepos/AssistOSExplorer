<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AssistOS Explorer</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111627'/%3E%3Cpath d='M17 20h30v24H17z' fill='%236366f1'/%3E%3Cpath d='M23 26h18v4H23zm0 8h12v4H23z' fill='white'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="assets/fonts/Inter/inter.css">
    <link rel="stylesheet" href="assets/fonts/JetBrainsMono/jetbrains-mono.css">
    <link rel="stylesheet" href="shared/ui/ui-common.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="plugins.css">
</head>
<body>
<div id="page_content"></div>
<dialog id="before_webskel_loader" class="spinner" open>
    <div class="spinner-container">
        <div class="spinner-shell">
            <div class="spinner-orbit">
                <span></span><span></span><span></span>
            </div>
            <div class="spinner-caption" hidden>
                <span class="spinner-title"></span>
                <span class="spinner-subtitle"></span>
                <button type="button" class="button primary spinner-retry" data-role="runtime-retry" hidden>Retry</button>
            </div>
        </div>
    </div>
</dialog>
<script type="module" src="main.js" defer></script>
</body>
</html>
