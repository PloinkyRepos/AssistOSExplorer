<div class="backlog-create-modal">
    <div class="modal-header">
        <div class="modal-title">New task</div>
        <div class="close" data-local-action="closeModal">
            <img class="close-icon" src="./assets/icons/x-mark.svg" alt="close">
        </div>
    </div>
    <div class="modal-body">
        <div class="modal-description form-item">
            <label class="form-label" for="backlogModalDescription">Description</label>
            <textarea id="backlogModalDescription" class="form-input" rows="4" spellcheck="false"></textarea>
        </div>
        <div class="modal-options form-item">
            <div class="modal-options-header">
                <label class="form-label">Options</label>
                <button type="button" class="general-button subtle-button" data-local-action="addOption">Add option</button>
            </div>
            <div id="backlogModalOptionsList" class="modal-options-list"></div>
        </div>
    </div>
    <div class="modal-actions">
        <button type="button" class="general-button" data-local-action="createTask">Create</button>
    </div>
</div>
