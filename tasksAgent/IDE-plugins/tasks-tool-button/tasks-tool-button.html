<div class="tasks-tool">
    <button id="tasksToolButton" class="tasks-tool-button app-plugin-tool-button" type="button" role="menuitem" aria-haspopup="menu" aria-expanded="false">
        <span class="tasks-tool-button-icon app-plugin-tool-icon" aria-hidden="true">
            <img class="tasks-tool-button-icon-image app-plugin-tool-icon-image" alt="">
        </span>
        <span class="tasks-tool-button-label app-plugin-tool-label">Tasks</span>
        <svg class="tasks-tool-button-chevron" aria-hidden="true" viewBox="0 0 16 16" focusable="false">
            <path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </button>
    <div id="tasksToolMenu" class="tasks-tool-menu" role="menu" hidden>
        <button id="tasksToolNewBacklog" class="tasks-tool-menu-item" type="button" role="menuitem">
            New backlog
        </button>
        <button id="tasksToolShowAll" class="tasks-tool-menu-item" type="button" role="menuitem">
            Show all
        </button>
    </div>
</div>
