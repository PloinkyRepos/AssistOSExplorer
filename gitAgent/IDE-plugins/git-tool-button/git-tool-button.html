<button
    id="gitButton"
    class="git-tool-button"
    type="button"
    title="Commit and push with Git"
    aria-label="Open Git tools"
    data-local-action="openGitModal"
>
    <span class="git-tool-button-icon" aria-hidden="true">
        <img class="git-tool-button-icon-image" alt="" src="" />
    </span>
    <span class="git-tool-button-label">Git</span>
    <span class="git-tool-button-indicator git-conflict-indicator" aria-hidden="true">!</span>
    <span class="git-tool-button-indicator git-push-warning-indicator" aria-hidden="true">!</span>
</button>
