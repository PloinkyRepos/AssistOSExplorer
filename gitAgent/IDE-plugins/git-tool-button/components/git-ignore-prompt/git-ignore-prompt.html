<div class="git-ignore" id="gitIgnorePrompt">
    <div class="git-ignore-header">
        <div>
            <div class="git-ignore-title">Add to .gitignore</div>
            <div class="git-ignore-subtitle" id="gitIgnoreRepo"></div>
        </div>
    </div>
    <div class="git-ignore-row git-ignore-modes">
        <div class="git-ignore-mode-group">
            <button type="button" class="secondary git-ignore-mode" id="gitIgnoreModeFile" data-local-action="setIgnoreMode file" data-mode="file">Files</button>
            <button type="button" class="secondary git-ignore-mode" id="gitIgnoreModeFolder" data-local-action="setIgnoreMode folder" data-mode="folder">Folders</button>
        </div>
        <label class="git-toggle git-toggle-small">
            <input type="checkbox" id="gitIgnoreAnchor" data-ignore-change="anchor">
            Anchor to repo root
        </label>
    </div>
    <div class="git-ignore-preview" id="gitIgnorePreview"></div>
    <div class="git-ignore-row">
        <label class="git-ignore-label" for="gitIgnorePatterns">Patterns</label>
        <textarea id="gitIgnorePatterns" rows="4" placeholder="dist/\n*.log\n.env" autocomplete="off" spellcheck="false" data-ignore-input="patterns"></textarea>
    </div>
    <div class="git-ignore-actions">
        <div class="git-ignore-hint" id="gitIgnoreHint"></div>
        <div class="git-ignore-buttons">
            <button type="button" class="secondary" data-local-action="cancelGitIgnore">Cancel</button>
            <button type="button" data-local-action="saveGitIgnore">Add to .gitignore</button>
        </div>
    </div>
</div>
