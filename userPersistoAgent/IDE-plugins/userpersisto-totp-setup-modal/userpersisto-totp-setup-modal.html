<div class="modal-header">
    <div class="modal-title">Set up authenticator app</div>
    <div class="close" data-local-action="closeModal" aria-label="Close">
        <img class="close-icon" src="/explorer/assets/icons/x-mark.svg" alt="close">
    </div>
</div>

<div class="modal-body userpersisto-totp-setup-body">
    <section class="userpersisto-totp-setup">
        <div id="totpSetupStatus" class="plugin-settings-status" role="status" aria-live="polite" hidden></div>

        <div class="userpersisto-totp-grid">
            <div class="userpersisto-totp-qr-panel">
                <div id="totpQrCode" class="userpersisto-totp-qr" aria-label="Authenticator QR code"></div>
            </div>

            <div class="userpersisto-totp-content">
                <ol class="userpersisto-totp-steps">
                    <li>Open your authenticator app.</li>
                    <li>Scan the QR code or enter the setup key manually.</li>
                    <li>Enter the 6-digit code generated by the app.</li>
                </ol>

                <label class="userpersisto-totp-secret-field">
                    <span>Setup key</span>
                    <code id="totpSecret" class="userpersisto-totp-secret"></code>
                </label>

                <label class="userpersisto-totp-code-field">
                    <span>Verification code</span>
                    <div class="userpersisto-totp-code-row">
                        <input id="totpCodeInput" class="form-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" placeholder="6-digit code">
                        <button type="button" class="general-button" id="totpVerifyButton" data-local-action="verifyTotp" disabled>Verify</button>
                    </div>
                </label>
            </div>
        </div>
    </section>
</div>
